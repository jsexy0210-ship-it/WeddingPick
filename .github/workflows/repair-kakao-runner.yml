name: Repair Kakao Runner

on:
  # main CI의 API 배포 경로에서만 호출한다. 수동 재시작 우회 경로는 두지 않는다.
  workflow_call:

permissions:
  contents: read

jobs:
  repair:
    name: Repair self-hosted runner
    runs-on: [self-hosted, Linux, X64, weddingpick-kakao]
    timeout-minutes: 5
    outputs:
      restart_scheduled: ${{ steps.repair.outputs.restart_scheduled }}
    steps:
      - name: Repair runner work directory and restart
        id: repair
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const { spawnSync } = require('child_process');

            const runnerRoot = '/home/ubuntu/actions-runner';
            const configPath = runnerRoot + '/.runner';
            const tempPath = configPath + '.repair';
            const markerPath = runnerRoot + '/.runner-restart-needed';
            const restartLogPath = runnerRoot + '/.runner-restart.log';

            core.setOutput('restart_scheduled', 'false');

            if (!fs.existsSync(configPath)) {
              core.setFailed('Runner configuration was not found: ' + configPath);
              return;
            }

            const stat = fs.statSync(configPath);
            const raw = fs.readFileSync(configPath, 'utf8').replace(/^\uFEFF/, '');
            const config = JSON.parse(raw);
            const before = String(config.workFolder || '');
            const markerExists = fs.existsSync(markerPath);
            core.info('Current runner workFolder: ' + before);

            if (before !== '_work') {
              if (!before.includes('svc.sh')) {
                core.setFailed('Unexpected workFolder; refusing to overwrite: ' + before);
                return;
              }

              config.workFolder = '_work';
              fs.writeFileSync(tempPath, JSON.stringify(config, null, 2) + '\n', {
                mode: stat.mode & 0o777
              });
              fs.chmodSync(tempPath, stat.mode & 0o777);
              fs.renameSync(tempPath, configPath);
              fs.writeFileSync(markerPath, 'restart required\n', { mode: 0o600 });
              core.info('Runner workFolder changed to _work.');
            } else {
              core.info('Runner workFolder is already correct.');
            }

            const needsRestart = before !== '_work' || markerExists;
            if (!needsRestart) {
              core.info('No runner restart is needed.');
              return;
            }

            const svcPath = runnerRoot + '/svc.sh';
            const systemdRunPath = '/usr/bin/systemd-run';
            if (!fs.existsSync(svcPath)) {
              core.setFailed('Runner service helper was not found: ' + svcPath);
              return;
            }
            if (!fs.existsSync(systemdRunPath)) {
              core.setFailed('systemd-run was not found: ' + systemdRunPath);
              return;
            }

            fs.writeFileSync(
              restartLogPath,
              new Date().toISOString() + ' restart scheduled by GitHub Actions via systemd-run\n',
              { mode: 0o600 }
            );

            const restartCommand =
              '{ ' +
              'set +e; ' +
              'echo "[$(date -Is)] systemd restart unit started"; ' +
              'cd "' + runnerRoot + '"; ' +
              'echo "[$(date -Is)] stopping runner service"; ' +
              './svc.sh stop; ' +
              'stop_status=$?; ' +
              'echo "[$(date -Is)] stop_status=$stop_status"; ' +
              'sleep 2; ' +
              'echo "[$(date -Is)] starting runner service"; ' +
              './svc.sh start; ' +
              'start_status=$?; ' +
              'echo "[$(date -Is)] start_status=$start_status"; ' +
              'if [ "$stop_status" -eq 0 ] && [ "$start_status" -eq 0 ]; then ' +
              'rm -f "' + markerPath + '"; ' +
              'echo "[$(date -Is)] restart succeeded; marker cleared"; ' +
              'exit 0; ' +
              'else ' +
              'echo "[$(date -Is)] restart failed; marker retained"; ' +
              'exit 1; ' +
              'fi; ' +
              '} >> "' + restartLogPath + '" 2>&1';

            const suffix = String(process.env.GITHUB_RUN_ID || 'manual') + '-' +
              String(process.env.GITHUB_RUN_ATTEMPT || '1');
            const unitName = 'weddingpick-runner-restart-' +
              suffix.replace(/[^A-Za-z0-9_.-]/g, '-');

            const scheduled = spawnSync(
              'sudo',
              [
                '-n',
                systemdRunPath,
                '--unit=' + unitName,
                '--on-active=8s',
                '--collect',
                '/bin/bash',
                '-lc',
                restartCommand
              ],
              { encoding: 'utf8' }
            );

            if (scheduled.status !== 0) {
              const detail = String(scheduled.stderr || scheduled.stdout || '').trim();
              core.setFailed(
                'Failed to schedule runner restart with systemd-run' +
                (detail ? ': ' + detail : '')
              );
              return;
            }

            core.info(String(scheduled.stdout || '').trim());
            core.setOutput('restart_scheduled', 'true');
            core.info('Runner restart scheduled with systemd-run in 8 seconds.');

  restart-window:
    name: Wait for scheduled restart
    needs: repair
    if: needs.repair.outputs.restart_scheduled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Keep dependent self-hosted jobs off the runner
        shell: bash
        run: |
          set -euo pipefail
          # repair job은 systemd timer로 8초 뒤 stop, 그 뒤 2초 뒤 start를 예약한다.
          # 다음 self-hosted job이 그 사이 배정되지 않도록 reusable workflow 안에서
          # GitHub-hosted job이 의존성 장벽을 유지한다.
          # stop 예약(8초) + start 전 대기(2초) 이후 서비스 기동/runner 재등록 시간을
          # 충분히 확보한다. verify job이 너무 빨리 같은 runner에 잡히는 race를 줄인다.
          sleep 30

  verify-restart:
    name: Verify repaired runner
    needs: [repair, restart-window]
    if: needs.repair.outputs.restart_scheduled == 'true' && needs.restart-window.result == 'success'
    runs-on: [self-hosted, Linux, X64, weddingpick-kakao]
    timeout-minutes: 2
    steps:
      - name: Verify restart marker cleared
        shell: bash
        run: |
          set -euo pipefail
          runner_root=/home/ubuntu/actions-runner
          marker="$runner_root/.runner-restart-needed"
          restart_log="$runner_root/.runner-restart.log"
          config="$runner_root/.runner"

          if [ -e "$marker" ]; then
            echo "Runner restart marker still exists; refusing to release dependent jobs." >&2
            if [ -f "$restart_log" ]; then
              echo "----- runner restart log -----" >&2
              cat "$restart_log" >&2
              echo "----- end runner restart log -----" >&2
            else
              echo "Runner restart log is missing: $restart_log" >&2
            fi
            exit 1
          fi

          if [ -f "$restart_log" ]; then
            echo "----- runner restart log -----"
            cat "$restart_log"
            echo "----- end runner restart log -----"
          fi

          python3 - "$config" <<'PY'
          import codecs
          import json
          import sys

          path = sys.argv[1]
          with open(path, "rb") as handle:
              raw = handle.read()
          if raw.startswith(codecs.BOM_UTF8):
              raw = raw[len(codecs.BOM_UTF8):]
          config = json.loads(raw.decode("utf-8"))
          if config.get("workFolder") != "_work":
              raise SystemExit("Runner workFolder is not _work after restart.")
          PY

          echo "Runner restart completed; marker cleared and workFolder is _work."
