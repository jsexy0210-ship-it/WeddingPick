name: Validate PR345 current

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'chatgpt/fix-worker-cutover-restore-20260918-2'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Worker cutover rollback regression
        run: |
          bash -n scripts/update-kakao-worker.sh
          node --test scripts/verification/worker-cutover-restore.test.mjs
