name: Validate PR377 storage smoke

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'chatgpt/kakao-storage-rw-smoke-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Shell syntax
        run: bash -n scripts/probe-kakao-storage-rw.sh
      - name: Embedded Node syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('scripts/probe-kakao-storage-rw.sh').read_text()
          marker = "<<'NODE'\n"
          start = source.index(marker) + len(marker)
          end = source.index('\nNODE\n', start)
          Path('/tmp/storage-probe.js').write_text(source[start:end])
          PY
          node --check /tmp/storage-probe.js
      - name: Workflow safety policy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/kakao-storage-rw-smoke.yml').read_text()
          required = [
              'workflow_dispatch:',
              'environment: production',
              'runs-on: [self-hosted, Linux, X64, weddingpick-kakao]',
              'actions/checkout@v5',
              'bash ./scripts/probe-kakao-storage-rw.sh',
          ]
          for needle in required:
              assert needle in text, needle
          assert 'push:' not in text
          assert 'pull_request:' not in text
          PY
