name: Validate PR340 current
on:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    if: github.head_ref == 'chatgpt/fix-live-favicon-rollback-20260918-2'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: |
          bash -n scripts/unify-live-favicon.sh
          node --test scripts/verification/live-favicon-rollback.test.mjs
