name: Validate search pending-pick branch

on:
  push:
    branches:
      - 'chatgpt/search-vendor-design-277-20260918'

permissions:
  contents: read

concurrency:
  group: validate-search-pending-pick-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Mobile typecheck
        run: npm run typecheck --workspace @weddingpick/mobile
      - name: Mobile lint
        run: npm run lint --workspace @weddingpick/mobile
      - name: Auth hardening harness
        run: npm run test:auth-hardening
      - name: Root entry harness
        run: npm run test:root-entry
      - name: Mobile regression
        run: npm run test --workspace @weddingpick/mobile -- --runInBand
      - name: Expo web export
        run: npm run export:web --workspace @weddingpick/mobile
