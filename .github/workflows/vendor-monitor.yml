# 공공데이터 업체 수집을 사람이 들여다보는 자리.
#
# 수집 자체는 `Wedding public data`가 한다. 이것은 그 결과를 **본다** —
# 무엇이 바뀌었나, 수집이 무엇을 사람에게 넘겼나, 응답에서 사라진 곳은 어디인가.
#
# **크론이 없다.** 무인 실행 금지가 이 저장소의 현재 방침이고(public-data.yml의
# 크론이 주석 처리된 이유가 그것이다), 여기는 업체를 지울 수 있는 자리라 더 그렇다.
# 주 1회 사람이 workflow_dispatch로 돌린다.
#
# 출력은 집계 숫자 · 사유 이름 · vendor_id뿐이다. 업체명과 바뀐 값은 찍지 않는다 —
# 이 로그는 GitHub Actions에 남고, 남으면 지우기 어렵다.
name: 업체 수집 모니터

on:
  workflow_dispatch:
    inputs:
      job:
        description: '무엇을 볼 것인가'
        type: choice
        default: changes
        options:
          # 바뀐 것과 보류된 것을 센다. DB를 읽기만 한다.
          - changes
          # 이번 수집에 없어진 업체를 가려낸다. 세기만 하고 바꾸지 않는다.
          - retire-check
          # 위와 같은 판정을 실제로 반영한다. main에서만, apply를 켤 때만 돈다.
          - retire-apply
      target:
        description: '어느 DB를 볼 것인가'
        type: choice
        default: production
        options:
          - production
          - default
          - staging
      source:
        description: '어느 출처를 볼 것인가'
        type: choice
        default: sbiz-all
        options:
          - sbiz-all
          - sbiz-seoul
          - sbiz-gyeonggi
          - icheon-halls
          - jecheon-halls
      days:
        description: '며칠치 변경을 볼 것인가(changes)'
        type: string
        default: '14'
      apply:
        description: '정말로 반영한다(retire-apply에서만 의미가 있다)'
        type: boolean
        default: false

permissions:
  contents: read

# 수집과 같은 DB를 만지므로 수집이 도는 동안 겹치지 않게 한다.
concurrency:
  group: wedding-public-data
  cancel-in-progress: false

jobs:
  changes:
    if: inputs.job == 'changes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 무엇이 바뀌었나
        env:
          # 셋 다 넘기고 아래에서 고른다. 값 자체는 어디에도 찍지 않는다.
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DEFAULT_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          TARGET: ${{ inputs.target }}
          SOURCE: ${{ inputs.source }}
          DAYS: ${{ inputs.days }}
        run: |
          set -euo pipefail
          case "${TARGET:-production}" in
            production) export DATABASE_URL="$PRODUCTION_DATABASE_URL" ;;
            staging)    export DATABASE_URL="$STAGING_DATABASE_URL" ;;
            *)          export DATABASE_URL="$DEFAULT_DATABASE_URL" ;;
          esac
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::${TARGET:-production} 대상의 접속 정보가 GitHub Secrets에 없다."
            exit 1
          fi
          echo "대상: ${TARGET:-production}"
          npx tsx scripts/vendor-collection-monitor.ts --days "${DAYS:-14}" --source "$SOURCE"

  # 없어진 업체를 가려낸다.
  #
  # **먼저 수집을 새로 돌린다.** 지난주 산출물로 이번 폐업을 판정하지 않는다 —
  # 산출물은 7일이면 만료되고, 그 사이 응답이 달라졌을 수 있다. 같은 잡 안에서
  # 받은 응답과 DB를 맞춰야 「응답에 없다」가 근거가 된다. 여기 수집은 --apply를
  # 붙이지 않으므로 아무것도 쓰지 않는다.
  retire:
    if: inputs.job == 'retire-check' || inputs.job == 'retire-apply'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # secrets를 잡 표현식에서 바로 못 읽으므로 env로 옮겨 담는다(public-data.yml과 같은 이유).
      SBIZ_API_KEY: ${{ secrets.SBIZ_API_KEY }}
      SBIZ_UPJONG_CODES: ${{ vars.SBIZ_UPJONG_CODES }}
      SBIZ_UPJONG_DIV_ID: ${{ vars.SBIZ_UPJONG_DIV_ID }}
      SOURCE: ${{ inputs.source }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: 이번 응답을 새로 받는다
        run: npm run public-data:import --workspace @weddingpick/api -- --source "$SOURCE" --out ../../.collection

      - name: 전수인지 확인한다
        run: |
          set -euo pipefail
          REPORT=".collection/$SOURCE-report.json"
          if [ ! -f "$REPORT" ]; then
            echo "::error::$REPORT 이 없다. 수집이 리포트를 남기지 못했다."
            exit 1
          fi
          # 전수가 아니면 아래 도구가 스스로 거부하지만, 잡 요약에도 남긴다.
          node -e "
            const r = require('./$REPORT');
            const t = r.truncated ?? [];
            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
              '### ' + r.source + ' — 없어진 업체 판정용 수집',
              '',
              '| 받아들임 | 전수인가 |',
              '| --- | --- |',
              '| ' + r.accepted + ' | ' + (t.length ? '아니다(' + t.length + '개 업종 상한) — 판정하지 않는다' : '그렇다') + ' |',
              '',
            ].join('\n'));
          "

      - name: 없어진 업체를 가려낸다
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DEFAULT_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          TARGET: ${{ inputs.target }}
          # 세 가지가 모두 참일 때만 실제로 쓴다. 하나라도 아니면 세기만 한다.
          YES_FLAG: ${{ (inputs.job == 'retire-apply' && inputs.apply && github.ref == 'refs/heads/main') && '--yes' || '' }}
        run: |
          set -euo pipefail
          case "${TARGET:-production}" in
            production) export DATABASE_URL="$PRODUCTION_DATABASE_URL" ;;
            staging)    export DATABASE_URL="$STAGING_DATABASE_URL" ;;
            *)          export DATABASE_URL="$DEFAULT_DATABASE_URL" ;;
          esac
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::${TARGET:-production} 대상의 접속 정보가 GitHub Secrets에 없다."
            exit 1
          fi
          echo "대상: ${TARGET:-production}"
          if [ -z "${YES_FLAG:-}" ]; then
            echo "확인만 한다 — 반영하려면 main에서 job=retire-apply · apply=true로 돌린다."
          fi
          npx tsx scripts/vendor-retire-missing.ts \
            --source "$SOURCE" --collection .collection ${YES_FLAG:+$YES_FLAG}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vendor-retire-${{ inputs.source }}
          path: .collection/*.json
          # .collection은 점으로 시작해 숨김으로 취급된다 — 이 줄이 없으면 비어서 올라간다.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
