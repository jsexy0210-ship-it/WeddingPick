# Neon DB에 마이그레이션을 적용한다. 수동으로 한 번 돌린다.
#
# DATABASE_URL GitHub Secret이 있어야 한다.
# 멱등하다 — 이미 적용된 버전은 건너뛴다.
name: DB Migrate

on:
  workflow_dispatch:
  # 이번 박람회 스키마는 API/관리자 배포 전에 production DB에 반드시 필요하다.
  # 범용 migrations/** 자동 적용이 아니라 0426 한 파일에만 묶어 위험 범위를 제한한다.
  push:
    branches: [main]
    paths:
      - packages/db/migrations/0426_expo_collection_thumbnail.sql

permissions:
  contents: read

jobs:
  migrate:
    environment: production
    runs-on: ubuntu-latest
    concurrency:
      group: weddingpick-kakao-vm-write
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run migrate --workspace @weddingpick/db
