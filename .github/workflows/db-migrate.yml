# Neon DB에 마이그레이션을 적용한다. 수동으로 한 번 돌린다.
#
# DATABASE_URL GitHub Secret이 있어야 한다.
# 멱등하다 — 이미 적용된 버전은 건너뛴다.
name: DB Migrate

on:
  workflow_dispatch:
  # 운영 코드가 참조하는 최근 스키마는 API/관리자 배포 전에 production DB에 반드시 필요하다.
  # 범용 migrations/** 전체 자동 적용 대신, 검증된 현재 migration 파일과 이 workflow 자체에만 묶는다.
  # workflow 자체 변경도 트리거에 넣어 새 migration을 추가하는 커밋에서 한 번은 반드시 실행되게 한다.
  push:
    branches: [main]
    paths:
      - .github/workflows/db-migrate.yml
      - packages/db/migrations/0426_expo_collection_thumbnail.sql
      - packages/db/migrations/0427_consultation_event_idempotency.sql
      - packages/db/migrations/0428_wedding_feed_body_image.sql
      - packages/db/migrations/0429_pick_favorites_unlimited.sql

permissions:
  contents: read

jobs:
  migrate:
    environment: production
    runs-on: ubuntu-latest
    concurrency:
      # DB는 Neon에만 쓰고 VM 파일을 건드리지 않는다. 승인 대기 중인 API 배포가 DB 적용을 막지 않게 분리한다.
      group: weddingpick-db-migrate
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run migrate --workspace @weddingpick/db
