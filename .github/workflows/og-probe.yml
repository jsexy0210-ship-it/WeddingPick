name: 공유 링크 미리보기 확인 (읽기 전용)

# 카드가 실제로 나가는지 배포된 주소에서 확인한다. 저장소를 읽는 것으로는 확인이
# 끝나지 않는다 — 크롤러가 읽는 것은 배포된 정적 HTML이다.
#
# 아무것도 바꾸지 않는다. 비밀 값도 쓰지 않는다 — 공개 주소만 받는다.

on:
  workflow_dispatch:
    inputs:
      web_origin:
        description: '공유 링크를 확인할 공개 웹사이트 origin'
        required: false
        default: 'https://210.109.82.212:9443'
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: 확인
        env:
          WEDDINGPICK_WEB_ORIGIN: ${{ inputs.web_origin }}
        run: python3 scripts/og-probe.py
