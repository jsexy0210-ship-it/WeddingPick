name: 공유 링크 미리보기 확인 (읽기 전용)

# 카드가 실제로 나가는지 배포된 주소에서 확인한다. 저장소를 읽는 것으로는 확인이
# 끝나지 않는다 — 크롤러가 읽는 것은 배포된 정적 HTML이다.
#
# 아무것도 바꾸지 않는다. 비밀 값도 쓰지 않는다 — 공개 주소만 받는다.

on:
  workflow_dispatch:
  schedule:
    # 매일 00:10 UTC = 09:10 KST. 배포가 카드를 떨어뜨린 것을 다음 날 아침에 안다.
    - cron: '10 0 * * *'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 확인
        run: python3 scripts/og-probe.py
