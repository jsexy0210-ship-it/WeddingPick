# 다 쓴 브랜치를 정리한다.
#
# 컨테이너에서는 브랜치를 지울 수 없다 — `git push --delete`가 게이트웨이에서
# 403으로 막힌다. 그래서 지우는 일만 이쪽으로 옮긴다.
#
# **목록을 미리 적어 두지 않는다.** 사람이 센 목록은 적는 순간부터 낡고, 낡은
# 목록으로 지우면 그 사이에 살아난 브랜치를 지운다. 돌 때마다 다시 센다.
#
# 지우는 조건은 넷이고 **전부** 맞아야 한다.
#
#   1. main과 파일 차이가 0        하려던 일이 이미 main에 있다
#   2. 열린 PR이 없다              누가 아직 보고 있는 브랜치가 아니다
#   3. 마지막 커밋이 N일보다 오래됐다  방금 만든 브랜치를 지우지 않는다
#   4. 보호 목록에 없다
#
# 1번을 `git branch --merged`로 판단하지 않는다. 이 저장소는 스쿼시 머지를 써서
# 원본 커밋 SHA가 main에 남지 않고, 그래서 내용이 다 들어간 브랜치도 「머지 안 됨」
# 으로 세어진다. 실제로 102 대 81로 갈렸다. 파일 차이를 직접 본다.
#
# 기본은 시늉만 한다(`dry_run: true`). 무엇을 지울지 먼저 보고 실행한다.
name: 브랜치 정리

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '지우지 않고 목록만 본다'
        type: boolean
        default: true
      min_age_days:
        description: '이 일수보다 새 브랜치는 건드리지 않는다'
        type: string
        default: '3'
      include_unmerged:
        description: '내용이 main에 없는 브랜치도 지운다 (2026-09-14 대표 지시로 한 번 씀)'
        type: boolean
        default: false
      protect:
        description: '지킬 브랜치 (쉼표로 구분). 기본값은 살아 있는 전담 브랜치다'
        type: string
        # 살아 있는 전담 브랜치와 아직 흡수되지 않은 것. 비워 두면 본선만 지켜지고,
        # 「마지막 커밋이 오래됐다」 조건에 걸리는 순간 돌고 있는 세션의 브랜치가
        # 지워진다 — 나이로 걸러지는 것은 우연이지 보호가 아니다.
        # 세션이 끝나면 여기서 뺀다. 그때 비로소 정리 대상이 된다.
        #
        # 2026-09-14: `claude/rn-*` 여덟을 더한다. 같은 날 #224로 `include_unmerged`가
        # 본선에 올라왔는데, 그 넷은 **「열린 PR」 보호막 밖**이었다 — PR을 아직 안 건
        # 브랜치가 다섯이었고 그중 `rn-migration-plan`은 1단계 설계 문서 넷을 그 안에만
        # 들고 있었다. 두 가지가 겹치면 「지울 것」 목록에 그대로 들어간다.
        # 지운 뒤 되살릴 길은 요약에 적히는 SHA 하나뿐이라, 겹치기 전에 막는다.
        #
        # 2026-09-15: **살아 있는 브랜치 열둘을 더한다.** 재어 보니 원격 작업 브랜치 23개 중
        # **열하나가 보호 밖**이었고 거기에 `claude/figma-integration`이 들어 있었다 — RN 화면
        # 통합 · 상담기록 전체 · 규칙 md 세 벌 · 피그마 규격서가 전부 그 하나에 있다.
        #
        # 그날 RN PR 넷(#222 · #226 · #228 · #229)을 닫았다. **내용이 이 브랜치에 다 들어가서
        # 중복 PR을 접은 것**이지 작업을 버린 것이 아니다. 다만 닫는 순간 그 넷은 「열린 PR」
        # 보호막에서 빠졌고, 정작 내용을 들고 있는 브랜치는 처음부터 목록에 없었다.
        # **접는 쪽과 지키는 쪽이 따로 놀면 이렇게 된다.**
        #
        # 이 워크플로는 `workflow_dispatch`뿐이라 스스로 돌지 않는다. 그래서 급하지는 않지만,
        # 누군가 손으로 한 번 돌리는 순간 되살릴 길은 요약에 적히는 SHA 하나뿐이다.
        default: 'claude/weddingpick-master-bootstrap-6j1c7o,claude/rn-tokens,claude/rn-components,claude/rn-nav-auth,claude/rn-screens-core,claude/rn-screens-vendor,claude/rn-screens-plan,claude/rn-migration-plan,claude/rn-preview,claude/policy-gemini-audio,claude/activity-ledger,claude/image-no-hotlink,claude/public-data-unify,claude/admin-console,claude/webview-design,claude/inapp-browser,claude/admin-accounts,claude/admin-split,claude/badge-clipping,claude/retention-3,release/public-data-sbiz-key-guard,claude/figma-integration,claude/figma-pixel-parity,claude/design-policy-audit,claude/identity-purge,claude/figma-missing-screens,claude/public-data-resume,claude/report-manual-entry,claude/approval-queue,claude/perf-audit,claude/alimtalk-channel,claude/data-collect-refine-d1d3,claude/weddingpick-data-collection-q72atr'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 얕은 클론에서는 브랜치와 본선에 공통 조상이 없어 아래 git diff가
      # `no merge base`로 죽는다. 그 빈 출력을 「차이 0」으로 읽으면
      # **살아 있는 브랜치를 지운다.** 2026-09-10 조사에서 실제로 그랬다 —
      # 얕은 클론에서 82개, 전체 클론에서 17개가 나왔다.
      - name: 클론이 얕지 않은지 확인한다
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
            echo '::error::클론이 얕다. checkout의 fetch-depth가 0이어야 차이를 옳게 센다.'
            exit 1
          fi

      - name: 세고 지운다
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          MIN_AGE_DAYS: ${{ github.event.inputs.min_age_days }}
          EXTRA_PROTECT: ${{ github.event.inputs.protect }}
          INCLUDE_UNMERGED: ${{ github.event.inputs.include_unmerged }}
        run: |
          set -euo pipefail

          DEFAULT_BRANCH=$(gh repo view --json defaultBranchRef --jq .defaultBranchRef.name)
          echo "본선: $DEFAULT_BRANCH"

          # 열린 PR이 head로 쓰는 브랜치는 건드리지 않는다. 사람이 아직 보고 있다.
          gh pr list --state open --limit 500 --json headRefName --jq '.[].headRefName' \
            | sort -u > /tmp/open-pr-heads.txt
          echo "열린 PR의 브랜치: $(wc -l < /tmp/open-pr-heads.txt)개"

          cutoff=$(( $(date +%s) - MIN_AGE_DAYS * 86400 ))

          # 보호 목록. 본선은 무슨 일이 있어도 지우지 않는다.
          printf '%s\n' "$DEFAULT_BRANCH" > /tmp/protect.txt
          if [ -n "${EXTRA_PROTECT:-}" ]; then
            printf '%s' "$EXTRA_PROTECT" | tr ',' '\n' | sed 's/^ *//; s/ *$//' \
              | grep -v '^$' >> /tmp/protect.txt || true
          fi

          : > /tmp/delete.txt
          : > /tmp/keep.txt
          : > /tmp/unmerged.txt

          for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin \
                       | grep -v '^origin/HEAD$' | sed 's|^origin/||'); do
            if grep -Fxq "$ref" /tmp/protect.txt; then
              echo "지킴(보호 목록)  $ref" >> /tmp/keep.txt; continue
            fi
            if grep -Fxq "$ref" /tmp/open-pr-heads.txt; then
              echo "지킴(열린 PR)    $ref" >> /tmp/keep.txt; continue
            fi

            last=$(git log -1 --format=%ct "origin/$ref")
            if [ "$last" -gt "$cutoff" ]; then
              echo "지킴(최근)       $ref" >> /tmp/keep.txt; continue
            fi

            # 파일 차이가 0이어야 한다. --merged를 쓰지 않는 이유는 위 주석에 있다.
            #
            # `include_unmerged`를 켜면 이 조건만 건너뛴다. 보호 목록 · 열린 PR ·
            # 나이 셋은 그대로 걸린다 — 이 조건 하나가 「안 들어간 내용이 있다」를
            # 보는 유일한 자리이고, 끄면 **아직 살아 있는 작업도 지운다.**
            # 아래 SHA 기록이 유일한 복구 수단이므로 요약을 반드시 남긴다.
            changed=$(git diff --name-only "origin/$DEFAULT_BRANCH...origin/$ref" | wc -l)
            if [ "$changed" -ne 0 ]; then
              if [ "${INCLUDE_UNMERGED:-false}" != "true" ]; then
                echo "지킴(차이 ${changed}파일) $ref" >> /tmp/keep.txt; continue
              fi
              echo "지움(차이 ${changed}파일 · include_unmerged) $ref" >> /tmp/unmerged.txt
            fi

            printf '%s %s\n' "$(git rev-parse "origin/$ref")" "$ref" >> /tmp/delete.txt
          done

          echo
          echo "== 지울 것 $(wc -l < /tmp/delete.txt)개 =="
          # SHA를 함께 남긴다. 지운 뒤에도
          # git push origin <SHA>:refs/heads/<이름> 으로 되살릴 수 있다.
          cat /tmp/delete.txt || true
          echo
          echo "== 남길 것 $(wc -l < /tmp/keep.txt)개 =="
          cat /tmp/keep.txt || true

          {
            echo "## 브랜치 정리"
            echo
            echo "지울 것 **$(wc -l < /tmp/delete.txt)개** · 남길 것 **$(wc -l < /tmp/keep.txt)개**"
            echo
            echo '지운 브랜치는 아래 SHA로 되살린다: `git push origin <SHA>:refs/heads/<이름>`'
            echo
            echo '```'
            cat /tmp/delete.txt || true
            echo '```'
            if [ -s /tmp/unmerged.txt ]; then
              echo
              echo "### 내용이 main에 없는데 지운 것 **$(wc -l < /tmp/unmerged.txt)개**"
              echo
              echo '위 SHA 목록이 유일한 복구 수단이다. 이 요약을 지우지 않는다.'
              echo
              echo '```'
              cat /tmp/unmerged.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # 명시적으로 false일 때만 지운다. 값이 비어 있는 경우(dispatch가 아닌
          # 방법으로 불렸을 때)를 「지워도 된다」로 읽지 않는다.
          if [ "$DRY_RUN" != "false" ]; then
            echo
            echo "시늉만 했다. 실제로 지우려면 dry_run을 끄고 다시 돌린다."
            exit 0
          fi

          while read -r sha ref; do
            [ -z "${ref:-}" ] && continue
            echo "지움 $ref ($sha)"
            git push origin --delete "$ref"
          done < /tmp/delete.txt
