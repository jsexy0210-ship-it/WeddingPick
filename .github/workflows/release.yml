# 앱 릴리즈 — EAS iOS·Android 빌드 및 스토어 제출
#
# main push마다 실행하지 않는다. 릴리즈 시에만 수동 실행.
#
# ── iOS 빌드 전제 조건 ──────────────────────────────────────────────────
#
#   ASC API Key (Admin 권한): Key ID 62U8N2ZWJR
#   EAS가 이 키로 Distribution Certificate·Provisioning Profile을 자동 생성·관리한다.
#
#   처음 실행하기 전, 또는 "Distribution Certificate is not validated" 오류가 나면:
#   expo.dev → 프로젝트 → Credentials → iOS → Distribution Certificate → Delete
#   삭제 후 EAS가 Admin 키로 새 인증서를 자동 발급한다.
#
# ── Android 빌드 ────────────────────────────────────────────────────────
#
#   EAS가 Keystore를 자동 관리한다 (이미 설정됨).
#
# ── Google Play 제출 ────────────────────────────────────────────────────
#
#   계정 본인확인 제한이 풀려(2026-09-09) submit-android 잡을 활성화했다.
#
#   EAS가 Google Play에 올리려면 Google Play 서비스 계정 JSON이 필요하다.
#   `apps/mobile/eas.json`의 `submit.production`은 비어 있으므로, 자격이
#   expo.dev(EAS credentials)에 올라가 있어야 제출이 성공한다. 없으면
#   Play Console → 설정 → API 액세스에서 서비스 계정을 만들어 JSON을 받고
#   `eas credentials`로 등록해야 한다. 이 워크플로는 키 파일을 다루지 않는다.
#
#   트랙을 지정하지 않았으므로 EAS 기본값인 internal 트랙으로 올라간다.
#   공개 트랙으로 바꾸려면 eas.json의 `submit.production.android.track`을 정한다.
#
# 필요한 GitHub Secrets:
#   EXPO_TOKEN                        expo.dev Access Tokens에서 발급
#   EAS_ASC_KEY_P8_BASE64             Admin ASC API Key .p8 파일의 base64
#   EXPO_APPLE_ID                     애플 개발자 계정 이메일 (submit 전용)
#   EXPO_APPLE_APP_SPECIFIC_PASSWORD  앱 암호 appleid.apple.com (submit 전용)
name: Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 빌드 플랫폼
        type: choice
        options: [all, ios, android]
        default: all
        required: true
      submit:
        description: 빌드 완료 후 스토어 제출 (iOS → TestFlight, Android → Google Play internal 트랙)
        type: boolean
        default: false

jobs:
  validate:
    name: 사전 검증
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm i -g eas-cli

      - run: npm ci

      - name: 필수 조건 확인
        run: |
          set -euo pipefail
          fail=0

          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN 시크릿이 없습니다."
            fail=1
          fi

          if [ "${{ inputs.platform }}" = "ios" ] || [ "${{ inputs.platform }}" = "all" ]; then
            if [ -z "$EAS_ASC_KEY_P8_BASE64" ]; then
              echo "::error::iOS 빌드에는 EAS_ASC_KEY_P8_BASE64 시크릿이 필요합니다."
              fail=1
            fi
          fi

          if ! grep -q '"projectId"' apps/mobile/app.json; then
            echo "::error::app.json에 EAS projectId가 없습니다. eas-init 워크플로를 먼저 실행하세요."
            fail=1
          fi

          exit $fail
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_ASC_KEY_P8_BASE64: ${{ secrets.EAS_ASC_KEY_P8_BASE64 }}

  build-ios:
    name: iOS Production Build
    needs: [validate]
    if: inputs.platform == 'ios' || inputs.platform == 'all'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm i -g eas-cli

      - run: npm ci

      - name: ASC API Key 설정
        run: |
          echo "$EAS_ASC_KEY_P8_BASE64" | base64 -d > /tmp/AuthKey_62U8N2ZWJR.p8
          chmod 600 /tmp/AuthKey_62U8N2ZWJR.p8
        env:
          EAS_ASC_KEY_P8_BASE64: ${{ secrets.EAS_ASC_KEY_P8_BASE64 }}

      - name: Build
        working-directory: apps/mobile
        run: eas build --platform ios --profile production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_ASC_KEY_ID: 62U8N2ZWJR
          EXPO_ASC_ISSUER_ID: a7e4029d-6abf-4811-80a7-9cc47c1d1e21
          EXPO_ASC_API_KEY_PATH: /tmp/AuthKey_62U8N2ZWJR.p8

  submit-ios:
    name: iOS → TestFlight 제출
    needs: [build-ios]
    if: |
      (inputs.platform == 'ios' || inputs.platform == 'all') &&
      inputs.submit == true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm i -g eas-cli

      - run: npm ci

      - name: Submit to TestFlight
        working-directory: apps/mobile
        run: eas submit --platform ios --latest --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_ID: ${{ secrets.EXPO_APPLE_ID }}
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}

  build-android:
    name: Android Production Build
    needs: [validate]
    if: inputs.platform == 'android' || inputs.platform == 'all'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm i -g eas-cli

      - run: npm ci

      - name: Build
        working-directory: apps/mobile
        run: eas build --platform android --profile production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  submit-android:
    name: Android → Google Play 제출
    needs: [build-android]
    # 원래 주석은 `inputs.platform` 조건만 지시했지만, 그러면 submit 체크를
    # 끄고 돌린 안드로이드 빌드도 매번 스토어로 올라간다. submit-ios와 같은
    # 게이트를 걸어 사용자가 체크했을 때만 제출한다.
    if: |
      (inputs.platform == 'android' || inputs.platform == 'all') &&
      inputs.submit == true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm i -g eas-cli

      - run: npm ci

      - name: Submit to Google Play
        working-directory: apps/mobile
        run: eas submit --platform android --latest --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
