# 앱 릴리즈 — EAS iOS·Android 빌드 및 스토어 제출
#
# main push마다 실행하지 않는다. 릴리즈 시에만 수동 실행.
#
# ── iOS 빌드 전제 조건 ──────────────────────────────────────────────────
#
#   GitHub Secrets에 EAS_ASC_KEY_P8_BASE64가 등록되어 있어야 한다.
#   (AuthKey_NPCMZ655GG.p8 파일을 base64로 인코딩한 값)
#
#   워크플로우가 base64 디코딩 후 .p8 파일을 써서 EAS에 직접 전달한다:
#     EXPO_APPLE_API_KEY_ID        NPCMZ655GG
#     EXPO_APPLE_API_KEY_ISSUER_ID a7e4029d-6abf-4811-80a7-9cc47c1d1e21
#     EXPO_APPLE_API_KEY_PATH      /tmp/AuthKey_NPCMZ655GG.p8
#
#   EAS가 ASC API Key로 Distribution Certificate·Provisioning Profile을
#   자동 생성·관리한다.
#
# ── Android 빌드 ────────────────────────────────────────────────────────
#
#   EAS가 Keystore를 자동 관리한다 (이미 설정됨).
#
# ── Google Play 제출 ────────────────────────────────────────────────────
#
#   계정 본인확인 제한으로 비활성 상태.
#   제한 해제 후 submit-android 잡 주석을 해제하면 된다.
#
# 필요한 GitHub Secrets:
#   EXPO_TOKEN                        expo.dev Access Tokens에서 발급
#   EAS_ASC_KEY_P8_BASE64             AuthKey_NPCMZ655GG.p8 파일을 base64 인코딩한 값
#   EXPO_APPLE_ID                     애플 개발자 계정 이메일 (submit 전용)
#   EXPO_APPLE_APP_SPECIFIC_PASSWORD  앱 암호 appleid.apple.com (submit 전용)
name: Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 빌드 플랫폼
        type: choice
        options: [all, ios, android]
        default: all
        required: true
      submit:
        description: 빌드 완료 후 TestFlight 제출 (iOS만, Android Google Play는 비활성)
        type: boolean
        default: false

jobs:
  validate:
    name: 사전 검증
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm i -g eas-cli

      - run: npm ci

      - name: 필수 조건 확인
        run: |
          set -euo pipefail
          fail=0

          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN 시크릿이 없습니다."
            fail=1
          fi

          if ! grep -q '"projectId"' apps/mobile/app.json; then
            echo "::error::app.json에 EAS projectId가 없습니다. eas-init 워크플로를 먼저 실행하세요."
            fail=1
          fi

          exit $fail
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  build-ios:
    name: iOS Production Build
    needs: [validate]
    if: inputs.platform == 'ios' || inputs.platform == 'all'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm i -g eas-cli

      - run: npm ci

      - name: ASC API Key 설정
        run: |
          echo "$EAS_ASC_KEY_P8_BASE64" | base64 -d > /tmp/AuthKey_NPCMZ655GG.p8
          chmod 600 /tmp/AuthKey_NPCMZ655GG.p8
        env:
          EAS_ASC_KEY_P8_BASE64: ${{ secrets.EAS_ASC_KEY_P8_BASE64 }}

      - name: Build
        working-directory: apps/mobile
        run: eas build --platform ios --profile production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_API_KEY_ID: NPCMZ655GG
          EXPO_APPLE_API_KEY_ISSUER_ID: a7e4029d-6abf-4811-80a7-9cc47c1d1e21
          EXPO_APPLE_API_KEY_PATH: /tmp/AuthKey_NPCMZ655GG.p8

  submit-ios:
    name: iOS → TestFlight 제출
    needs: [build-ios]
    if: |
      (inputs.platform == 'ios' || inputs.platform == 'all') &&
      inputs.submit == true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm i -g eas-cli

      - run: npm ci

      - name: Submit to TestFlight
        working-directory: apps/mobile
        run: eas submit --platform ios --latest --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_ID: ${{ secrets.EXPO_APPLE_ID }}
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}

  build-android:
    name: Android Production Build
    needs: [validate]
    if: inputs.platform == 'android' || inputs.platform == 'all'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm i -g eas-cli

      - run: npm ci

      - name: Build
        working-directory: apps/mobile
        run: eas build --platform android --profile production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

