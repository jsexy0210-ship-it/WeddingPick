# 업종별 샘플 업체 20곳씩을 스테이징 DB에 넣거나 걷어낸다 — 화면 검수용(2026-09-08 오더).
# images = 샘플 업체 사진을 카카오(다음) 이미지 검색 결과로 바꾼다(검수용 · 출시 전 교체).
#   로그인용 카카오 앱의 REST API 키를 infra/render-env.yml에서 읽어 쓴다 — 별도 시크릿 없음.
#
# 저장소의 apps/api/src/seed-samples.ts를 그대로 쓴다. 고정 시드라 몇 번을 돌려도
# 같은 업체만 있고, remove는 vendor_source_records(source_key='sample') 표시를
# 따라 업체·이미지·결제인증·표본 계정을 한 번에 지운다.
name: DB 샘플 업체 시드

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'seed = 넣는다 / remove = 걷어낸다 / images = 사진을 카카오 검색 결과로'
        type: choice
        default: seed
        options: [seed, remove, images]
      target:
        description: '대상 DB. 검수용이라 staging이 기본 — default(운영)는 걷어낼 때만 쓴다'
        type: choice
        default: staging
        options: [staging, default, production]

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 실행
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DEFAULT_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STORAGE_DRIVER: local
          MODE: ${{ github.event.inputs.mode }}
          TARGET: ${{ github.event.inputs.target }}
        run: |
          # 이 워크플로는 검수용 샘플이고 remove는 업체·이미지·표본 계정을 지운다.
          # 운영 DB(DATABASE_URL)를 그대로 쓰던 것을 대상 선택으로 바꾼다.
          #
          # **`production`은 여기서 닿지 않는다.** PRODUCTION_DATABASE_URL은 Render
          # 내부망에서만 풀리는 이름이라 러너에서 getaddrinfo EAI_AGAIN으로 죽는다
          # (2026-09-09 db-status.yml 실측). 운영 API가 실제로 쓰는 DB는
          # DATABASE_URL이고, 그것이 여기의 `default`다. 선택지는 남겨 둔다 —
          # 밖에서 닿는 주소가 그 이름에 들어오면 그때 그대로 쓴다.
          case "${TARGET:-staging}" in
            production) export DATABASE_URL="$PRODUCTION_DATABASE_URL" ;;
            default)    export DATABASE_URL="$DEFAULT_DATABASE_URL" ;;
            *)          export DATABASE_URL="$STAGING_DATABASE_URL" ;;
          esac
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::${TARGET:-staging} 대상의 접속 정보가 GitHub Secrets에 없다."
            exit 1
          fi
          # 지어낸 업체를 운영 DB에 **넣는** 일은 하지 않는다. 걷어내는 것만 허용한다.
          if [ "${TARGET:-staging}" = "default" ] && [ "$MODE" != "remove" ]; then
            echo "::error::운영 DB에는 remove만 돌린다. 샘플을 넣거나 사진을 바꾸는 것은 staging에서 한다."
            exit 1
          fi
          echo "대상: ${TARGET:-staging}"
          # 공개 클라이언트 키(EXPO_PUBLIC_KAKAO_CLIENT_ID와 같은 값) — 한 곳(infra/render-env.yml)에서 읽는다.
          export KAKAO_APP_KEY=$(grep -m1 '^ *KAKAO_APP_KEY:' infra/render-env.yml | awk '{print $2}')
          if [ "$MODE" = "remove" ]; then
            npm run seed:samples --workspace @weddingpick/api -- --remove --yes
          elif [ "$MODE" = "images" ]; then
            npm run seed:sample-images --workspace @weddingpick/api -- --yes
          else
            npm run seed:samples --workspace @weddingpick/api -- --yes
          fi
