name: Validate PR363 static candidate reader

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'chatgpt/static-validated-candidate-cutover-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Regression
        run: |
          bash -n scripts/install-kakao-static-sites.sh
          bash -n scripts/rollback-kakao-static-sites.sh
          node --test scripts/verification/static-sites-cutover-transaction.test.mjs
