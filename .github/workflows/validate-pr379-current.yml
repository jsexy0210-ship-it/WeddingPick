name: Validate PR379 current

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'chatgpt/probe-transaction-rollback-20260918-2'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Static port probe transaction regression
        run: |
          bash -n scripts/probe-kakao-static-ports.sh
          bash -n scripts/cleanup-kakao-static-port-probes.sh
          node --test scripts/verification/static-port-probe-transaction.test.mjs
