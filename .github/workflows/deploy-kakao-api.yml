# main.yml의 CI 성공 후에만 같은 커밋으로 호출한다.
# 독립 push 실행과 CI 결과를 기다리는 중복 작업은 만들지 않는다.
name: Deploy Kakao API

on:
  workflow_call:
    inputs:
      environment_name:
        required: false
        type: string
        default: production

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy → KakaoCloud API
    if: github.repository == 'jsexy0210-ship-it/WeddingPick' && github.ref == 'refs/heads/main'
    environment: ${{ inputs.environment_name }}
    runs-on: [self-hosted, Linux, X64, weddingpick-kakao]
    timeout-minutes: 40
    # 이전 독립 실행의 승인 대기와 분리한다. VM 파일 잠금은 구버전과도 공유한다.
    concurrency:
      group: weddingpick-kakao-api-cutover
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify deployment environment
        shell: bash
        run: |
          set -euo pipefail
          test -r /home/ubuntu/WeddingPick/.env.kakao-prod
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$PWD" != /home/ubuntu/WeddingPick
          command -v python3 >/dev/null
          command -v curl >/dev/null
          command -v flock >/dev/null
          sudo -n docker version >/dev/null
          echo 'Runner and production environment file are ready; secret values are not printed.'

      - name: Build and deploy with rollback
        shell: bash
        env:
          ENV_FILE: /home/ubuntu/WeddingPick/.env.kakao-prod
          PUBLIC_HEALTH_URL: https://210.109.82.212/health
        run: |
          set -euo pipefail
          umask 077
          exec 9> /home/ubuntu/WeddingPick/.kakao-deploy.lock
          flock -n 9 || { echo 'Another API deployment holds the lock.' >&2; exit 1; }

          IMAGE="weddingpick-api:${GITHUB_SHA}"
          PROD_CONTAINER=weddingpick-api
          CANDIDATE_CONTAINER="weddingpick-api-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          BACKUP_CONTAINER="weddingpick-api-previous-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          OLD_ID=''
          CUTOVER_STARTED=0
          DEPLOYED=0

          health_ok() {
            local url="$1" attempts="${2:-30}" delay="${3:-2}" body
            for ((i=0; i<attempts; i++)); do
              body="$(curl --fail --silent --show-error --connect-timeout 5 --max-time 10 "$url" 2>/dev/null || true)"
              if printf '%s' "$body" | python3 -c 'import json,sys; d=json.load(sys.stdin); s=d.get("schema"); sys.exit(0 if d.get("ok") is True and d.get("database")=="ok" and isinstance(s,dict) and s.get("ok") is True and s.get("pending")==[] else 1)' 2>/dev/null; then
                return 0
              fi
              sleep "$delay"
            done
            return 1
          }

          deploy_revision_is_current() {
            local latest_main paths
            latest_main="$(git ls-remote origin refs/heads/main | cut -f1)"

            if [ "$latest_main" = "$GITHUB_SHA" ]; then
              return 0
            fi

            # 뒤에 붙은 문서·정적·probe 전용 커밋 때문에 이미 검증한 API 배포를
            # 버리지 않는다. 대신 API 런타임에 영향을 주는 파일이 하나라도 바뀌면
            # 최신 main의 CI가 배포하도록 여기서 멈춘다.
            git fetch --quiet origin main
            git cat-file -e "$latest_main^{commit}" 2>/dev/null || return 1
            git merge-base --is-ancestor "$GITHUB_SHA" "$latest_main" || return 1

            paths="$(git diff --name-only "$GITHUB_SHA" "$latest_main")"
            if grep -Eq '^(apps/api/|packages/(api-contract|db|domain)/|package(-lock)?\.json$|Dockerfile$|\.dockerignore$|scripts/update-kakao-worker\.sh$|\.github/workflows/(main|repair-kakao-runner|deploy-kakao-api)\.yml$)' <<< "$paths"; then
              echo "A newer main commit changes API runtime/deploy files: $latest_main" >&2
              return 1
            fi

            echo "main advanced only through non-API files; deploying validated API revision $GITHUB_SHA."
            return 0
          }

          cleanup() {
            local status=$? current_id old_name
            trap - EXIT INT TERM
            set +e
            sudo -n docker rm -f "$CANDIDATE_CONTAINER" >/dev/null 2>&1
            if [ "$CUTOVER_STARTED" -eq 1 ] && [ "$DEPLOYED" -eq 0 ]; then
              echo 'Restoring the previous container with its original settings.' >&2
              current_id="$(sudo -n docker inspect -f '{{.Id}}' "$PROD_CONTAINER" 2>/dev/null)"
              if [ -n "$current_id" ] && [ "$current_id" != "$OLD_ID" ]; then
                sudo -n docker rm -f "$current_id" >/dev/null 2>&1
              fi
              old_name="$(sudo -n docker inspect -f '{{.Name}}' "$OLD_ID" 2>/dev/null)"
              if [ -n "$old_name" ] && [ "$old_name" != "/$PROD_CONTAINER" ]; then
                sudo -n docker rename "$OLD_ID" "$PROD_CONTAINER"
              fi
              if sudo -n docker start "$OLD_ID" >/dev/null && health_ok http://127.0.0.1:3001/health 30 2; then
                echo 'Previous API container restored.' >&2
              else
                echo 'Automatic recovery failed; inspect the VM. No DB rollback was attempted.' >&2
              fi
              status=1
            fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          deploy_revision_is_current || { echo 'A newer API-relevant main commit exists; deployment stopped.' >&2; exit 1; }
          OLD_ID="$(sudo -n docker inspect -f '{{.Id}}' "$PROD_CONTAINER")"
          test "$(sudo -n docker inspect -f '{{.State.Running}}' "$OLD_ID")" = true
          health_ok http://127.0.0.1:3001/health 10 2
          if sudo -n docker inspect "$BACKUP_CONTAINER" >/dev/null 2>&1; then
            echo 'A recovery container already exists; it will not be overwritten.' >&2
            exit 1
          fi

          echo "Building $IMAGE while the current API remains running."
          sudo -n docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$IMAGE" .
          sudo -n docker run -d --pull=never --name "$CANDIDATE_CONTAINER" --restart=no \
            --env-file "$ENV_FILE" -e RUN_WORKER_IN_API=false \
            -p 127.0.0.1:3002:3000 "$IMAGE" >/dev/null

          if ! health_ok http://127.0.0.1:3002/health 45 2; then
            echo 'Candidate health failed; the existing API is unchanged. Runtime logs stay on the VM.' >&2
            exit 1
          fi
          sudo -n docker rm -f "$CANDIDATE_CONTAINER" >/dev/null
          deploy_revision_is_current || { echo 'main gained API-relevant changes during the build; the existing API is unchanged.' >&2; exit 1; }

          CUTOVER_STARTED=1
          sudo -n docker stop --time 30 "$OLD_ID" >/dev/null
          sudo -n docker rename "$OLD_ID" "$BACKUP_CONTAINER"
          sudo -n docker run -d --pull=never --name "$PROD_CONTAINER" --restart=unless-stopped \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --env-file "$ENV_FILE" -e RUN_WORKER_IN_API=false \
            -p 127.0.0.1:3001:3000 "$IMAGE" >/dev/null

          test "$(sudo -n docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$PROD_CONTAINER" | sed -n 's/^RUN_WORKER_IN_API=//p' | tail -n1)" = false
          health_ok http://127.0.0.1:3001/health 45 2
          health_ok "$PUBLIC_HEALTH_URL" 20 3
          sudo -n docker tag "$IMAGE" weddingpick-api:kakao-current

          # API 안쪽 worker는 RUN_WORKER_IN_API=false로 유지한다.
          # 별도 worker가 같은 이미지로 교체돼야 API와 백그라운드 코드가 어긋나지 않는다.
          # 이 단계가 실패하면 update-kakao-worker.sh가 이전 worker를 복원하고,
          # 이 job의 EXIT trap이 이전 API까지 복원한다.
          bash scripts/update-kakao-worker.sh "$IMAGE"

          DEPLOYED=1
          echo "KakaoCloud API and worker deployed successfully: $GITHUB_SHA"
          echo "Stopped recovery API container retained: $BACKUP_CONTAINER"
          echo 'The production environment file and DB schema were not modified.'

      - name: Deployment summary
        if: always()
        shell: bash
        env:
          DEPLOY_STATUS: ${{ job.status }}
        run: |
          {
            echo '### KakaoCloud API'
            printf -- '- Job status: `%s`\n' "$DEPLOY_STATUS"
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Runner: `%s`\n' "$RUNNER_NAME"
            echo '- Endpoint: `https://210.109.82.212`'
            echo '- Running API:'
            sudo -n docker ps --filter name='^/weddingpick-api$' --format '- `{{.Names}}` → `{{.Image}}` / `{{.Status}}`' || true
            echo '- Running worker:'
            sudo -n docker ps --filter name='^/weddingpick-worker$' --format '- `{{.Names}}` → `{{.Image}}` / `{{.Status}}`' || true
          } >> "$GITHUB_STEP_SUMMARY"
