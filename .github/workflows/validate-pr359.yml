name: Validate PR359 static staging

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'chatgpt/atomic-static-stage-candidate-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Regression
        run: |
          node --test scripts/verification/static-cutover-order.test.mjs
          node --test scripts/verification/kakao-vm-concurrency-stage.test.mjs
