name: Validate PR329 current head

on:
  push:
    branches:
      - chatgpt/fix-app-web-cutover-rollback-20260918
    paths:
      - '.github/workflows/validate-pr329-current.yml'
      - '.github/workflows/preview-kakao-app-web.yml'
      - 'scripts/install-kakao-app-web.sh'
      - 'scripts/rollback-kakao-app-web.sh'
      - 'scripts/rollback-kakao-app-web-update.sh'
      - 'scripts/finalize-kakao-app-web-update.sh'
      - 'scripts/verification/cutover-transaction.test.mjs'
      - 'scripts/verification/app-web-live-marker-rollback.test.mjs'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Shell syntax
        run: |
          bash -n scripts/install-kakao-app-web.sh
          bash -n scripts/rollback-kakao-app-web.sh
          bash -n scripts/rollback-kakao-app-web-update.sh
          bash -n scripts/finalize-kakao-app-web-update.sh
      - name: App-web cutover transaction regression
        run: node --test scripts/verification/cutover-transaction.test.mjs
      - name: Live-marker rollback regression
        run: node --test scripts/verification/app-web-live-marker-rollback.test.mjs
