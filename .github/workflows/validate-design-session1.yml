name: Validate Design Session 1

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/mobile/src/app/(tabs)/index.tsx'
      - 'apps/mobile/src/app/(tabs)/(home)/**'
      - 'apps/mobile/src/features/home/**'
      - 'scripts/fixtures/api.cjs'
      - '.github/workflows/validate-design-session1.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Home Recommendations Visual Validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_API_URL: http://127.0.0.1:39999
      EXPO_PUBLIC_WEB_URL: https://example.invalid
      EXPO_PUBLIC_KAKAO_CLIENT_ID: validation-only
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Full workspace typecheck
        run: npm run typecheck

      - name: Owned scope typecheck
        run: |
          mkdir -p apps/mobile/.design-stubs
          cat > apps/mobile/.design-stubs/webshell-config.ts <<'TS'
          export const isWebShellScreen = (_id: string): boolean => false;
          TS
          cat > apps/mobile/.design-stubs/web-shell-view.ts <<'TS'
          export const WebShellView = (_props: { path: string }): null => null;
          TS
          cat > apps/mobile/tsconfig.design-session1.json <<'JSON'
          {
            "extends": "./tsconfig.json",
            "include": [],
            "compilerOptions": {
              "paths": {
                "@/features/webshell/config": ["./.design-stubs/webshell-config.ts"],
                "@/features/webshell/WebShellView": ["./.design-stubs/web-shell-view.ts"],
                "@/*": ["./src/*"],
                "@/assets/*": ["./assets/*"]
              }
            },
            "files": [
              "src/app/(tabs)/index.tsx",
              "src/app/(tabs)/(home)/recommendations.tsx",
              "src/features/home/hero.tsx",
              "src/features/home/home-summary.tsx",
              "src/features/home/pick-recommend.tsx",
              "src/features/home/vendor-card.tsx",
              "src/features/home/canon-components.test.tsx"
            ]
          }
          JSON
          npx tsc -p apps/mobile/tsconfig.design-session1.json --noEmit

      - name: Owned scope lint
        working-directory: apps/mobile
        run: |
          npx eslint \
            "src/app/(tabs)/index.tsx" \
            "src/app/(tabs)/(home)/recommendations.tsx" \
            "src/features/home/hero.tsx" \
            "src/features/home/home-summary.tsx" \
            "src/features/home/pick-recommend.tsx" \
            "src/features/home/vendor-card.tsx" \
            "src/features/home/canon-components.test.tsx"

      - name: Mobile home tests
        run: npm run test --workspace @weddingpick/mobile -- --runInBand src/features/home

      - name: Capture fixture contract
        run: npx jest --config packages/api-contract/jest.config.js --rootDir packages/api-contract capture-fixtures --runInBand

      - name: Expo web export
        run: npm run export:web --workspace @weddingpick/mobile

      - name: Install capture browser
        run: |
          npm install --global playwright@1.55.0
          playwright install --with-deps chromium

      - name: Capture home and recommendations
        run: |
          mkdir -p design-captures
          node scripts/screenshot-screens.mjs \
            --route / \
            --route /recommendations \
            --expand \
            --edges \
            --wait 2200 \
            --out design-captures
          mkdir -p design-captures/reason
          node scripts/screenshot-screens.mjs \
            --route /recommendations \
            --expand \
            --tap "강남 A 웨딩홀 추천 이유 보기" \
            --wait 2200 \
            --out design-captures/reason
          mv design-captures/reason/recommendations.png design-captures/recommendations-reason.png
          rmdir design-captures/reason

      - name: Upload design captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-session1-captures
          path: design-captures/
          if-no-files-found: warn
