# RN 개편 미리보기를 Render 서비스가 뜨기 전에도 볼 수 있게 한다.
#
# Render에 weddingpick-preview를 만드는 것(render.yaml)이 진짜 답이다 — 폰
# 브라우저로 주소만 열면 된다. 이 워크플로는 그 전까지의 임시다. 결과가 zip
# artifact라 대표님이 Actions 페이지에서 내려받아 압축을 풀고 열어야 한다 —
# 폰에서는 불편하다.
name: RN 미리보기 빌드 (임시 · artifact)

on:
  push:
    branches:
      - 'claude/rn-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: npm ci
        run: npm ci

      - name: Bundle (web)
        env:
          EXPO_PUBLIC_API_URL: https://weddingpickl-sg.onrender.com
          EXPO_PUBLIC_KAKAO_CLIENT_ID: 8e9a14dd3a0aa1a420bff858460c415c
        run: npm run export:web --workspace @weddingpick/mobile

      - uses: actions/upload-artifact@v4
        with:
          name: rn-preview-web-${{ github.sha }}
          path: apps/mobile/dist
          retention-days: 14
