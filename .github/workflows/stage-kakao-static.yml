name: Stage Kakao Static

on:
  workflow_call:
    outputs:
      candidate_sha:
        description: Validated static candidate published by this run
        value: ${{ jobs.stage.outputs.candidate_sha }}

permissions:
  contents: read
  actions: read

concurrency:
  group: weddingpick-kakao-vm-write
  cancel-in-progress: false

jobs:
  stage:
    name: Stage static candidates on Kakao VM
    runs-on: [self-hosted, Linux, X64, weddingpick-kakao]
    timeout-minutes: 10
    outputs:
      candidate_sha: ${{ steps.publish_candidate.outputs.candidate_sha }}
    steps:
      - name: Check current main
        id: current
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote https://github.com/jsexy0210-ship-it/WeddingPick.git refs/heads/main | cut -f1)"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "A newer main exists; stale static candidate will not be staged."
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"

      - name: Checkout runtime audit
        if: steps.current.outputs.current == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download static artifact
        if: steps.current.outputs.current == 'true'
        uses: actions/download-artifact@v4
        with:
          name: kakao-static-sites
          path: .kakao-static

      - name: Validate and stage candidates
        if: steps.current.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f .kakao-static/app/index.html
          test -f .kakao-static/admin/index.html
          test -f .kakao-static/admin/admin/login.html
          test -f .kakao-static/web/index.html
          test -f .kakao-static/web/privacy.html
          test -f .kakao-static/manifest.json
          if grep -RIl '<!--$!-->' .kakao-static/app .kakao-static/admin | grep -q .; then
            echo 'Static export contains an unfinished React suspense boundary.' >&2
            exit 1
          fi

          root="/home/ubuntu/WeddingPick"
          releases="$root/static-releases"
          release="$releases/$GITHUB_SHA"
          incoming="$root/.static-release-incoming-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          previous="$root/.static-release-previous-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cleanup() {
            # incoming만 자동 정리한다.
            # previous는 swap/복구 자체가 실패했을 때 사람 손으로 되살릴 마지막 사본일 수 있다.
            rm -rf "$incoming"
          }
          trap cleanup EXIT

          mkdir -p "$releases"
          root_device="$(stat -c %d "$root")"
          releases_device="$(stat -c %d "$releases")"
          if [ "$root_device" != "$releases_device" ]; then
            echo 'static-releases is on a different filesystem; refusing non-atomic staging.' >&2
            exit 1
          fi

          rm -rf "$incoming" "$previous"
          mkdir -p "$incoming"

          cp -a .kakao-static/app "$incoming/app"
          cp -a .kakao-static/admin "$incoming/admin"
          cp -a .kakao-static/web "$incoming/web"
          cp .kakao-static/manifest.json "$incoming/manifest.json"

          # 최종 경로를 건드리기 전에 후보가 완전한지 다시 확인한다.
          test -f "$incoming/app/index.html"
          test -f "$incoming/admin/index.html"
          test -f "$incoming/admin/admin/login.html"
          test -f "$incoming/web/index.html"
          test -f "$incoming/web/privacy.html"
          test -f "$incoming/manifest.json"

          # 같은 filesystem에서 완성된 디렉터리만 최종 SHA 경로로 넘긴다.
          # 같은 SHA를 재스테이징할 때는 기존 완성본을 잠시 보존해 swap 실패 시 복구한다.
          if [ -e "$release" ]; then
            mv "$release" "$previous"
          fi
          if ! mv "$incoming" "$release"; then
            if [ -e "$previous" ] && ! mv "$previous" "$release"; then
              echo "Static candidate swap failed and previous release restore also failed: $previous" >&2
            fi
            exit 1
          fi
          rm -rf "$previous"

          trap - EXIT
          echo "Static candidates staged at $release"

      - name: Inspect Kakao runtime without secrets
        if: steps.current.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/audit-kakao-runtime.sh | tee /tmp/kakao-runtime-audit.txt
          {
            echo '### Kakao VM static staging'
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            echo '- Live cutover: **not performed**'
            echo '- Candidate path: `/home/ubuntu/WeddingPick/static-releases/<sha>`'
            echo ''
            cat /tmp/kakao-runtime-audit.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish validated static candidate
        id: publish_candidate
        if: steps.current.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          root="/home/ubuntu/WeddingPick"
          releases="$root/static-releases"
          release="$releases/$GITHUB_SHA"
          candidate_marker="$releases/latest-candidate"
          candidate_marker_tmp="$releases/.latest-candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

          cleanup() {
            rm -f "$candidate_marker_tmp"
          }
          trap cleanup EXIT

          # runtime audit까지 성공한 완성본만 자동 cutover 후보로 공개한다.
          test -f "$release/app/index.html"
          test -f "$release/admin/index.html"
          test -f "$release/admin/admin/login.html"
          test -f "$release/web/index.html"
          test -f "$release/web/privacy.html"
          test -f "$release/manifest.json"

          printf '%s\n' "$GITHUB_SHA" > "$candidate_marker_tmp"
          mv -f "$candidate_marker_tmp" "$candidate_marker"
          echo "candidate_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

          trap - EXIT
          echo "Latest validated candidate: $GITHUB_SHA"

      - name: Record staged revision
        if: steps.current.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > .kakao-static-staged-marker

      - name: Upload staged revision marker
        if: steps.current.outputs.current == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kakao-static-staged-marker
          path: .kakao-static-staged-marker
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
