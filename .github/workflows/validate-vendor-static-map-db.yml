name: Validate vendor static map DB routes

on:
  push:
    branches:
      - 'chatgpt/vendor-static-map-20260918'

permissions:
  contents: read

concurrency:
  group: validate-vendor-static-map-db-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-db-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: weddingpick
          POSTGRES_PASSWORD: weddingpick
          POSTGRES_DB: weddingpick_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://weddingpick:weddingpick@localhost:5432/weddingpick_test

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: API typecheck
        run: npm run typecheck --workspace @weddingpick/api
      - name: Static map DB route regressions
        working-directory: apps/api
        run: npx jest src/test/vendor-static-map-route.test.ts src/test/vendor-id-shape.test.ts --runInBand --forceExit
