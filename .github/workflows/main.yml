# main 검증과 KakaoCloud API 배포를 한 실행으로 묶는다.
# Render 배포 경로는 폐기했다. 운영 및 정적 사이트 잔여 작업은 docs/deployment.md를 따른다.
# 이 워크플로 성공을 정적 사이트 전환 완료로 해석하지 않는다.
# 라이브 전환은 [enable-static-cors] → [cutover-admin-web] → [cutover-app-web] 순서로 분리한다.
# 각 라이브 전환은 별도 검증·롤백 workflow로 실행한다.
name: CI / Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 실행 전체를 취소하지 않는다. CI job만 최신 main을 남기고 오래된 검증은 취소한다.
# 이미 시작된 운영 배포는 reusable workflow 자체의 concurrency가 끝까지 보호한다.
jobs:
  current-backlog-production:
    name: Current backlog production gate
    if: ${{ github.repository == 'jsexy0210-ship-it/WeddingPick' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      auto: ${{ steps.gate.outputs.auto }}
      pr_number: ${{ steps.gate.outputs.pr_number }}
      environment_name: ${{ steps.gate.outputs.environment_name }}
    steps:
      - name: Allow only the backlog that was open on 2026-09-19
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ALLOWED_PRS: '329 334 336 340 342 345 352 359 370 373 377 388 402 406 410 412 413 414 415 417 418 419'
        run: |
          set -euo pipefail
          auto=false
          pr_number=''
          environment_name=production

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            associated_prs="$(gh api "repos/$REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[] | select(.base.ref == "main" and .merged_at != null) | .number' 2>/dev/null || true)"
            for pr in $associated_prs; do
              case " $ALLOWED_PRS " in
                *" $pr "*)
                  auto=true
                  pr_number="$pr"
                  environment_name=production-current-backlog-auto
                  break
                  ;;
              esac
            done
          fi

          echo "auto=$auto" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "environment_name=$environment_name" >> "$GITHUB_OUTPUT"
          echo "Current-backlog auto production: $auto"
          echo "Associated allowed PR: ${pr_number:-none}"

  ci:
    name: CI
    if: ${{ !contains(github.event.head_commit.message || '', '[probe-only]') }}
    runs-on: ubuntu-latest
    concurrency:
      group: weddingpick-main-ci-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      actions: read
    outputs:
      stage_static: ${{ steps.static_changes.outputs.changed }}
      probe_static_ports: ${{ steps.port_probe_request.outputs.requested }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: weddingpick
          POSTGRES_PASSWORD: weddingpick
          POSTGRES_DB: weddingpick_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://weddingpick:weddingpick@localhost:5432/weddingpick_test
      MARKETING_PREVIEW_DIR: .marketing-preview

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 정적 사이트 스테이징 대상 변경 확인
        id: static_changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          changed=true
          staged_sha="$(gh api "repos/$REPOSITORY/actions/artifacts?name=kakao-static-staged-marker&per_page=10" --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.head_sha // ""' 2>/dev/null || true)"
          if [[ "$staged_sha" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$staged_sha^{commit}" 2>/dev/null; then
            if git merge-base --is-ancestor "$staged_sha" "$GITHUB_SHA"; then
              paths="$(git diff --name-only "$staged_sha" "$GITHUB_SHA")"
              if ! grep -Eq '^(apps/(mobile|web)/|packages/(api-contract|domain|ui)/|spec/|package(-lock)?\.json$|scripts/(ensure-modules|split-admin-dist|package-kakao-static)\.mjs$|scripts/audit-kakao-runtime\.sh$|\.github/workflows/(main|stage-kakao-static)\.yml$)' <<< "$paths"; then
                changed=false
              fi
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Last staged static revision: ${staged_sha:-unknown}"
          echo "Static staging required: $changed"

      - name: 카카오 정적 포트 검사 요청 확인
        id: port_probe_request
        shell: bash
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          requested=false
          if grep -Fq '[probe-static-ports]' <<< "${HEAD_MESSAGE:-}"; then
            requested=true
          fi
          echo "requested=$requested" >> "$GITHUB_OUTPUT"
          echo "Static port probe requested: $requested"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Deployment policy regression tests
        run: |
          node --test scripts/check-render-retired.test.mjs
          node --test scripts/verification/static-cutover-order.test.mjs
          node --test scripts/verification/ci-workspace-parallelism.test.mjs

      - name: Reject retired deployment paths
        run: node scripts/check-render-retired.mjs

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: SEED 토큰 (뽑은 값이 현행인지)
        run: node scripts/sync-seed-tokens.mjs --check

      - name: Copy lint (금지어)
        run: node lint-copy.js spec/strings.ko.json apps packages

      - name: Root harness tests
        run: npm run pretest

      - name: API health validator test
        run: node --test scripts/check-api-health.test.mjs

      - name: Marketing preview
        run: npm run marketing --workspace @weddingpick/api -- demo "$GITHUB_WORKSPACE/$MARKETING_PREVIEW_DIR"

      - name: Upload marketing preview
        uses: actions/upload-artifact@v6
        with:
          name: marketing-preview
          path: ${{ env.MARKETING_PREVIEW_DIR }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Bundle (web)
        if: steps.static_changes.outputs.changed == 'true'
        env:
          EXPO_PUBLIC_API_URL: https://210.109.82.212
          EXPO_PUBLIC_KAKAO_CLIENT_ID: 8e9a14dd3a0aa1a420bff858460c415c
          EXPO_PUBLIC_WEB_URL: https://210.109.82.212
        run: npm run export:web --workspace @weddingpick/mobile

      - name: Build landing
        if: steps.static_changes.outputs.changed == 'true'
        env:
          WEDDINGPICK_CONTACT_EMAIL: help.weddingpick@gmail.com
          WEDDINGPICK_API_URL: https://210.109.82.212
          LEGAL_TERMS_EFFECTIVE_ON: '2026-09-10'
          LEGAL_PRIVACY_EFFECTIVE_ON: '2026-09-21'
        run: npm run build --workspace @weddingpick/web

      - name: Package Kakao static candidates
        if: steps.static_changes.outputs.changed == 'true'
        env:
          ADMIN_ORIGIN: https://210.109.82.212:8443
        run: node scripts/package-kakao-static.mjs

      - name: Upload Kakao static candidates
        if: steps.static_changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: kakao-static-sites
          path: .kakao-static/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  api-tests:
    name: API Tests (${{ matrix.shard }}/2)
    if: ${{ !contains(github.event.head_commit.message || '', '[probe-only]') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    concurrency:
      group: weddingpick-main-api-tests-${{ github.ref }}-${{ matrix.shard }}
      cancel-in-progress: true

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: weddingpick
          POSTGRES_PASSWORD: weddingpick
          POSTGRES_DB: weddingpick_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://weddingpick:weddingpick@localhost:5432/weddingpick_test

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run API shard
        run: npm run test --workspace @weddingpick/api -- --shard=${{ matrix.shard }}/2

  non-db-tests:
    name: Workspace Tests (${{ matrix.workspace }})
    if: ${{ !contains(github.event.head_commit.message || '', '[probe-only]') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [mobile, web, api-contract, domain]
    concurrency:
      group: weddingpick-main-workspace-tests-${{ github.ref }}-${{ matrix.workspace }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run workspace tests
        run: npm run test --workspace @weddingpick/${{ matrix.workspace }}

  db-tests:
    name: DB Tests
    if: ${{ !contains(github.event.head_commit.message || '', '[probe-only]') }}
    runs-on: ubuntu-latest
    concurrency:
      group: weddingpick-main-db-tests-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: weddingpick
          POSTGRES_PASSWORD: weddingpick
          POSTGRES_DB: weddingpick_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://weddingpick:weddingpick@localhost:5432/weddingpick_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run DB tests
        run: npm run test --workspace @weddingpick/db

  audit-kakao-data:
    name: Audit Kakao Data State
    if: ${{ github.repository == 'jsexy0210-ship-it/WeddingPick' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message || '', '[audit-kakao-data]') }}
    permissions:
      contents: read
    uses: ./.github/workflows/audit-kakao-data-state.yml

  audit-kakao-openapi:
    name: Audit Kakao OpenAPI Readiness
    if: ${{ github.repository == 'jsexy0210-ship-it/WeddingPick' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message || '', '[audit-kakao-openapi]') }}
    permissions:
      contents: read
    uses: ./.github/workflows/audit-kakao-openapi-readiness.yml

  audit-kakao-legal:
    name: Audit Kakao Legal API
    if: ${{ github.repository == 'jsexy0210-ship-it/WeddingPick' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message || '', '[audit-legal-api]') }}
    permissions:
      contents: read
    uses: ./.github/workflows/audit-kakao-legal.yml

  probe-kakao-static-ports:
    name: Probe Kakao Static Ports
    if: ${{ github.repository == 'jsexy0210-ship-it/WeddingPick' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message || '', '[probe-static-ports]') }}
    permissions:
      contents: read
    uses: ./.github/workflows/probe-kakao-static-ports.yml

  enable-kakao-static-cors:
    name: Enable Kakao Static CORS
    if: ${{ github.repository == 'jsexy0210-ship-it/WeddingPick' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message || '', '[enable-static-cors]') }}
    permissions:
      contents: read
    uses: ./.github/workflows/enable-kakao-static-cors.yml

  cutover-kakao-admin-web:
    name: Cutover Kakao Admin Web
    needs: [ci, api-tests, repair-kakao-runner, stage-kakao-static]
    if: ${{ always() && github.repository == 'jsexy0210-ship-it/WeddingPick' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message || '', '[cutover-admin-web]') && needs.ci.result == 'success' && needs.api-tests.result == 'success' && (needs.repair-kakao-runner.result == 'success' || needs.repair-kakao-runner.result == 'skipped') && (needs.ci.outputs.stage_static != 'true' || (needs.stage-kakao-static.result == 'success' && needs.stage-kakao-static.outputs.candidate_sha == github.sha)) }}
    permissions:
      contents: read
    uses: ./.github/workflows/cutover-kakao-admin-web.yml

  unify-live-favicon:
    name: Unify Live Favicon
    if: ${{ github.repository == 'jsexy0210-ship-it/WeddingPick' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message || '', '[unify-favicon-live]') }}
    permissions:
      contents: read
    uses: ./.github/workflows/unify-live-favicon.yml

  preview-kakao-admin-web:
    name: Preview Kakao Admin and Website
    if: ${{ github.repository == 'jsexy0210-ship-it/WeddingPick' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message || '', '[preview-admin-web]') }}
    permissions:
      contents: read
    uses: ./.github/workflows/preview-kakao-admin-web.yml

  preview-kakao-app-web:
    name: Preview Kakao App Web
    if: ${{ github.repository == 'jsexy0210-ship-it/WeddingPick' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message || '', '[preview-app-web]') }}
    permissions:
      contents: read
    uses: ./.github/workflows/preview-kakao-app-web.yml

  cutover-kakao-app-web:
    name: Cutover Kakao App Web
    if: ${{ github.repository == 'jsexy0210-ship-it/WeddingPick' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message || '', '[cutover-app-web]') }}
    permissions:
      contents: read
    uses: ./.github/workflows/cutover-kakao-app-web.yml

  stage-kakao-static:
    name: Stage Kakao Static
    needs: [ci, api-tests, non-db-tests, db-tests, repair-kakao-runner]
    if: ${{ always() && github.repository == 'jsexy0210-ship-it/WeddingPick' && github.ref == 'refs/heads/main' && needs.ci.result == 'success' && needs.api-tests.result == 'success' && needs.non-db-tests.result == 'success' && needs.db-tests.result == 'success' && (needs.repair-kakao-runner.result == 'success' || needs.repair-kakao-runner.result == 'skipped') && needs.ci.outputs.stage_static == 'true' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/stage-kakao-static.yml

  repair-kakao-runner:
    name: Repair Kakao Runner
    needs: [ci, api-tests, non-db-tests, db-tests, current-backlog-production]
    if: ${{ github.repository == 'jsexy0210-ship-it/WeddingPick' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || needs.current-backlog-production.outputs.auto == 'true') && !contains(github.event.head_commit.message || '', '[skip-api-deploy]') }}
    permissions:
      contents: read
    uses: ./.github/workflows/repair-kakao-runner.yml

  api-deploy-needed:
    name: Detect Kakao API catch-up
    needs: [ci, api-tests, non-db-tests, db-tests, repair-kakao-runner, current-backlog-production]
    if: ${{ github.repository == 'jsexy0210-ship-it/WeddingPick' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || needs.current-backlog-production.outputs.auto == 'true') && !contains(github.event.head_commit.message || '', '[skip-api-deploy]') }}
    runs-on: [self-hosted, Linux, X64, weddingpick-kakao]
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Compare live API revision with current main
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          changed=true
          live_revision="$(sudo -n docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' weddingpick-api 2>/dev/null || true)"
          if [[ "$live_revision" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$live_revision^{commit}" 2>/dev/null; then
            if git merge-base --is-ancestor "$live_revision" "$GITHUB_SHA"; then
              paths="$(git diff --name-only "$live_revision" "$GITHUB_SHA")"
              if ! grep -Eq '^(apps/api/|packages/(api-contract|db|domain)/|package(-lock)?\.json$|Dockerfile$|\.dockerignore$|scripts/update-kakao-worker\.sh$|\.github/workflows/deploy-kakao-api\.yml$)' <<< "$paths"; then
                changed=false
              fi
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Live API revision: ${live_revision:-unknown}"
          echo "API catch-up required: $changed"

  deploy-kakao:
    name: KakaoCloud API
    needs: [ci, api-tests, non-db-tests, db-tests, repair-kakao-runner, api-deploy-needed, current-backlog-production]
    if: ${{ needs.api-deploy-needed.outputs.changed == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-kakao-api.yml
    with:
      environment_name: ${{ needs.current-backlog-production.outputs.environment_name }}

  auto-cutover-current-backlog-app-web:
    name: Production App Web (current backlog)
    needs: [current-backlog-production, stage-kakao-static, deploy-kakao]
    if: ${{ always() && needs.current-backlog-production.outputs.auto == 'true' && needs.stage-kakao-static.result == 'success' && (needs.deploy-kakao.result == 'success' || needs.deploy-kakao.result == 'skipped') }}
    permissions:
      contents: read
    uses: ./.github/workflows/cutover-kakao-app-web.yml
    with:
      release_sha: ${{ github.sha }}
      environment_name: ${{ needs.current-backlog-production.outputs.environment_name }}
