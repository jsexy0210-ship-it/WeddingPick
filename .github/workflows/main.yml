# 웨딩픽 통합 파이프라인
#
# push(main)  → CI → DB 마이그레이션 → Render 자동 배포 → health check (staging)
# PR          → CI만 (배포 없음)
# workflow_dispatch → staging 또는 production 수동 배포
#
# 필요한 GitHub Secrets:
#   DATABASE_URL              Render PostgreSQL 연결 문자열
#   RENDER_DEPLOY_HOOK_URL    (선택) Render staging 서비스 Deploy Hook URL
#   RENDER_DEPLOY_HOOK_URL_PROD (선택) Render production 서비스 Deploy Hook URL
name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 배포 환경
        type: choice
        options: [staging, production]
        default: staging
        required: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: weddingpick
          POSTGRES_PASSWORD: weddingpick
          POSTGRES_DB: weddingpick_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://weddingpick:weddingpick@localhost:5432/weddingpick_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Marketing preview
        run: npm run marketing --workspace @weddingpick/api -- demo .marketing-preview

      - name: Upload marketing preview
        uses: actions/upload-artifact@v4
        with:
          name: marketing-preview
          path: .marketing-preview/
          retention-days: 7

      - name: Bundle (web)
        run: npm run export:web --workspace @weddingpick/mobile

      - name: Build landing
        run: npm run build --workspace @weddingpick/web

  deploy-staging:
    name: Deploy → Staging
    needs: [ci]
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch' && inputs.environment == 'staging'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: DB Migrate
        run: npm run migrate --workspace @weddingpick/db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Trigger Render deploy
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl -sS "$RENDER_DEPLOY_HOOK_URL"
            echo "API deploy hook triggered"
          else
            echo "No API deploy hook configured — relying on Render auto-deploy (autoDeploy: true)"
          fi
          if [ -n "$RENDER_DEPLOY_HOOK_WEB_URL" ]; then
            curl -sS "$RENDER_DEPLOY_HOOK_WEB_URL"
            echo "Web static site deploy hook triggered"
          else
            echo "No web deploy hook configured — relying on Render auto-deploy (autoDeploy: true)"
          fi
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_DEPLOY_HOOK_WEB_URL: ${{ secrets.RENDER_DEPLOY_HOOK_WEB_URL }}

      - name: Render Blueprint sync (새 서비스 반영)
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "RENDER_API_KEY 없음 — Blueprint sync 생략"
            exit 0
          fi
          # 블루프린트 목록에서 이 저장소에 연결된 것을 찾아 sync
          BLUEPRINTS=$(curl -sf -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/blueprints?limit=20")
          BLUEPRINT_ID=$(echo "$BLUEPRINTS" | python3 -c "import sys,json;data=json.load(sys.stdin);[print(item.get('blueprint',item).get('id','')) for item in data if 'WeddingPickl' in str(item.get('blueprint',item).get('repo',''))]" 2>/dev/null | head -1)
          if [ -z "$BLUEPRINT_ID" ]; then
            echo "Blueprint ID를 찾지 못했습니다. Render 대시보드에서 수동 sync 필요."
            exit 0
          fi
          echo "Blueprint ID: $BLUEPRINT_ID — sync 요청"
          RESP=$(curl -sf -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/blueprints/$BLUEPRINT_ID/sync")
          echo "sync 응답: $RESP"
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}

      - name: Custom domains (weddingpick.kr / admin.weddingpick.kr)
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "RENDER_API_KEY 없음 — 커스텀 도메인 설정 생략"
            exit 0
          fi
          add_domain() {
            local SVC_NAME=$1
            local DOMAIN=$2
            SVC_ID=$(curl -sf -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services?name=${SVC_NAME}&limit=5" \
              | python3 -c "import sys,json;data=json.load(sys.stdin);items=[i for i in data if i.get('service',i).get('name','')==\"${SVC_NAME}\"];print(items[0].get('service',items[0]).get('id','') if items else '')" 2>/dev/null)
            if [ -z "$SVC_ID" ]; then
              echo "${SVC_NAME}: 서비스를 찾지 못했습니다 (Blueprint sync 완료 후 재시도 필요)"
              return 0
            fi
            echo "${SVC_NAME} (${SVC_ID}): ${DOMAIN} 도메인 추가 시도"
            RESP=$(curl -s -X POST \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"${DOMAIN}\"}" \
              "https://api.render.com/v1/services/${SVC_ID}/custom-domains")
            echo "${DOMAIN} 응답: $RESP"
          }
          add_domain "weddingpick-web"   "weddingpick.kr"
          add_domain "weddingpick-admin" "admin.weddingpick.kr"
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}

      - name: Health check
        run: |
          echo "Waiting for Render staging deployment to settle..."
          for i in $(seq 1 60); do
            sleep 15
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" https://weddingpickl.onrender.com/health 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✓ /health 200 OK"
              exit 0
            fi
            echo "Attempt $i/60: HTTP $STATUS"
          done
          echo "✗ Staging health check failed after 900 s"
          exit 1

  deploy-production:
    name: Deploy → Production
    needs: [ci]
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: DB Migrate
        run: npm run migrate --workspace @weddingpick/db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Trigger Render deploy
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL_PROD" ]; then
            curl -sS "$RENDER_DEPLOY_HOOK_URL_PROD"
            echo "Production deploy hook triggered"
          else
            echo "No production deploy hook configured"
          fi
        env:
          RENDER_DEPLOY_HOOK_URL_PROD: ${{ secrets.RENDER_DEPLOY_HOOK_URL_PROD }}

      - name: Health check
        run: |
          echo "Waiting for Render production deployment..."
          for i in $(seq 1 60); do
            sleep 15
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" https://weddingpickl.onrender.com/health 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✓ /health 200 OK"
              exit 0
            fi
            echo "Attempt $i/60: HTTP $STATUS"
          done
          echo "✗ Production health check failed after 900 s"
          exit 1
