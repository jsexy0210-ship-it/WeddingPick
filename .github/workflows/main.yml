# 웨딩픽 통합 파이프라인
#
# push(main)  → CI → DB 마이그레이션 → Fly.io staging 배포 → /health 확인
# PR          → CI만 (배포 없음)
# workflow_dispatch → staging 또는 production 수동 배포
#
# 필요한 GitHub Secrets:
#   FLY_API_TOKEN    fly tokens create deploy -a weddingpickl,weddingpick-api
#   DATABASE_URL     Neon 연결 문자열
name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 배포 환경
        type: choice
        options: [staging, production]
        default: staging
        required: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: weddingpick
          POSTGRES_PASSWORD: weddingpick
          POSTGRES_DB: weddingpick_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://weddingpick:weddingpick@localhost:5432/weddingpick_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Bundle (web)
        run: npm run export:web --workspace @weddingpick/mobile

      - name: Build landing
        run: npm run build --workspace @weddingpick/web

  deploy-staging:
    name: Deploy → Staging
    needs: [ci]
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch' && inputs.environment == 'staging'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: DB Migrate
        run: npm run migrate --workspace @weddingpick/db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy (weddingpickl)
        run: flyctl deploy --config fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Health check
        run: |
          echo "Waiting for deployment to settle..."
          for i in $(seq 1 12); do
            sleep 5
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" https://weddingpickl.fly.dev/health 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✓ /health 200 OK"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS"
          done
          echo "✗ Health check failed after 60 s"
          exit 1

  deploy-production:
    name: Deploy → Production
    needs: [ci]
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: DB Migrate
        run: npm run migrate --workspace @weddingpick/db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy (weddingpick-api)
        run: flyctl deploy --config fly.production.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Health check
        run: |
          echo "Waiting for deployment to settle..."
          for i in $(seq 1 12); do
            sleep 5
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" https://weddingpick-api.fly.dev/health 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✓ /health 200 OK"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS"
          done
          echo "✗ Health check failed after 60 s"
          exit 1
