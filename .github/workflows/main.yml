# 웨딩픽 통합 파이프라인
#
# push(main)  → CI → 승인된 DB 마이그레이션 → API 배포·검증 → 정적 사이트 배포
# 운영 Render 서비스의 자동 배포는 끄고 아래 작업이 같은 커밋을 순서대로 배포한다.
# PR          → CI만 (배포 없음)
# workflow_dispatch → staging 또는 production 수동 배포
#
# 필요한 GitHub Secrets:
#   DATABASE_URL   staging 작업의 DB 연결 문자열
#   PRODUCTION_DATABASE_URL production 작업의 DB 연결 문자열
# weddingpick.kr은 폐기했다(2026-09-11 대표 지시). 도메인 연결 단계를 되살리지 않는다.
#
# 환경변수 원본은 infra/render-env.yml이며 이 파이프라인이 단일 키 단위로 반영한다.
# render-env-sync.yml은 수동 dry-run 검사만 수행한다.
name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 배포 환경
        type: choice
        options: [staging, production]
        default: staging
        required: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: weddingpick
          POSTGRES_PASSWORD: weddingpick
          POSTGRES_DB: weddingpick_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://weddingpick:weddingpick@localhost:5432/weddingpick_test
      # 미리보기 산출물 경로는 여기서만 정한다. 만드는 쪽과 올리는 쪽이 각자 알면 어긋난다.
      MARKETING_PREVIEW_DIR: .marketing-preview

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # 금지어 게이트. `spec/glossary.json`을 읽는 것은 이 스크립트뿐인데
      # **어느 워크플로에도 연결돼 있지 않았다** — 48개 금지어 중 37개가
      # 검사되지 않고 있었다(Release Audit 1차 P1-10).
      - name: Copy lint (금지어)
        run: node lint-copy.js spec/strings.ko.json apps packages

      - name: Test
        run: npm test

      - name: API health validator test
        run: node --test scripts/check-api-health.test.mjs

      - name: Render deploy orchestration test
        run: python3 -B scripts/test-render-env-sync.py

      - name: Marketing preview
        run: npm run marketing --workspace @weddingpick/api -- demo "$GITHUB_WORKSPACE/$MARKETING_PREVIEW_DIR"

      - name: Upload marketing preview
        uses: actions/upload-artifact@v4
        with:
          name: marketing-preview
          path: ${{ env.MARKETING_PREVIEW_DIR }}/
          # 산출물 디렉터리가 점으로 시작한다. v4.4부터 숨김 파일이 기본 제외라 빼면 아무것도 안 올라간다.
          include-hidden-files: true
          # 다른 두 워크플로와 같게 — 못 찾으면 경고가 아니라 실패다. 조용히 초록으로 끝나는 것을 막는다.
          if-no-files-found: error
          retention-days: 7

      - name: Bundle (web)
        run: npm run export:web --workspace @weddingpick/mobile

      - name: Build landing
        run: npm run build --workspace @weddingpick/web

  # 이름은 staging/production이지만 지금은 같은 대상을 본다 — 두 잡 모두
  # `secrets.DATABASE_URL`로 마이그레이션하고 `weddingpickl-sg.onrender.com`을
  # 헬스체크한다. 사용자 결정(2026-09-09) 「우선 현재 DB 그대로 사용한다. 차후에 분리」에
  # 따라 지금은 이대로 둔다. 나누는 날 `docs/release-env-split.md` 3절대로 고친다.
  deploy-staging:
    name: Deploy → Staging
    needs: [ci]
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch' && inputs.environment == 'staging'
    runs-on: ubuntu-latest
    # 이 잡이 운영 DB를 바꾼다. GitHub의 Environment 보호 규칙(required reviewer)을
    # 이 이름에 걸어두면 사람이 승인해야 넘어간다 — 저장소 설정에서 켠다
    # (Settings → Environments → production → Required reviewers).
    # 없어도 워크플로는 돌지만, 그때는 승인 없이 지나간다(Release Audit 1차 P0-6).
    environment: production
    concurrency:
      group: weddingpick-render-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 자동 배포 커밋 최신 여부
        if: github.event_name == 'push'
        shell: bash
        run: |
          current_main=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$current_main" != "$GITHUB_SHA" ]; then
            echo 'main이 변경돼 오래된 자동 배포를 중단한다.'
            exit 1
          fi

      # 무엇이 적용될지 먼저 보여준다. 승인하는 사람이 목록을 보고 정한다.
      - name: DB 상태 (적용 전)
        run: npm run migrate --workspace @weddingpick/db -- --status
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # 되돌릴 수 없는 구문이 섞여 있으면 멈춘다. 저장소에는 실제로 DELETE를
      # 담은 마이그레이션이 있다(0081 · 0089). 의도한 것이면 그 파일 안에
      # `-- allow-destructive: <이유>` 한 줄을 적는다 — 승인하는 사람이 무엇을
      # 승인하는지 알 수 있게 하려는 것이지, 막으려는 것이 아니다.
      - name: 파괴적 구문 확인
        run: node scripts/check-destructive-migrations.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: DB Migrate
        run: npm run migrate --workspace @weddingpick/db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Render 배포 (API 검증 후 정적 사이트)
        timeout-minutes: 90
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          ALL_SECRETS: ${{ toJSON(secrets) }}
          DEPLOY_COMMIT: ${{ github.sha }}
          WAIT_FOR_LIVE: 'true'
          REDEPLOY: 'true'
          API_SERVICE: weddingpickl-sg
          API_BASE_URL: https://weddingpickl-sg.onrender.com
        run: python3 scripts/render-env-sync.py

      - name: Health check
        timeout-minutes: 20
        run: node scripts/check-api-health.mjs --migrations-dir packages/db/migrations --attempts 60 --timeout-ms 90000 --delay-ms 15000

  # 위 deploy-staging과 같은 대상을 본다(같은 시크릿 · 같은 헬스체크 주소).
  # 서버가 한 벌이라 지금은 결과가 같다. 나누는 날 3절대로 고친다.
  deploy-production:
    name: Deploy → Production
    needs: [ci]
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    runs-on: ubuntu-latest
    # deploy-staging과 같은 DB를 본다. 승인 게이트도 같아야 한다.
    environment: production
    concurrency:
      group: weddingpick-render-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: DB 상태 (적용 전)
        run: npm run migrate --workspace @weddingpick/db -- --status
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: 파괴적 구문 확인
        run: node scripts/check-destructive-migrations.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: DB Migrate
        run: npm run migrate --workspace @weddingpick/db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Render 배포 (API 검증 후 정적 사이트)
        timeout-minutes: 90
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          ALL_SECRETS: ${{ toJSON(secrets) }}
          DEPLOY_COMMIT: ${{ github.sha }}
          WAIT_FOR_LIVE: 'true'
          REDEPLOY: 'true'
          API_SERVICE: weddingpickl-sg
          API_BASE_URL: https://weddingpickl-sg.onrender.com
        run: python3 scripts/render-env-sync.py

      - name: Health check
        timeout-minutes: 20
        run: node scripts/check-api-health.mjs --migrations-dir packages/db/migrations --attempts 60 --timeout-ms 90000 --delay-ms 15000
