# 웨딩픽 통합 파이프라인
#
# push(main)  → CI → DB 마이그레이션 → Render 자동 배포 → health check (staging)
# PR          → CI만 (배포 없음)
# workflow_dispatch → staging 또는 production 수동 배포
#
# 필요한 GitHub Secrets:
#   DATABASE_URL   Render PostgreSQL 연결 문자열
#   RENDER_API_KEY 커스텀 도메인 연결에 쓴다
#
# 배포 자체는 이 파일이 걸지 않는다 — Render의 autoDeploy가 main push를 보고 돈다.
# 환경변수는 infra/render-env.yml이 원본이고 render-env-sync.yml이 밀어넣는다.
name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 배포 환경
        type: choice
        options: [staging, production]
        default: staging
        required: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: weddingpick
          POSTGRES_PASSWORD: weddingpick
          POSTGRES_DB: weddingpick_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://weddingpick:weddingpick@localhost:5432/weddingpick_test
      # 미리보기 산출물 경로는 여기서만 정한다. 만드는 쪽과 올리는 쪽이 각자 알면 어긋난다.
      MARKETING_PREVIEW_DIR: .marketing-preview

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # 금지어 게이트. `spec/glossary.json`을 읽는 것은 이 스크립트뿐인데
      # **어느 워크플로에도 연결돼 있지 않았다** — 48개 금지어 중 37개가
      # 검사되지 않고 있었다(Release Audit 1차 P1-10).
      - name: Copy lint (금지어)
        run: node lint-copy.js spec/strings.ko.json apps packages

      - name: Test
        run: npm test

      - name: Marketing preview
        run: npm run marketing --workspace @weddingpick/api -- demo "$GITHUB_WORKSPACE/$MARKETING_PREVIEW_DIR"

      - name: Upload marketing preview
        uses: actions/upload-artifact@v4
        with:
          name: marketing-preview
          path: ${{ env.MARKETING_PREVIEW_DIR }}/
          # 산출물 디렉터리가 점으로 시작한다. v4.4부터 숨김 파일이 기본 제외라 빼면 아무것도 안 올라간다.
          include-hidden-files: true
          # 다른 두 워크플로와 같게 — 못 찾으면 경고가 아니라 실패다. 조용히 초록으로 끝나는 것을 막는다.
          if-no-files-found: error
          retention-days: 7

      - name: Bundle (web)
        run: npm run export:web --workspace @weddingpick/mobile

      - name: Build landing
        run: npm run build --workspace @weddingpick/web

  # 이름은 staging/production이지만 지금은 같은 대상을 본다 — 두 잡 모두
  # `secrets.DATABASE_URL`로 마이그레이션하고 `weddingpickl.onrender.com`을
  # 헬스체크한다. 사용자 결정(2026-09-09) 「우선 현재 DB 그대로 사용한다. 차후에 분리」에
  # 따라 지금은 이대로 둔다. 나누는 날 `docs/release-env-split.md` 3절대로 고친다.
  deploy-staging:
    name: Deploy → Staging
    needs: [ci]
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch' && inputs.environment == 'staging'
    runs-on: ubuntu-latest
    # 이 잡이 운영 DB를 바꾼다. GitHub의 Environment 보호 규칙(required reviewer)을
    # 이 이름에 걸어두면 사람이 승인해야 넘어간다 — 저장소 설정에서 켠다
    # (Settings → Environments → production → Required reviewers).
    # 없어도 워크플로는 돌지만, 그때는 승인 없이 지나간다(Release Audit 1차 P0-6).
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 무엇이 적용될지 먼저 보여준다. 승인하는 사람이 목록을 보고 정한다.
      - name: DB 상태 (적용 전)
        run: npm run migrate --workspace @weddingpick/db -- --status
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # 되돌릴 수 없는 구문이 섞여 있으면 멈춘다. 저장소에는 실제로 DELETE를
      # 담은 마이그레이션이 있다(0081 · 0089). 의도한 것이면 그 파일 안에
      # `-- allow-destructive: <이유>` 한 줄을 적는다 — 승인하는 사람이 무엇을
      # 승인하는지 알 수 있게 하려는 것이지, 막으려는 것이 아니다.
      - name: 파괴적 구문 확인
        run: node scripts/check-destructive-migrations.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: DB Migrate
        run: npm run migrate --workspace @weddingpick/db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Custom domains (weddingpick.kr)
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "RENDER_API_KEY 없음 — 커스텀 도메인 설정 생략"
            exit 0
          fi
          add_domain() {
            local SVC_NAME=$1
            local DOMAIN=$2
            SVC_ID=$(curl -sf -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services?name=${SVC_NAME}&limit=5" \
              | python3 -c "import sys,json;data=json.load(sys.stdin);items=[i for i in data if i.get('service',i).get('name','')==\"${SVC_NAME}\"];print(items[0].get('service',items[0]).get('id','') if items else '')" 2>/dev/null)
            if [ -z "$SVC_ID" ]; then
              echo "::warning::${SVC_NAME} 서비스가 Render 계정에 없어 ${DOMAIN} 도메인을 연결하지 못했습니다. render.yaml에는 정의되어 있지만 실제로 생성된 적이 없습니다 — Render 대시보드에서 수동 생성하거나 Blueprint를 연결해야 합니다."
              return 0
            fi
            echo "${SVC_NAME} (${SVC_ID}): ${DOMAIN} 도메인 추가 시도"
            RESP=$(curl -s -X POST \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"${DOMAIN}\"}" \
              "https://api.render.com/v1/services/${SVC_ID}/custom-domains")
            if echo "$RESP" | python3 -c "import sys,json;d=json.load(sys.stdin);sys.exit(0 if 'id' in d or 'already' in str(d.get('message','')).lower() or 'in use' in str(d.get('message','')).lower() else 1)" 2>/dev/null; then
              echo "${DOMAIN} 응답 (OK): $RESP"
            else
              echo "::warning::${DOMAIN} 도메인 연결 응답이 예상과 다릅니다 — 확인 필요: $RESP"
            fi
          }
          add_domain "weddingpick-web"   "weddingpick.kr"
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}

      - name: Health check
        run: |
          echo "Waiting for Render staging deployment to settle..."
          for i in $(seq 1 60); do
            sleep 15
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" https://weddingpickl.onrender.com/health 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✓ /health 200 OK"
              exit 0
            fi
            echo "Attempt $i/60: HTTP $STATUS"
          done
          echo "✗ Staging health check failed after 900 s"
          exit 1

  # 위 deploy-staging과 같은 대상을 본다(같은 시크릿 · 같은 헬스체크 주소).
  # 서버가 한 벌이라 지금은 결과가 같다. 나누는 날 3절대로 고친다.
  deploy-production:
    name: Deploy → Production
    needs: [ci]
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    runs-on: ubuntu-latest
    # deploy-staging과 같은 DB를 본다. 승인 게이트도 같아야 한다.
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: DB 상태 (적용 전)
        run: npm run migrate --workspace @weddingpick/db -- --status
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: 파괴적 구문 확인
        run: node scripts/check-destructive-migrations.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: DB Migrate
        run: npm run migrate --workspace @weddingpick/db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Health check
        run: |
          echo "Waiting for Render production deployment..."
          for i in $(seq 1 60); do
            sleep 15
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" https://weddingpickl.onrender.com/health 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✓ /health 200 OK"
              exit 0
            fi
            echo "Attempt $i/60: HTTP $STATUS"
          done
          echo "✗ Production health check failed after 900 s"
          exit 1
