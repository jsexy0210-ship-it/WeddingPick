# main 검증과 KakaoCloud API 배포를 한 실행으로 묶는다.
# Render 배포 경로는 폐기했다. 운영 및 정적 사이트 잔여 작업은 docs/deployment.md를 따른다.
# 이 워크플로 성공을 정적 사이트 전환 완료로 해석하지 않는다.
name: CI / Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 승인 대기가 다음 커밋의 CI를 막지 않도록 실행 전체에는 concurrency를 걸지 않는다.
jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    outputs:
      deploy_api: ${{ steps.api_changes.outputs.changed }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: weddingpick
          POSTGRES_PASSWORD: weddingpick
          POSTGRES_DB: weddingpick_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://weddingpick:weddingpick@localhost:5432/weddingpick_test
      MARKETING_PREVIEW_DIR: .marketing-preview

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Deployment policy regression tests
        run: node --test scripts/check-render-retired.test.mjs

      - name: Reject retired deployment paths
        run: node scripts/check-render-retired.mjs

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: SEED 토큰 (뽑은 값이 현행인지)
        run: node scripts/sync-seed-tokens.mjs --check

      - name: Copy lint (금지어)
        run: node lint-copy.js spec/strings.ko.json apps packages

      - name: Test
        run: npm test

      - name: API health validator test
        run: node --test scripts/check-api-health.test.mjs

      - name: Marketing preview
        run: npm run marketing --workspace @weddingpick/api -- demo "$GITHUB_WORKSPACE/$MARKETING_PREVIEW_DIR"

      - name: Upload marketing preview
        uses: actions/upload-artifact@v4
        with:
          name: marketing-preview
          path: ${{ env.MARKETING_PREVIEW_DIR }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Bundle (web)
        run: npm run export:web --workspace @weddingpick/mobile

      - name: Build landing
        run: npm run build --workspace @weddingpick/web

      - name: API 배포 대상 변경 확인
        id: api_changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          changed=true
          if [ "$EVENT_NAME" = push ] && [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            paths=$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")
            if ! grep -Eq '^(apps/api/|packages/(api-contract|db|domain)/|package(-lock)?\.json$|Dockerfile$|\.dockerignore$|\.github/workflows/(main|deploy-kakao-api)\.yml$)' <<< "$paths"; then
              changed=false
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "API deployment required: $changed"

  deploy-kakao:
    name: KakaoCloud API
    needs: [ci]
    if: github.repository == 'jsexy0210-ship-it/WeddingPick' && github.ref == 'refs/heads/main' && needs.ci.outputs.deploy_api == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-kakao-api.yml
