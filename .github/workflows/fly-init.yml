# Fly.io 최초 설정 — 앱 생성 + Secrets 설정
#
# 로컬 flyctl 없이 GitHub Actions에서 실행
# 사전 조건: FLY_API_TOKEN이 Repository Secret에 등록되어 있어야 함
# 네이버 로그인: NAVER_CLIENT_ID, NAVER_CLIENT_SECRET Repository Secret 필요
#
# 실행: Actions → Fly.io 초기 설정 → Run workflow
name: Fly.io 초기 설정

on:
  workflow_dispatch:

jobs:
  fly-init:
    name: 앱 생성 및 Secrets 설정
    runs-on: ubuntu-latest

    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: 앱 생성 (이미 있으면 건너뜀)
        run: |
          flyctl apps create weddingpickl || true
          flyctl apps create weddingpick-api || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Staging (weddingpickl) — Secrets 설정
        run: |
          flyctl secrets set \
            DATABASE_URL="$STAGING_DATABASE_URL" \
            AWS_ACCESS_KEY_ID="$STAGING_AWS_ACCESS_KEY_ID" \
            AWS_SECRET_ACCESS_KEY="$STAGING_AWS_SECRET_ACCESS_KEY" \
            S3_BUCKET="$STAGING_S3_BUCKET" \
            ANTHROPIC_API_KEY="$STAGING_ANTHROPIC_API_KEY" \
            NAVER_CLIENT_ID="$STAGING_NAVER_CLIENT_ID" \
            NAVER_CLIENT_SECRET="$STAGING_NAVER_CLIENT_SECRET" \
            NAVER_REDIRECT_URIS="weddingpick://auth/naver" \
            --app weddingpickl
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_AWS_ACCESS_KEY_ID: ${{ secrets.STAGING_AWS_ACCESS_KEY_ID }}
          STAGING_AWS_SECRET_ACCESS_KEY: ${{ secrets.STAGING_AWS_SECRET_ACCESS_KEY }}
          STAGING_S3_BUCKET: ${{ secrets.STAGING_S3_BUCKET }}
          STAGING_ANTHROPIC_API_KEY: ${{ secrets.STAGING_ANTHROPIC_API_KEY }}
          STAGING_NAVER_CLIENT_ID: ${{ secrets.STAGING_NAVER_CLIENT_ID }}
          STAGING_NAVER_CLIENT_SECRET: ${{ secrets.STAGING_NAVER_CLIENT_SECRET }}

      - name: Production (weddingpick-api) — Secrets 설정
        run: |
          flyctl secrets set \
            DATABASE_URL="$PROD_DATABASE_URL" \
            AWS_ACCESS_KEY_ID="$PROD_AWS_ACCESS_KEY_ID" \
            AWS_SECRET_ACCESS_KEY="$PROD_AWS_SECRET_ACCESS_KEY" \
            S3_BUCKET="$PROD_S3_BUCKET" \
            ANTHROPIC_API_KEY="$PROD_ANTHROPIC_API_KEY" \
            NAVER_CLIENT_ID="$PROD_NAVER_CLIENT_ID" \
            NAVER_CLIENT_SECRET="$PROD_NAVER_CLIENT_SECRET" \
            NAVER_REDIRECT_URIS="weddingpick://auth/naver" \
            LEGAL_TERMS_URL="$LEGAL_TERMS_URL" \
            LEGAL_PRIVACY_POLICY_URL="$LEGAL_PRIVACY_POLICY_URL" \
            LEGAL_CONTACT_EMAIL="$LEGAL_CONTACT_EMAIL" \
            --app weddingpick-api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          PROD_AWS_ACCESS_KEY_ID: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
          PROD_AWS_SECRET_ACCESS_KEY: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
          PROD_S3_BUCKET: ${{ secrets.PROD_S3_BUCKET }}
          PROD_ANTHROPIC_API_KEY: ${{ secrets.PROD_ANTHROPIC_API_KEY }}
          PROD_NAVER_CLIENT_ID: ${{ secrets.PROD_NAVER_CLIENT_ID }}
          PROD_NAVER_CLIENT_SECRET: ${{ secrets.PROD_NAVER_CLIENT_SECRET }}
          LEGAL_TERMS_URL: ${{ secrets.LEGAL_TERMS_URL }}
          LEGAL_PRIVACY_POLICY_URL: ${{ secrets.LEGAL_PRIVACY_POLICY_URL }}
          LEGAL_CONTACT_EMAIL: ${{ secrets.LEGAL_CONTACT_EMAIL }}
