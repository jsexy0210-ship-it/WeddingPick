# Fly.io 최초 설정 — 앱 생성 + Secrets 설정
#
# 로컬 flyctl 없이 GitHub Actions에서 실행
# 사전 조건: FLY_API_TOKEN이 Repository Secret에 등록되어 있어야 함
#
# 실행: Actions → Fly.io 초기 설정 → Run workflow
name: Fly.io 초기 설정

on:
  workflow_dispatch:

jobs:
  fly-init:
    name: 앱 생성 및 Secrets 설정
    runs-on: ubuntu-latest

    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: 앱 생성 (이미 있으면 건너뜀)
        run: |
          fly apps create weddingpickl || true
          fly apps create weddingpick-api || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Staging (weddingpickl) — Secrets 설정
        run: |
          fly secrets set \
            DATABASE_URL="$DATABASE_URL" \
            AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
            AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
            S3_BUCKET="$S3_BUCKET" \
            ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
            --app weddingpickl
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Production (weddingpick-api) — Secrets 설정
        run: |
          fly secrets set \
            DATABASE_URL="$DATABASE_URL" \
            AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
            AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
            S3_BUCKET="$S3_BUCKET" \
            ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
            --app weddingpick-api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
