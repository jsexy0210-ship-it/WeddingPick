name: Deploy Slim Kakao API Once

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.repository == 'jsexy0210-ship-it/WeddingPick' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message || '', '[deploy-slim-api-d6d16]') }}
    uses: ./.github/workflows/deploy-kakao-api.yml
    with:
      environment_name: production
