# API 상태만 읽는다. 배포, 환경변수 변경, DB 마이그레이션은 하지 않는다.
name: API health 확인 (읽기 전용)

on:
  workflow_dispatch:
    inputs:
      api:
        description: 확인할 API 주소
        type: string
        required: false
        default: https://210.109.82.212

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Verify API and database health
        env:
          API: ${{ inputs.api || 'https://210.109.82.212' }}
        run: node scripts/check-api-health.mjs --attempts 3 --timeout-ms 20000 --delay-ms 5000
