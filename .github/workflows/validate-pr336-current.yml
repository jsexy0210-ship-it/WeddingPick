name: Validate PR336 current
on:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    if: github.head_ref == 'chatgpt/gate-live-favicon-production-20260918-2'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: node --test scripts/verification/kakao-vm-concurrency-favicon.test.mjs
