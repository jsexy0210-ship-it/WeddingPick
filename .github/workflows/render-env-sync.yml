name: Render env sync

# `infra/render-env.yml`을 Render 서비스에 밀어넣는다.
#
# 대시보드를 손으로 여는 일을 없애려고 만들었다. 값의 원본은 저장소이고, 여기서
# 실제 반영은 main.yml의 CI와 DB migration을 통과한 뒤 실행한다.
# 이 워크플로는 읽기 전용 수동 점검만 제공해 그 순서를 우회하지 않는다.
#
# 안전 규칙: **키 하나씩 upsert만 한다.** 선언에 없는 키는 읽지도 지우지도 않는다 —
# 운영 API에는 이 선언에 없는 비밀(DATABASE_URL·APPLE_PRIVATE_KEY 등)이 있고,
# 통째로 바꾸는 API를 쓰면 그것들이 지워진다.

on:
  workflow_dispatch:
    inputs:
      service:
        description: '확인할 정확한 서비스 이름. 비우면 전체 확인(실제 반영 없음)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: render-env-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Sync env vars to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          # 선언의 `secrets:`가 이름으로 찾아 쓴다. 값은 로그에 찍지 않는다.
          ALL_SECRETS: ${{ toJSON(secrets) }}
          DRY_RUN: 'true'
          REDEPLOY: 'false'
          DEPLOY_COMMIT: ${{ github.sha }}
          API_SERVICE: weddingpickl-sg
          SERVICE: ${{ inputs.service }}
        run: python3 scripts/render-env-sync.py
