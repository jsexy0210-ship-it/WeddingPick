name: Validate PR402 current

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'chatgpt/kakao-vm-concurrency-core-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Kakao VM core concurrency regression
        run: node --test scripts/verification/kakao-vm-concurrency-core.test.mjs
