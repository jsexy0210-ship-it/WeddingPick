name: Validate PR397 retired Naver build env

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'chatgpt/naver-render-callback-retire-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Validate EAS JSON
        run: node -e "JSON.parse(require('fs').readFileSync('apps/mobile/eas.json','utf8'))"
      - name: Validate Android workflow YAML
        run: ruby -e "require 'yaml'; YAML.load_file('.github/workflows/android-apk.yml', aliases: true)"
      - name: Confirm retired Naver public build env removed
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE 'EXPO_PUBLIC_NAVER_(CLIENT_ID|REDIRECT_URI)|weddingpickl-sg\.onrender\.com/v1/auth/naver/callback'             apps/mobile/eas.json .github/workflows/android-apk.yml; then
            echo "retired Naver public build env/callback still present" >&2
            exit 1
          fi
      - name: Confirm parent upload-artifact v6 retained
        shell: bash
        run: grep -q 'actions/upload-artifact@v6' .github/workflows/android-apk.yml
