# EAS 프로젝트를 붙이고 `app.json`에 그 결과를 적어 커밋한다. **한 번만 돌린다.**
#
# `eas init`은 보통 로컬에서 사람이 돌리는 명령이다. 하는 일은 두 가지 —
# Expo 서버에 프로젝트를 만들고(또는 이미 있으면 찾고), 그 id를 `app.json`에
# 적는 것. 둘 다 토큰만 있으면 되고 브라우저가 필요 없다. 그래서 여기서 한다.
#
# 결과를 **레포에 다시 커밋한다.** 빌드 워크플로가 `app.json`에서 그 id를 읽기
# 때문이다. 러너의 체크아웃만 고치면 이 잡이 끝나는 순간 같이 사라진다.
#
# 한 번 붙고 나면 이 워크플로는 할 일이 없다. 그래도 지우지 않는다 — 나중에
# Expo 계정을 옮기거나 프로젝트를 다시 만들 때 같은 일이 필요해진다.
name: EAS Init

on:
  workflow_dispatch:

# app.json을 고쳐 main에 되돌려 놓는다.
permissions:
  contents: write

jobs:
  init:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm i -g eas-cli

      - run: npm ci

      - name: Check token
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN 시크릿이 없습니다."
            exit 1
          fi

      # 누구로 붙는지 먼저 찍는다. 토큰이 어느 계정 것인지 모르는 채로 프로젝트를
      # 만들면, 나중에 "내 Expo 대시보드에 안 보인다"가 된다.
      - name: Who am I
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas whoami

      # 이미 붙어 있으면 그대로 두고 끝낸다.
      #
      # `--force`는 **없는 프로젝트를 만든다**는 뜻이다. 위의 검사를 통과했다는
      # 것은 `app.json`에 아무 id도 없다는 뜻이므로, 여기서 만드는 것이 맞다.
      # 검사 없이 `--force`만 붙여두면 이미 붙은 레포에서 새 프로젝트가 하나 더
      # 생기고, 그때 기존 빌드 이력과 자격증명이 끊긴다. 순서가 안전장치다.
      - name: Link project
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail

          if grep -q '"projectId"' app.json; then
            echo "이미 붙어 있습니다. 아무것도 하지 않습니다."
            exit 0
          fi

          eas init --non-interactive --force

      - name: Show result
        working-directory: apps/mobile
        run: |
          python3 - <<'PY'
          import json, io
          c = json.load(io.open('app.json', encoding='utf-8'))['expo']
          print('owner    :', c.get('owner'))
          print('slug     :', c.get('slug'))
          print('projectId:', (c.get('extra') or {}).get('eas', {}).get('projectId'))
          PY

      # 바뀐 것이 없으면 커밋하지 않는다. 빈 커밋은 이력에 소음만 남긴다.
      - name: Commit
        run: |
          set -euo pipefail

          if git diff --quiet -- apps/mobile/app.json; then
            echo "app.json이 그대로입니다. 커밋할 것이 없습니다."
            exit 0
          fi

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/app.json
          git commit -m 'eas init — app.json에 projectId를 적는다

          빌드 워크플로가 이 값을 읽어 어느 Expo 프로젝트로 지을지 정한다.
          로컬 저장소 없이 Actions에서 `eas init`을 돌린 결과다.'
          git push
