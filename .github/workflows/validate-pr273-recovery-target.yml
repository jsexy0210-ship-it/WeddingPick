name: Validate PR 273 Recovery Harness

on:
  push:
    branches:
      - claude/overhaul-lounge-my
    paths:
      - '.github/workflows/validate-pr273-recovery-target.yml'
      - 'scripts/verify-design-recovery.cjs'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Design recovery regression only
        run: npm run test --workspace @weddingpick/mobile -- --runInBand src/features/navigation/design-recovery.test.ts
