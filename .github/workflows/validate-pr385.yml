name: Validate PR385 artifact actions

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'chatgpt/upload-artifact-v6-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify artifact actions
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            .github/workflows/android-apk.yml \
            .github/workflows/eas-apk-preview.yml \
            .github/workflows/public-data.yml \
            .github/workflows/vendor-monitor.yml; do
            grep -Fq 'actions/upload-artifact@v6' "$file"
            if grep -Fq 'actions/upload-artifact@v4' "$file"; then
              echo "old upload-artifact remains: $file" >&2
              exit 1
            fi
          done
