name: Validate PR 273 Final

on:
  push:
    branches:
      - claude/overhaul-lounge-my

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck Lint Non-API Tests Web Export
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: weddingpick
          POSTGRES_PASSWORD: weddingpick
          POSTGRES_DB: weddingpick_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://weddingpick:weddingpick@localhost:5432/weddingpick_test
      EXPO_PUBLIC_API_URL: https://example.invalid
      EXPO_PUBLIC_WEB_URL: https://example.invalid
      EXPO_PUBLIC_KAKAO_CLIENT_ID: validation-only
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Root pretests
        run: npm run pretest
      - name: Mobile tests
        run: npm run test --workspace @weddingpick/mobile
      - name: Web tests
        run: npm run test --workspace @weddingpick/web
      - name: API contract tests
        run: npm run test --workspace @weddingpick/api-contract
      - name: DB tests
        run: npm run test --workspace @weddingpick/db
      - name: Domain tests
        run: npm run test --workspace @weddingpick/domain
      - name: Expo web export
        run: npm run export:web --workspace @weddingpick/mobile

  api-tests:
    name: API Tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: weddingpick
          POSTGRES_PASSWORD: weddingpick
          POSTGRES_DB: weddingpick_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://weddingpick:weddingpick@localhost:5432/weddingpick_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run API shard
        run: npm run test --workspace @weddingpick/api -- --shard=${{ matrix.shard }}/2
