# 운영 데이터 집계와 공개 API 상태를 읽는다. DB나 배포 설정을 바꾸지 않는다.
name: DB Inventory (읽기 전용)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 어느 DB를 볼 것인가
        type: choice
        default: production
        options: [production, default, staging]

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 데이터 현황 조회
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DEFAULT_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          TARGET: ${{ github.event.inputs.target }}
        run: |
          case "${TARGET:-production}" in
            production) export DATABASE_URL="$PRODUCTION_DATABASE_URL" ;;
            staging)    export DATABASE_URL="$STAGING_DATABASE_URL" ;;
            *)          export DATABASE_URL="$DEFAULT_DATABASE_URL" ;;
          esac
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::${TARGET:-production} 대상의 접속 정보가 GitHub Secrets에 없다."
            exit 1
          fi
          echo "대상: ${TARGET:-production}"
          npx tsx scripts/db-inventory.ts
      - name: 운영 API 상태 확인 (읽기 전용)
        run: node scripts/check-api-health.mjs --attempts 3 --timeout-ms 20000 --delay-ms 5000
