# 스테이징 Neon DB(weddingpick_staging)에 마이그레이션을 적용한다. 수동으로 돌린다.
#
# STAGING_DATABASE_URL GitHub Secret이 있어야 한다 — 운영 DB_MIGRATE.yml의
# DATABASE_URL(운영 DB)과는 별개의 값이다. 절대 같은 값을 넣지 않는다.
# 멱등하다 — 이미 적용된 버전은 건너뛴다.
name: DB Migrate (Staging)

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run migrations (staging)
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: npm run migrate --workspace @weddingpick/db
