name: Validate PR401 preview XFF

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'chatgpt/nginx-client-ip-preview-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: |
          bash -n scripts/install-kakao-preview-routes.sh
          node --test scripts/verification/preview-client-ip-header.test.mjs
