name: Validate API Test Shards

on:
  push:
    branches:
      - chatgpt/ci-api-test-shards-20260918

permissions:
  contents: read

jobs:
  shard:
    name: API shard ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    concurrency:
      group: validate-api-shards-${{ github.ref }}-${{ matrix.shard }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: weddingpick
          POSTGRES_PASSWORD: weddingpick
          POSTGRES_DB: weddingpick_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://weddingpick:weddingpick@localhost:5432/weddingpick_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test --workspace @weddingpick/api -- --shard=${{ matrix.shard }}/2
