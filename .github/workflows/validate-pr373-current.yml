name: Validate PR373 current
on:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    if: github.head_ref == 'chatgpt/static-favicon-png-roots-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export mobile web
        env:
          EXPO_PUBLIC_API_URL: https://210.109.82.212
          EXPO_PUBLIC_KAKAO_CLIENT_ID: 8e9a14dd3a0aa1a420bff858460c415c
          EXPO_PUBLIC_WEB_URL: https://210.109.82.212
        run: npm run export:web --workspace @weddingpick/mobile
      - name: Build landing
        env:
          WEDDINGPICK_CONTACT_EMAIL: help.weddingpick@gmail.com
          WEDDINGPICK_API_URL: https://210.109.82.212
          LEGAL_TERMS_EFFECTIVE_ON: '2026-09-10'
          LEGAL_PRIVACY_EFFECTIVE_ON: '2026-09-21'
        run: npm run build --workspace @weddingpick/web
      - name: Package and verify favicon bytes
        env:
          ADMIN_ORIGIN: https://210.109.82.212:8443
        run: |
          node scripts/package-kakao-static.mjs
          cmp apps/mobile/assets/images/favicon.png .kakao-static/app/favicon.png
          cmp apps/mobile/assets/images/favicon.png .kakao-static/admin/favicon.png
          cmp apps/mobile/assets/images/favicon.png .kakao-static/web/favicon.png
