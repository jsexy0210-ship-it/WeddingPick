name: Validate vendor static map

on:
  push:
    branches:
      - 'chatgpt/vendor-static-map-20260918'

permissions:
  contents: read

concurrency:
  group: validate-vendor-static-map-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Workspace typecheck
        run: npm run typecheck
      - name: Repository lint
        run: npm run lint
      - name: Mobile regressions
        run: npm run test --workspace @weddingpick/mobile -- --runInBand
      - name: API contract regressions
        run: npm run test --workspace @weddingpick/api-contract
      - name: Expo web export
        run: npm run export:web --workspace @weddingpick/mobile

  map-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: weddingpick
          POSTGRES_PASSWORD: weddingpick
          POSTGRES_DB: weddingpick_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://weddingpick:weddingpick@localhost:5432/weddingpick_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Map API typecheck
        run: npm run typecheck --workspace @weddingpick/api
      - name: Static map regressions
        run: >
          npm run test --workspace @weddingpick/api --
          src/test/kakao-geocode.test.ts
          src/test/kakao-static-map.test.ts
          src/test/vendor-static-map-route.test.ts
          src/test/vendor-id-shape.test.ts
