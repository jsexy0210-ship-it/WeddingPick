name: Unify Live Favicon

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: weddingpick-kakao-vm-write
  cancel-in-progress: false

jobs:
  apply:
    name: Apply one favicon to app admin website
    environment: production
    runs-on: [self-hosted, Linux, X64, weddingpick-kakao]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: bash ./scripts/unify-live-favicon.sh
