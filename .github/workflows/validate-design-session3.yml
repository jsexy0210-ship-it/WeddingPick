name: Validate Design Session 3

on:
  push:
    branches:
      - claude/overhaul-lounge-my
    paths:
      - 'apps/mobile/src/app/(tabs)/pick/**'
      - 'apps/mobile/src/features/pick/**'
      - 'apps/mobile/src/components/confirm-alert*'
      - 'apps/mobile/src/components/confirmation-queue*'
      - 'apps/mobile/src/features/navigation/**'
      - 'scripts/fixtures/api.cjs'
      - '.github/workflows/validate-design-session3.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Pick Dialog Navigation Validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_API_URL: http://127.0.0.1:39999
      EXPO_PUBLIC_WEB_URL: https://example.invalid
      EXPO_PUBLIC_KAKAO_CLIENT_ID: validation-only
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Full workspace typecheck diagnostic
        id: full_typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: Owned scope typecheck
        id: owned_typecheck
        continue-on-error: true
        run: |
          mkdir -p apps/mobile/.design-stubs
          cat > apps/mobile/.design-stubs/webshell-config.ts <<'TS'
          export const isWebShellScreen = (_id: string): boolean => false;
          TS
          cat > apps/mobile/.design-stubs/web-shell-view.ts <<'TS'
          export const WebShellView = (_props: { path: string }): null => null;
          TS
          cat > apps/mobile/tsconfig.design-session3.json <<'JSON'
          {
            "extends": "./tsconfig.json",
            "include": [],
            "compilerOptions": {
              "paths": {
                "@/features/webshell/config": ["./.design-stubs/webshell-config.ts"],
                "@/features/webshell/WebShellView": ["./.design-stubs/web-shell-view.ts"],
                "@/*": ["./src/*"],
                "@/assets/*": ["./assets/*"]
              }
            },
            "files": [
              "src/app/(tabs)/pick/index.tsx",
              "src/app/(tabs)/pick/[category].tsx",
              "src/app/(tabs)/pick/category.tsx",
              "src/app/(tabs)/pick/compare.tsx",
              "src/app/(tabs)/pick/confirm.tsx",
              "src/app/(tabs)/pick/done.tsx",
              "src/app/(tabs)/pick/history.tsx",
              "src/app/(tabs)/pick/removed.tsx",
              "src/features/pick/canonical-rules.ts",
              "src/features/pick/pick-sheets.tsx",
              "src/components/confirm-alert.ts",
              "src/components/confirm-alert.web.ts",
              "src/components/confirm-alert-toast.tsx",
              "src/components/confirmation-queue.ts",
              "src/features/navigation/depth-back-rules.ts",
              "src/features/navigation/depth-back.ts",
              "src/features/navigation/root-tab-visibility.ts",
              "src/features/navigation/root-tabs.ts",
              "src/features/navigation/tab-bar.tsx"
            ]
          }
          JSON
          npx tsc -p apps/mobile/tsconfig.design-session3.json --noEmit

      - name: Full workspace lint diagnostic
        id: full_lint
        continue-on-error: true
        run: npm run lint

      - name: Owned scope lint
        id: owned_lint
        continue-on-error: true
        working-directory: apps/mobile
        run: |
          npx eslint             "src/app/(tabs)/pick"             "src/features/pick"             "src/components/confirm-alert.ts"             "src/components/confirm-alert.web.ts"             "src/components/confirm-alert-toast.tsx"             "src/components/confirmation-queue.ts"             "src/features/navigation"

      - name: Owned Session 3 tests
        id: owned_tests
        continue-on-error: true
        run: |
          npm run test --workspace @weddingpick/mobile -- --runInBand \
            src/components/confirm-alert.test.ts \
            src/components/confirm-alert-toast.test.ts \
            src/components/confirmation-queue.test.ts \
            src/features/pick/canonical-rules.test.ts \
            src/features/pick/pick-done-back.test.ts \
            src/features/navigation/back-button-position.test.tsx \
            src/features/navigation/depth-back.test.ts \
            src/features/navigation/depth-back-history.test.ts \
            src/features/navigation/root-tabs.test.ts

      - name: Cross-scope navigation diagnostic
        id: cross_scope_navigation
        continue-on-error: true
        run: |
          npm run test --workspace @weddingpick/mobile -- --runInBand \
            src/features/navigation/depth-back-buttons.test.tsx \
            src/features/navigation/design-recovery.test.ts

      - name: Expo web export
        id: web_export
        continue-on-error: true
        run: npm run export:web --workspace @weddingpick/mobile

      - name: Install capture browser
        if: steps.web_export.outcome == 'success'
        run: |
          npm install --global playwright@1.55.0
          playwright install --with-deps chromium

      - name: Capture Pick root
        id: capture_root
        if: steps.web_export.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p design-captures/pick-root
          node scripts/screenshot-screens.mjs             --route /pick             --full             --edges             --wait 1800             --out design-captures/pick-root

      - name: Capture Pick compare banner
        id: capture_compare
        if: steps.web_export.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p design-captures/pick-compare
          node scripts/screenshot-screens.mjs             --route /pick             --tap "강남 A 웨딩홀 비교에 담기"             --tap "강남 B 웨딩홀 비교에 담기"             --full             --edges             --wait 1800             --out design-captures/pick-compare

      - name: Capture Pick removal dialog
        id: capture_dialog
        if: steps.web_export.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p design-captures/pick-dialog
          node scripts/screenshot-screens.mjs             --route /pick             --tap "강남 A 웨딩홀 빼기"             --full             --edges             --wait 1200             --out design-captures/pick-dialog

      - name: Capture Pick undo toast
        id: capture_toast
        if: steps.web_export.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p design-captures/pick-toast
          node scripts/screenshot-screens.mjs             --route /pick             --tap "강남 A 웨딩홀 빼기"             --tap "빼기"             --full             --edges             --wait 400             --out design-captures/pick-toast

      - name: Capture dialog canon
        id: capture_canon
        continue-on-error: true
        run: |
          mkdir -p design-captures
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/design-canon.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          sleep 2
          if command -v playwright >/dev/null 2>&1; then
            playwright screenshot --viewport-size=1600,1200 --full-page               http://127.0.0.1:4173/docs/design/figma-export/09-dialogs.dc.html               design-captures/canon-dialogs.png
          fi

      - name: Validation manifest
        if: always()
        run: |
          mkdir -p design-captures
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "branch=$(git branch --show-current)"
            echo "workflow=Validate Design Session 3"
          } > design-captures/validation.txt

      - name: Upload design captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-session3-captures
          path: design-captures/
          if-no-files-found: warn
          retention-days: 7

      - name: Owned scope validation gate
        if: always()
        run: |
          test "${{ steps.owned_typecheck.outcome }}" = "success"
          test "${{ steps.owned_lint.outcome }}" = "success"
          test "${{ steps.owned_tests.outcome }}" = "success"
          test "${{ steps.web_export.outcome }}" = "success"
          test "${{ steps.capture_root.outcome }}" = "success"
          test "${{ steps.capture_compare.outcome }}" = "success"
          test "${{ steps.capture_dialog.outcome }}" = "success"
          test "${{ steps.capture_toast.outcome }}" = "success"
