name: Audit Kakao Legal API

on:
  workflow_call:

permissions:
  contents: read

jobs:
  audit:
    name: Verify public legal endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify terms and privacy public documents
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.request

          base = "https://210.109.82.212"
          for doc in ("terms", "privacy"):
              url = f"{base}/v1/legal/{doc}"
              with urllib.request.urlopen(url, timeout=20) as response:
                  if response.status != 200:
                      raise SystemExit(f"{doc}: unexpected HTTP {response.status}")
                  data = json.load(response)

              document = data.get("document")
              if not isinstance(document, dict):
                  raise SystemExit(f"{doc}: document missing")
              if document.get("type") != doc:
                  raise SystemExit(f"{doc}: wrong type")
              if not isinstance(document.get("version"), str) or not document["version"].strip():
                  raise SystemExit(f"{doc}: version missing")
              if not isinstance(document.get("effectiveOn"), str) or len(document["effectiveOn"]) != 10:
                  raise SystemExit(f"{doc}: effectiveOn missing")
              clauses = document.get("clauses")
              if not isinstance(clauses, list) or not clauses:
                  raise SystemExit(f"{doc}: public clauses missing")

              print(f"{doc}=ok version={document['version']} effectiveOn={document['effectiveOn']} clauses={len(clauses)}")
          PY
