name: Validate PR388 API tag rollback

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'chatgpt/api-current-tag-rollback-20260918-2'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Regression
        run: |
          node --test scripts/verification/api-current-tag-rollback.test.mjs
