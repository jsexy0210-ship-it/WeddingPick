# EAS로 앱을 짓는다. iOS·안드로이드 둘 다.
#
# ── 왜 러너에서 직접 짓지 않는가 ────────────────────────────────────
#
# 둘 다 GitHub 러너에서 지어봤고, 둘 다 막혔다.
#
#   iOS   — `expo-modules-jsi`가 러너의 **어느 Xcode에서도** 컴파일되지 않는다.
#           Xcode 16.4(Swift 6.1)는 SwiftPM이 거절하고(패키지가 tools 6.2 요구),
#           Swift 6.2 계열은 패키지 소스가 깨진다:
#             'weak' must be a mutable variable
#             'RuntimeScheduler' cannot be annotated with SWIFT_RETURNS_RETAINED
#           너무 낡거나 너무 새롭거나뿐이고 중간이 러너에 없다. 패키지를 올려도
#           안 된다 — 57.0.6이 SDK 57의 마지막이고 그 위는 SDK 58 canary다.
#
#   안드로이드 — 짓기는 하는데 Gradle이 세 시간을 넘긴다. 한 번 43분에 끝난
#           기록이 있어 재시도해봤지만 같은 패턴이었다.
#
# EAS는 Expo SDK에 맞는 툴체인을 자기가 고정해서 쓴다. 그래서 이 문제를
# 겪지 않는다. 러너에서 직접 짓는 `android-apk.yml`은 계정 없이 쓸 수 있는
# 대비책으로 남겨둔다.
#
# ── 처음 한 번은 사람이 해야 하는 것 ────────────────────────────────
#
#   1. `cd apps/mobile && eas login && eas init`
#      → `app.json`에 `extra.eas.projectId`가 생긴다. **커밋해야** CI가 찾는다.
#
#   2. GitHub → Settings → Secrets and variables → Actions → `EXPO_TOKEN`
#      (expo.dev → Account settings → Access tokens에서 발급)
#
#   3. iOS를 실기기·TestFlight로 낼 때만, 시크릿 둘을 더 넣는다.
#
#        EXPO_APPLE_ID                     애플 개발자 계정 이메일
#        EXPO_APPLE_APP_SPECIFIC_PASSWORD  앱 암호 (일반 비밀번호가 아니다)
#
#      앱 암호는 appleid.apple.com → 로그인 및 보안 → 앱 암호에서 만든다.
#      이 둘이 있으면 EAS가 애플에 대신 로그인해서 배포 인증서와 프로비저닝
#      프로파일을 만들어 보관한다 — 사람이 맥 앞에 앉을 필요가 없다.
#
#      **일반 비밀번호를 넣지 않는다.** 앱 암호는 이 용도로만 쓰이고 언제든
#      따로 폐기할 수 있다. 계정 비밀번호를 CI에 두면 그 자리가 계정 전체다.
#
#      안드로이드는 이 단계가 없다. EAS가 키스토어를 알아서 만들어 보관한다.
#      `simulator` 프로필도 없다 — 서명하지 않는 빌드라 자격증명이 필요 없다.
#
# 그다음부터는 Actions 탭에서 Run workflow만 누르면 된다.
name: EAS Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 어느 플랫폼을 지을까
        required: true
        default: all
        type: choice
        options:
          - all
          - ios
          - android
      profile:
        description: >-
          production = 스토어·TestFlight / preview = 등록한 기기·APK /
          simulator = 맥 시뮬레이터용 (애플 인증서 없이 됨, iOS 전용)
        required: true
        default: production
        type: choice
        options:
          - production
          - preview
          - simulator
      api_url:
        description: >-
          앱이 붙을 API 주소 (예: https://api.example.com).
          비워두면 서버에 붙지 않는 빌드가 된다 — 촬영과 기기 저장은 되지만
          업체 검색·가격·Pick이 동작하지 않는다.
        required: false
        default: ''
      submit:
        description: 빌드가 끝나면 스토어에 올린다 (production일 때만)
        required: false
        default: false
        type: boolean

jobs:
  build:
    # EAS가 자기 기계에서 짓는다. 이 러너는 명령을 보내고 기다리기만 한다.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 남의 액션을 끼우지 않는다. eas-cli가 EXPO_TOKEN 환경변수를 스스로 읽는다 —
      # 액션 하나를 덜 믿는 만큼 버전이 어긋날 자리도 줄어든다.
      - run: npm i -g eas-cli

      - run: npm ci

      # 빌드를 20분 태우고 나서야 알게 되는 것들을 앞에서 막는다.
      - name: Check setup
        run: |
          set -euo pipefail
          fail=0

          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN 시크릿이 없습니다. 이 파일 맨 위 2번을 보세요."
            fail=1
          fi

          # `eas init`을 안 했으면 프로젝트가 어느 계정 것인지 알 수 없다.
          if ! grep -q '"projectId"' apps/mobile/app.json; then
            echo "::error::app.json에 eas projectId가 없습니다. EAS Init 워크플로를 먼저 돌려주세요."
            fail=1
          fi

          # 서명이 필요한 iOS 빌드인데 애플 자격증명이 없으면, EAS가 인증서를
          # 만들려다 대화형 로그인을 요구하며 멈춘다. 그 실패는 20분 뒤에 온다.
          needs_apple=no
          case "${{ inputs.platform }}" in
            ios|all) [ "${{ inputs.profile }}" != simulator ] && needs_apple=yes ;;
          esac

          if [ "$needs_apple" = yes ] && [ -z "${{ secrets.EXPO_APPLE_ID }}" ]; then
            echo "::error::iOS 서명 빌드인데 EXPO_APPLE_ID·EXPO_APPLE_APP_SPECIFIC_PASSWORD가 없습니다. 이 파일 맨 위 3번을 보세요."
            fail=1
          fi

          exit $fail

      - name: Warn about missing API url
        if: inputs.api_url == ''
        run: >-
          echo "::warning::API 주소 없이 빌드합니다.
          설치는 되지만 업체 검색·가격·Pick이 동작하지 않습니다."

      # 서버 주소를 `eas.json`에 적어 넣는다.
      #
      # **이 러너의 환경변수는 빌드에 닿지 않는다.** `eas build`는 소스를 EAS로
      # 올려 거기서 짓고, 번들이 만들어지는 곳은 저쪽 기계다. 여기서 env로 넘기면
      # 명령을 부르는 프로세스에만 붙고 번들에는 안 들어간다 — 앱을 깔아보고 나서야
      # 알게 되는 종류의 어긋남이다.
      #
      # 프로필의 `env`는 EAS가 읽어서 빌드 환경에 넣어준다. 커밋하지 않고
      # 러너의 체크아웃만 고친다.
      - name: Inject API url
        if: inputs.api_url != ''
        run: |
          python3 - <<'PY'
          import json, io
          path = 'apps/mobile/eas.json'
          doc = json.load(io.open(path, encoding='utf-8'))
          profile = doc['build']['${{ inputs.profile }}']
          profile.setdefault('env', {})['EXPO_PUBLIC_API_URL'] = '${{ inputs.api_url }}'
          io.open(path, 'w', encoding='utf-8').write(json.dumps(doc, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps(profile, ensure_ascii=False))
          PY

      # 애플 자격증명은 있을 때만 붙는다. 없으면 빈 값이 되고, 서명이 필요 없는
      # 빌드(안드로이드·시뮬레이터)는 그대로 지나간다.
      - name: Build
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_ID: ${{ secrets.EXPO_APPLE_ID }}
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}
        run: eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive

      # 빌드가 끝난 뒤 별도 명령으로 올린다. 빌드와 제출을 한 명령으로 묶으면
      # 제출이 실패했을 때 빌드까지 다시 돌려야 한다.
      - name: Submit
        if: inputs.submit && inputs.profile == 'production'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_ID: ${{ secrets.EXPO_APPLE_ID }}
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}
        run: eas submit --platform ${{ inputs.platform }} --latest --non-interactive
