name: Validate PR 273 Current Head
# final-verification-sha-4
# final-verification-sha-3
# rerun-after-navigation-harness-fix
# rerun-after-typography-token-fix

on:
  push:
    branches:
      - claude/overhaul-lounge-my
    paths:
      - '.github/workflows/validate-pr273-current-head.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Full Regression and Missing Design Captures
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: weddingpick
          POSTGRES_PASSWORD: weddingpick
          POSTGRES_DB: weddingpick_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://weddingpick:weddingpick@localhost:5432/weddingpick_test
      EXPO_PUBLIC_API_URL: http://127.0.0.1:39999
      EXPO_PUBLIC_WEB_URL: https://example.invalid
      EXPO_PUBLIC_KAKAO_CLIENT_ID: validation-only
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Browser native dialog guard
        run: |
          set -euo pipefail
          if grep -RInE --include='*.ts' --include='*.tsx' \
            'window\.(alert|confirm|prompt)\(' apps/mobile/src packages/ui/src; then
            echo "Browser-native dialog call remains." >&2
            exit 1
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Root pretests
        run: npm run pretest
      - name: Mobile tests
        run: npm run test --workspace @weddingpick/mobile
      - name: Web tests
        run: npm run test --workspace @weddingpick/web
      - name: API contract tests
        run: npm run test --workspace @weddingpick/api-contract
      - name: DB tests
        run: npm run test --workspace @weddingpick/db
      - name: Domain tests
        run: npm run test --workspace @weddingpick/domain
      - name: Expo web export
        run: npm run export:web --workspace @weddingpick/mobile
      - name: Install capture browser
        run: |
          npm install --global playwright@1.55.0
          playwright install --with-deps chromium
      - name: Capture search
        run: |
          mkdir -p design-captures/search
          node scripts/screenshot-screens.mjs --route /search --full --edges --wait 1800 --out design-captures/search
      - name: Capture vendor detail
        run: |
          mkdir -p design-captures/vendor-detail
          node scripts/screenshot-screens.mjs \
            --route /search/11111111-1111-4111-8111-111111111111 \
            --full --edges --wait 1800 --out design-captures/vendor-detail
      - name: Capture login
        run: |
          mkdir -p design-captures/login
          node scripts/screenshot-screens.mjs --route /login --guest --full --edges --wait 1800 --out design-captures/login
      - name: Capture setup onboarding
        run: |
          mkdir -p design-captures/setup
          node scripts/screenshot-screens.mjs --route /setup --full --edges --wait 1800 --out design-captures/setup
      - name: Capture canon 02 05 06
        run: |
          mkdir -p design-captures/canon
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/design-canon.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          sleep 2
          playwright screenshot --viewport-size=1600,1200 --full-page \
            http://127.0.0.1:4173/docs/design/figma-export/02-search.dc.html \
            design-captures/canon/02-search.png
          playwright screenshot --viewport-size=1600,1200 --full-page \
            http://127.0.0.1:4173/docs/design/figma-export/05-vendor-detail.dc.html \
            design-captures/canon/05-vendor-detail.png
          playwright screenshot --viewport-size=1600,1200 --full-page \
            http://127.0.0.1:4173/docs/design/figma-export/06-onboarding-login.dc.html \
            design-captures/canon/06-onboarding-login.png
      - name: Validation manifest
        if: always()
        run: |
          mkdir -p design-captures
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "branch=$(git branch --show-current)"
            echo "workflow=Validate PR 273 Current Head"
          } > design-captures/validation.txt
      - name: Upload missing design captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr273-current-head-missing-design-captures
          path: design-captures/
          if-no-files-found: warn
          retention-days: 7

  api-tests:
    name: API Tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: weddingpick
          POSTGRES_PASSWORD: weddingpick
          POSTGRES_DB: weddingpick_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://weddingpick:weddingpick@localhost:5432/weddingpick_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run API shard
        run: npm run test --workspace @weddingpick/api -- --shard=${{ matrix.shard }}/2
