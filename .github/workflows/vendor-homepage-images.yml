# 업체 공식 홈페이지에서 대표 이미지를 찾아 붙인다.
#
# 「우선 업체 공식 홈페이지의 대표 이미지를 사용한다 · 업체 정보는 지우지 말고
# 홈페이지 이미지를 활용해 최대한 매칭 시킨다」(2026-09-10 사용자 오더).
#
# 기본은 **확인만** 한다. 실제로 붙이려면 apply를 true로 준다.
name: 업체 홈페이지 대표 이미지

on:
  workflow_dispatch:
    inputs:
      target:
        description: '어느 DB에'
        type: choice
        default: default
        options:
          - default
          - staging
      limit:
        description: '이번에 볼 업체 수'
        type: string
        default: '300'
      apply:
        description: '실제로 붙인다 (끄면 찾아만 본다)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 홈페이지 대표 이미지 찾기
        env:
          DEFAULT_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          # 카카오 REST API 키. 로그인에 쓰는 앱의 키를 그대로 쓴다(웹문서 검색).
          KAKAO_APP_KEY: ${{ secrets.KAKAO_APP_KEY || vars.KAKAO_APP_KEY }}
          TARGET: ${{ github.event.inputs.target }}
          LIMIT: ${{ github.event.inputs.limit }}
          APPLY: ${{ github.event.inputs.apply }}
        run: |
          case "${TARGET:-default}" in
            staging) export DATABASE_URL="$STAGING_DATABASE_URL" ;;
            *)       export DATABASE_URL="$DEFAULT_DATABASE_URL" ;;
          esac
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::${TARGET:-default} 대상의 접속 정보가 GitHub Secrets에 없다."
            exit 1
          fi
          if [ -z "${KAKAO_APP_KEY:-}" ]; then
            echo "::error::KAKAO_APP_KEY가 없다. 저장소 Settings → Secrets and variables → Actions 에 같은 이름으로 넣는다(infra/render-env.yml의 값과 같다)."
            exit 1
          fi
          echo "대상: ${TARGET:-default} · 업체 ${LIMIT:-300}곳"
          if [ "$APPLY" = "true" ]; then
            npx tsx scripts/vendor-homepage-images.ts --yes
          else
            npx tsx scripts/vendor-homepage-images.ts
          fi
