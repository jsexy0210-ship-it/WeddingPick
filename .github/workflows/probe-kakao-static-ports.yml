name: Probe Kakao Static Ports

on:
  workflow_call:

permissions:
  contents: read

jobs:
  install:
    name: Install temporary HTTPS probes
    runs-on: [self-hosted, Linux, X64, weddingpick-kakao]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: bash ./scripts/probe-kakao-static-ports.sh

  public-probe:
    name: Probe public 8443 and 9443
    needs: [install]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe both candidate ports independently
        shell: bash
        run: |
          set +e
          failures=0

          probe() {
            local port="$1" expected="$2" label="$3"
            local headers code status
            headers="$(mktemp)"
            code="$(curl --silent --show-error --connect-timeout 5 --max-time 12 \
              --dump-header "$headers" --output /dev/null --write-out '%{http_code}' \
              "https://210.109.82.212:${port}/")"
            status=$?

            if [ "$status" -eq 0 ] && [ "$code" = 204 ] && grep -qi "^X-WeddingPick-Probe: ${expected}" "$headers"; then
              echo "${label}_port=${port}:open"
            else
              echo "${label}_port=${port}:blocked_or_failed"
              failures=$((failures + 1))
            fi
          }

          probe 8443 static-admin admin
          probe 9443 static-web web

          exit "$failures"

  cleanup:
    name: Remove temporary HTTPS probes
    if: always()
    needs: [install, public-probe]
    runs-on: [self-hosted, Linux, X64, weddingpick-kakao]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: bash ./scripts/cleanup-kakao-static-port-probes.sh
