name: Probe Kakao Website Port

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: weddingpick-kakao-vm-write
  cancel-in-progress: false

jobs:
  install:
    name: Install temporary HTTPS probes
    environment: production
    runs-on: [self-hosted, Linux, X64, weddingpick-kakao]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Enforce admin 443 origin lock
        run: bash ./scripts/assert-admin-origin-443.sh
      - run: bash ./scripts/probe-kakao-static-ports.sh

  public-probe:
    name: Probe public 9443
    needs: [install]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe website candidate port
        shell: bash
        run: |
          set +e
          failures=0

          probe() {
            local port="$1" expected="$2" label="$3"
            local headers code status
            headers="$(mktemp)"
            code="$(curl --silent --show-error --connect-timeout 5 --max-time 12 \
              --dump-header "$headers" --output /dev/null --write-out '%{http_code}' \
              "https://210.109.82.212:${port}/")"
            status=$?

            if [ "$status" -eq 0 ] && [ "$code" = 204 ] && grep -qi "^X-WeddingPick-Probe: ${expected}" "$headers"; then
              echo "${label}_port=${port}:open"
            else
              echo "${label}_port=${port}:blocked_or_failed"
              failures=$((failures + 1))
            fi
          }

          probe 9443 static-web web

          exit "$failures"

  cleanup:
    name: Remove temporary HTTPS probes
    if: always()
    needs: [install, public-probe]
    runs-on: [self-hosted, Linux, X64, weddingpick-kakao]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: bash ./scripts/cleanup-kakao-static-port-probes.sh
