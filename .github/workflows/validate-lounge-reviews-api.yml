name: Validate lounge reviews API branch

on:
  push:
    branches:
      - 'chatgpt/lounge-reviews-api-20260918'

permissions:
  contents: read

concurrency:
  group: validate-lounge-reviews-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: weddingpick
          POSTGRES_PASSWORD: weddingpick
          POSTGRES_DB: weddingpick_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://weddingpick:weddingpick@localhost:5432/weddingpick_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: API typecheck
        run: npm run typecheck --workspace @weddingpick/api
      - name: API contract typecheck
        run: npm run typecheck --workspace @weddingpick/api-contract
      - name: Review contract regression
        working-directory: packages/api-contract
        run: npx jest src/reviews.test.ts --runInBand --forceExit
      - name: Review API regression
        working-directory: apps/api
        run: npx jest src/test/reviews.test.ts --runInBand --forceExit
