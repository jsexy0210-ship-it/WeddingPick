# 직접 설치용 EAS APK — eas.json의 기존 "preview" profile(android.buildType=apk)로 빌드한다.
#
# .github/workflows/android-apk.yml 은 EAS 없이 로컬 gradle로 APK를 만드는 빠른 경로다.
# 이 워크플로는 그것과 달리 실제 EAS 빌드 파이프라인(자격증명 관리 포함)을 그대로 타면서
# 스토어용 app-bundle이 아닌 설치용 apk 산출물을 받고 싶을 때 쓴다.
#
# Actions 탭 → "EAS Android APK (preview)" → Run workflow.
# 완료되면 실행 화면 하단 Artifacts에 .apk가 붙는다.
#
# 필요한 GitHub Secret: EXPO_TOKEN (release.yml, eas-init.yml과 동일)
name: EAS Android APK (preview)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm i -g eas-cli

      - run: npm ci

      - name: Check token
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN 시크릿이 없습니다."
            exit 1
          fi

      # preview profile은 eas.json에 이미 있다 (android.buildType: "apk").
      # `--output`은 `--local` 빌드에서만 쓸 수 있어서(클라우드 빌드는 즉시 실패한다),
      # --json으로 결과를 받아 artifacts.buildUrl을 직접 내려받는다.
      - name: EAS Build (preview → apk)
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail

          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --json > /tmp/eas-build.json

          cat /tmp/eas-build.json

          status=$(jq -r '(.[0].status // .status // "unknown")' /tmp/eas-build.json | tr 'A-Z' 'a-z')
          echo "build status: $status"

          if [ "$status" != "finished" ]; then
            echo "::error::EAS 빌드가 성공적으로 끝나지 않았습니다 (status=$status)"
            exit 1
          fi

          url=$(jq -r '(.[0].artifacts.buildUrl // .artifacts.buildUrl // empty)' /tmp/eas-build.json)
          if [ -z "$url" ]; then
            echo "::error::빌드 아티팩트 URL(artifacts.buildUrl)을 찾지 못했습니다."
            exit 1
          fi

          curl -fL "$url" -o weddingpick-preview.apk

      # AAB를 apk로 이름만 바꾼 산출물이 아닌지 여기서 직접 검증한다.
      # apk/aab 둘 다 zip 컨테이너라서 확장자만으로는 구분되지 않는다 —
      # apk는 최상위에 AndroidManifest.xml(바이너리 XML)과 classes.dex가 있고,
      # aab는 base/manifest/AndroidManifest.xml, BundleConfig.pb 처럼 module 디렉터리 구조를 갖는다.
      #
      # grep -q에 파이프(|)로 넘기면 set -o pipefail 아래에서 grep이 매치를 찾고
      # 먼저 종료할 때 echo가 SIGPIPE(Broken pipe)로 실패해 파이프 전체가 실패로
      # 잡힐 수 있다 — 매치에 성공했는데도 오탐으로 실패한다. here-string(<<<)으로
      # 넘겨 이 문제를 피한다.
      - name: Verify real APK (not a renamed AAB)
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          f=weddingpick-preview.apk

          test -s "$f"

          file "$f" | grep -qi 'Zip\|Android' || { echo "::error::$f is not a valid archive"; exit 1; }

          listing=$(unzip -l "$f")

          grep -q '^\s*[0-9]\+\s.*AndroidManifest\.xml$' <<< "$listing" \
            || { echo "::error::AndroidManifest.xml이 없습니다 — 유효한 apk/aab가 아닙니다."; exit 1; }

          if grep -q 'BundleConfig\.pb' <<< "$listing"; then
            echo "::error::BundleConfig.pb 발견 — 이 파일은 AAB입니다. buildType=apk 설정을 확인하세요."
            exit 1
          fi

          grep -q 'classes\.dex' <<< "$listing" \
            || { echo "::error::classes.dex가 없습니다 — 설치 가능한 apk가 아닙니다."; exit 1; }

          echo "검증 통과: 실기기에 직접 설치 가능한 apk입니다."

      - uses: actions/upload-artifact@v4
        with:
          name: weddingpick-preview-apk
          path: apps/mobile/weddingpick-preview.apk
          if-no-files-found: error
