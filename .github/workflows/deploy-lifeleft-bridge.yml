# bridge-revision: 2026-09-21-domain-live-v3
name: Deploy LifeLeft Bridge

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-lifeleft-bridge.yml
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifeleft-kakao-bridge
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve LifeLeft release
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      changed: ${{ steps.target.outputs.changed }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Compare LifeLeft main with public release
        id: target
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git ls-remote https://github.com/jsexy0210-ship-it/LifeLeft.git refs/heads/main | cut -f1)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]

          live="$(
            curl --fail --silent --show-error --connect-timeout 3 --max-time 8               https://lifeleft.duckdns.org/release.txt 2>/dev/null               | tr -d '\r\n'               || true
          )"

          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$live" = "$sha" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "LifeLeft is already live at $sha"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "LifeLeft deployment target: $sha"
            echo "Current public release: ${live:-none}"
          fi

  build:
    name: Build LifeLeft production static
    if: needs.resolve.outputs.changed == 'true'
    needs: [resolve]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout LifeLeft
        uses: actions/checkout@v5
        with:
          repository: jsexy0210-ship-it/LifeLeft
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
          test -f out/index.html
          test -f out/commute/index.html
          test -f out/salary/index.html
          test -f out/weekends/index.html
          test -f out/work-time/index.html
          test -f out/subscriptions/index.html
          test -f out/survival/index.html
          test -f out/robots.txt
          test -f out/sitemap.xml
          printf '%s\n' "${{ needs.resolve.outputs.sha }}" > out/release.txt

      - name: Upload LifeLeft static
        uses: actions/upload-artifact@v6
        with:
          name: lifeleft-bridge-static
          path: out
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Stage and enable LifeLeft domain
    if: needs.resolve.outputs.changed == 'true'
    needs: [resolve, build]
    runs-on: [self-hosted, Linux, X64, weddingpick-kakao]
    timeout-minutes: 15
    outputs:
      sha: ${{ needs.resolve.outputs.sha }}
    steps:
      - name: Checkout LifeLeft scripts
        uses: actions/checkout@v5
        with:
          repository: jsexy0210-ship-it/LifeLeft
          ref: ${{ needs.resolve.outputs.sha }}
          path: .lifeleft-source
          persist-credentials: false

      - name: Download LifeLeft static
        uses: actions/download-artifact@v4
        with:
          name: lifeleft-bridge-static
          path: .lifeleft-static

      - name: Stage immutable release
        run: |
          set -euo pipefail
          test -f .lifeleft-static/release.txt
          test "$(tr -d '\r\n' < .lifeleft-static/release.txt)" = "${{ needs.resolve.outputs.sha }}"
          bash ./.lifeleft-source/scripts/stage-lifeleft-static.sh             ./.lifeleft-static             "${{ needs.resolve.outputs.sha }}"

      - name: Enable LifeLeft domain and TLS
        run: |
          set -euo pipefail
          bash ./.lifeleft-source/scripts/install-lifeleft-domain.sh             "${{ needs.resolve.outputs.sha }}"             lifeleft.duckdns.org             210.109.82.212

  verify:
    name: Verify LifeLeft public HTTPS
    if: needs.resolve.outputs.changed == 'true'
    needs: [resolve, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Public smoke
        run: |
          set -euo pipefail
          expected="${{ needs.resolve.outputs.sha }}"
          ok=false
          for _ in $(seq 1 24); do
            if curl --fail --silent --show-error --connect-timeout 5 --max-time 15               https://lifeleft.duckdns.org/ > /tmp/lifeleft-home.html; then
              ok=true
              break
            fi
            sleep 10
          done
          [ "$ok" = true ]
          grep -qi '<html' /tmp/lifeleft-home.html
          grep -q 'LIFELEFT' /tmp/lifeleft-home.html

          for path in commute salary weekends work-time subscriptions survival; do
            curl --fail --silent --show-error --connect-timeout 5 --max-time 15               "https://lifeleft.duckdns.org/$path/" >/dev/null
          done

          actual="$(curl --fail --silent --show-error https://lifeleft.duckdns.org/release.txt | tr -d '\r\n')"
          test "$actual" = "$expected"

          curl --fail --silent --show-error --connect-timeout 5 --max-time 15             https://lifeleft.duckdns.org/robots.txt | grep -Fq 'https://lifeleft.duckdns.org/sitemap.xml'
          curl --fail --silent --show-error --connect-timeout 5 --max-time 15             https://lifeleft.duckdns.org/sitemap.xml | grep -Fq 'https://lifeleft.duckdns.org/'

  rollback:
    name: Roll back LifeLeft on failed public verify
    if: ${{ always() && needs.resolve.outputs.changed == 'true' && needs.deploy.result == 'success' && needs.verify.result != 'success' }}
    needs: [resolve, deploy, verify]
    runs-on: [self-hosted, Linux, X64, weddingpick-kakao]
    timeout-minutes: 10
    steps:
      - name: Checkout LifeLeft rollback script
        uses: actions/checkout@v5
        with:
          repository: jsexy0210-ship-it/LifeLeft
          ref: ${{ needs.resolve.outputs.sha }}
          path: .lifeleft-source
          persist-credentials: false

      - name: Restore prior LifeLeft state
        run: bash ./.lifeleft-source/scripts/rollback-lifeleft-domain.sh

  finalize:
    name: Finalize LifeLeft verified release
    if: ${{ needs.resolve.outputs.changed == 'true' && needs.deploy.result == 'success' && needs.verify.result == 'success' }}
    needs: [resolve, deploy, verify]
    runs-on: [self-hosted, Linux, X64, weddingpick-kakao]
    timeout-minutes: 5
    steps:
      - name: Checkout LifeLeft finalize script
        uses: actions/checkout@v5
        with:
          repository: jsexy0210-ship-it/LifeLeft
          ref: ${{ needs.resolve.outputs.sha }}
          path: .lifeleft-source
          persist-credentials: false

      - name: Finalize LifeLeft release
        run: bash ./.lifeleft-source/scripts/finalize-lifeleft-domain.sh
