name: Validate PR409 current
on:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    if: github.head_ref == 'chatgpt/branch-cleanup-race-guard-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: node --test scripts/verification/branch-cleanup-race-guard.test.mjs
