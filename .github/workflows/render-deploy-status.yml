name: Render 배포 상태 확인 (읽기 전용)

on:
  workflow_dispatch:
    inputs:
      service:
        description: '확인할 서비스'
        type: choice
        # Render 대시보드의 이름과 글자 하나까지 같아야 한다(2026-09-10 이름 변경).
        default: WeddingPick-웹뷰(앱 테스트)
        options:
          - WeddingPick-웹뷰(앱 테스트)
          - WeddingPick-웹사이트
          - WeddingPick-운영 API 서버
          # 관리자 콘솔을 별도 출처로 옮기는 자리다(2026-09-10 대표 결정 ·
          # docs/admin-origin-split.md). 2026-09-11에 「쓰지 않는 서비스」로 읽고
          # 목록에서 뺐다가 되돌렸다 — 빌드가 계속 실패하는 것은 버려진 서비스라서가
          # 아니라 Build Command가 아직 대시보드에 안 들어가서다.
          - WeddingPick-관리자 사이트

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 조회
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE: ${{ github.event.inputs.service }}
        run: python3 scripts/render-deploy-status.py
