name: Diagnose LifeLeft runner

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cancel-stale-lifeleft-bridge.yml

permissions:
  actions: write
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Runner state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runners" \
            --jq '.runners[] | [.id,.name,.status,.busy,(.labels|map(.name)|join(","))] | @tsv' \
            | tee /tmp/runners.tsv
          grep -F "weddingpick-kakao" /tmp/runners.tsv
