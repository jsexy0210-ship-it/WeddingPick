name: Clear stale LifeLeft runs

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cancel-stale-lifeleft-bridge.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Force-cancel stale LifeLeft runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for id in 35589954030 35590270221; do
            gh api --method POST               "repos/${GITHUB_REPOSITORY}/actions/runs/$id/force-cancel"               >/dev/null 2>&1 || true
          done

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=30"             --jq '.workflow_runs[]
              | select(.name == "CI / Deploy")
              | select(.status == "queued" or .status == "in_progress" or .status == "pending" or .status == "waiting")
              | [.id, .display_title] | @tsv' |
          while IFS=$'\t' read -r id title; do
            case "$title" in
              "chore: build LifeLeft off the production VM"|"ops: cancel stale LifeLeft bridge run"|"ops: force-cancel stale LifeLeft bridge"|"ops: clear LifeLeft deployment runner queue"|"ops: diagnose Kakao runner state"|"ops: refresh LifeLeft bridge run")
                gh api --method POST                   "repos/${GITHUB_REPOSITORY}/actions/runs/$id/force-cancel"                   >/dev/null 2>&1 || true
                ;;
            esac
          done
