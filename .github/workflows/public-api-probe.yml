# 공공데이터포털 OpenAPI 응답 모양을 한 번 본다. DB·배포에 닿지 않는다.
#
# 작업 세션 컨테이너는 data.go.kr이 막혀 있어 응답을 직접 못 본다(2026-09-24).
# 모양을 모르고 수집기를 짜면 엉뚱한 칸을 읽으므로 러너에서 먼저 본다.
# 키는 로그에 찍지 않고, 전화 · 주소 · 좌표 칸은 값 대신 「값 있음」만 찍는다.
name: 공공 API 응답 조회 (읽기 전용)

on:
  workflow_dispatch:
    inputs:
      endpoint:
        description: 'End Point 주소 — 활용신청 상세의 요청주소 그대로 (apis.data.go.kr · api.data.go.kr만)'
        type: string
        required: true
      key_secret:
        description: '인증키가 든 GitHub Secret 이름'
        type: choice
        default: DATA_GO_KR_WEDDING_HALL_KEY
        options:
          - DATA_GO_KR_WEDDING_HALL_KEY
          - DATA_GO_KR_MARRIAGE_AGENCY_KEY
      params:
        description: '추가 조회 조건(공백 구분 key=value). 기본값 pageNo=1 numOfRows=3 type=json'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: 응답 조회
        env:
          PUBLIC_API_KEY: ${{ secrets[inputs.key_secret] }}
          ENDPOINT: ${{ inputs.endpoint }}
          PARAMS: ${{ inputs.params }}
        run: |
          # PARAMS는 공백으로만 나눈다 — 따옴표 없이 넘겨 글자 그대로 인자가 된다.
          set -f
          node scripts/public-api-probe.mjs "$ENDPOINT" $PARAMS
