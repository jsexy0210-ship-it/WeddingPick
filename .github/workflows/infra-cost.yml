# 기존 인프라 요금 집계만 유지한다. 배포 권한은 전달하지 않는다.
name: 인프라 요금 수집

on:
  # Actions 탭 자동 실행을 만들지 않는다. 필요할 때만 수동 실행한다.
  workflow_dispatch:
    inputs:
      write:
        description: 실제로 적는다 (끄면 받아만 본다)
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: infra-cost
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 요금 받기
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          # 공급자별 이름을 사용한다. 카카오 저장소 키를 NCP에 보내지 않는다.
          NCP_ACCESS_KEY: ${{ secrets.NCP_ACCESS_KEY }}
          NCP_SECRET_KEY: ${{ secrets.NCP_SECRET_KEY }}
          GH_BILLING_TOKEN: ${{ secrets.GH_BILLING_TOKEN }}
          WRITE: ${{ github.event.inputs.write }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL 시크릿이 없다."
            exit 1
          fi
          if [ "$WRITE" = "true" ]; then
            npx tsx scripts/infra-cost.ts --write
          else
            npx tsx scripts/infra-cost.ts
          fi
