name: Cutover Kakao App Web

on:
  workflow_call:
    inputs:
      release_sha:
        required: false
        type: string
        default: ''
      environment_name:
        required: false
        type: string
        default: production
  workflow_dispatch:
    inputs:
      release_sha:
        description: staged static release SHA; blank uses newest staged release
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: weddingpick-kakao-vm-write-v2
  cancel-in-progress: false

jobs:
  precheck:
    name: Verify API dependency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: API health must be green
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --connect-timeout 5 --max-time 15             https://210.109.82.212/health |
            python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("ok") is True and d.get("database")=="ok" else 1)'

  cutover:
    name: Enable app web on 443
    environment: ${{ inputs.environment_name || 'production' }}
    needs: [precheck]
    runs-on: [self-hosted, Linux, X64, weddingpick-kakao]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Enforce admin 443 origin lock
        run: bash ./scripts/assert-admin-origin-443.sh
      - name: Cut over with local smoke
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: bash ./scripts/install-kakao-app-web.sh "$RELEASE_SHA"

  verify:
    name: Verify public app, admin and API routes
    needs: [cutover]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: App login HTML
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --connect-timeout 5 --max-time 15             https://210.109.82.212/login > /tmp/login.html
          grep -qi '<html' /tmp/login.html

      - name: Admin login stays on canonical 443 origin
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
            https://210.109.82.212/admin/login > /tmp/admin.html
          grep -Fq '/_expo/static/js/web/' /tmp/admin.html
          ! grep -Eq '관리자 콘솔 주소가 바뀌었어요|210\.109\.82\.212:8443' /tmp/admin.html

      - name: Website and legal pages are distinct from app fallback
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
            https://210.109.82.212/website.html > /tmp/website.html
          grep -Fq 'wp-header' /tmp/website.html
          ! cmp -s /tmp/login.html /tmp/website.html
          for page in terms privacy; do
            curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
              "https://210.109.82.212/$page.html" > "/tmp/$page.html"
            grep -Fq 'sp-gnb' "/tmp/$page.html"
            ! cmp -s /tmp/login.html "/tmp/$page.html"
          done
          curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
            https://210.109.82.212/assets/site.webmanifest | grep -Fq '"name"'

      - name: Removed Pick completion route stays unavailable
        run: |
          set -euo pipefail
          for path in /pick/done /pick/done/ /pick/done.html; do
            status="$(curl --silent --show-error --connect-timeout 5 --max-time 15 \
              --output /dev/null --write-out '%{http_code}' "https://210.109.82.212$path")"
            test "$status" = 404
          done

      - name: API routes remain proxied
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --connect-timeout 5 --max-time 15             https://210.109.82.212/health |
            python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("ok") is True else 1)'
          curl --fail --silent --show-error --connect-timeout 5 --max-time 15             https://210.109.82.212/v1/auth/providers |
            python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if isinstance(d.get("providers"), list) else 1)'

  rollback:
    name: Roll back app-web if public verify fails
    if: ${{ always() && needs.cutover.result == 'success' && needs.verify.result != 'success' }}
    needs: [cutover, verify]
    runs-on: [self-hosted, Linux, X64, weddingpick-kakao]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: bash ./scripts/rollback-kakao-app-web-update.sh

  finalize:
    name: Finalize verified app-web update
    if: ${{ needs.cutover.result == 'success' && needs.verify.result == 'success' }}
    needs: [cutover, verify]
    runs-on: [self-hosted, Linux, X64, weddingpick-kakao]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: bash ./scripts/finalize-kakao-app-web-update.sh
