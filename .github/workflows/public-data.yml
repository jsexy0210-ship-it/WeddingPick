name: Wedding public data

# 수동 실행과 토요일 정기 크론으로만 돈다. 개발 당시의 작업 브랜치
# (`codex/wedding-public-data-pipeline`)를 보던 push 트리거가 있었는데, 그 브랜치는
# PR #62로 main에 들어간 뒤 삭제됐다 — 없는 브랜치를 보는 트리거라 지운다.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: '검증 후 운영 DB에 반영'
        type: boolean
        default: false
      lookup_keyword:
        description: '업종 코드 조사 — 이름에 이 글자가 들어간 항목만 출력(비우면 해당 단계 전체 출력)'
        type: string
        default: ''
      lookup_level:
        description: '업종 코드 조사 단계. off면 조사 잡을 건너뜀'
        type: choice
        options: ['off', 'large', 'middle', 'small']
        default: 'off'
      lookup_parent_large:
        description: '중/소분류 조사 시 상위 대분류 코드(indsLclsCd)'
        type: string
        default: ''
      lookup_parent_middle:
        description: '소분류 조사 시 상위 중분류 코드(indsMclsCd)'
        type: string
        default: ''
      lookup_raw:
        description: '업종 조회 응답 원문 앞부분을 출력(파싱 0건일 때 응답 모양 확인용)'
        type: boolean
        default: false
      limit:
        description: '소량 확인 — 이 수만큼만 받고 멈춘다(예: 100). 비우면 전수. 전수 전에 무엇이 어떤 업종으로 들어오는지 볼 때 쓴다'
        type: string
        default: ''
      upjong_codes:
        description: '이번 실행에만 쓸 업종코드(쉼표 구분). 비우면 저장소 Variables의 SBIZ_UPJONG_CODES를 쓴다'
        type: string
        default: ''
      upjong_div_id:
        description: '업종코드 자리. 비우면 저장소 Variables 또는 indsLclsCd'
        type: choice
        options: ['', 'indsLclsCd', 'indsMclsCd', 'indsSclsCd']
        default: ''
  # 크론을 되살린다(2026-09-11 대표 지시 — 「지속 수집한다」). 2026-09-09에 끄면서
  # 적어 둔 세 조건이 모두 섰다.
  #
  #   업종 코드 확정 — collect.ts WEDDING_UPJONG_CODES. 2026-09-10 smallUpjongList를
  #     실 키로 불러 1,255개 중에서 고른 값이다(추측이 아니다). 설정이 있으면
  #     SBIZ_UPJONG_CODES가 이긴다.
  #   0건 가드 — 업종코드가 0건을 돌려주면 collect.ts가 던지고, 지역 필터에서 전부
  #     빠져 accepted=0이 된 경우는 아래 「수집 결과 0건 확인」이 잡는다. 두 겹인
  #     것은 수집기가 지역 필터 탈락을 알 수 없기 때문이다.
  #   건수 상한 — 같은 단계의 PUBLIC_DATA_MAX_APPLY 확인과 run.ts의 MAX_APPLY.
  #     분류가 어긋나 상권 자료가 통째로 들어오는 것을 0건과 같은 무게로 막는다.
  #
  # **이 크론은 DB에 쓰지 않는다.** 아래 「Apply to existing database」가 inputs.apply를
  # 보는데 schedule 이벤트에는 inputs가 없어 항상 거짓이다 — 크론은 수집·검증까지만
  # 하고 산출물만 남긴다. 첫 실제 반영은 사람이 workflow_dispatch에서 켤 때 한다.
  #
  # 시각은 UTC다(GitHub Actions). '17 18 * * 6' = 토요일 18:17 UTC = 일요일 03:17 KST.
  # 여기 값은 UTC 그대로 둔다 — KST로 고쳐 적으면 아홉 시간 밀린다.
  schedule:
    - cron: '17 18 * * 6'

permissions:
  contents: read
concurrency:
  group: wedding-public-data
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: weddingpick
          POSTGRES_PASSWORD: weddingpick_test
          POSTGRES_DB: weddingpick_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace @weddingpick/api
      - run: npm test --workspace @weddingpick/api -- --runTestsByPath src/public-data/collect.test.ts src/public-data/sync.test.ts
        env:
          DATABASE_URL: postgres://weddingpick:weddingpick_test@localhost:5432/weddingpick_test

  collect:
    needs: verify
    runs-on: ubuntu-latest
    # 전국 전수는 업종코드마다 1,000건씩 페이지를 넘긴다 — 15분으로는 모자란다.
    timeout-minutes: 60
    # SBIZ_API_KEY 유무를 `if:`에서 secrets.* 로 직접 참조하면 GitHub Actions가
    # 워크플로 파일 자체를 무효로 처리한다(잡이 하나도 안 만들어지고 즉시
    # 실패 — `if:`/`env:`가 아닌 잡 표현식에서 secrets 컨텍스트를 막는 보안
    # 제약). job-level env로 한 번 옮겨 담아 `env.*`로 우회한다.
    env:
      SBIZ_API_KEY: ${{ secrets.SBIZ_API_KEY }}
      # 조회할 업종코드. 저장소 Variables에 쉼표로 넣는다(비밀 아님). 비어 있으면
      # sbiz 출처는 건너뛴다 — 코드를 모른 채 호출하면 조용히 0건이 되기 때문이다.
      # 수동 실행 입력이 있으면 그쪽이 이긴다 — 소량 샘플 검증용.
      SBIZ_UPJONG_CODES: ${{ inputs.upjong_codes || vars.SBIZ_UPJONG_CODES }}
      SBIZ_UPJONG_DIV_ID: ${{ inputs.upjong_div_id || vars.SBIZ_UPJONG_DIV_ID }}
      # 한 실행이 받아들일 수 있는 업체 수의 상한. 수집기의 기본값(run.ts MAX_APPLY)과
      # 같은 값을 여기 적어 둔다 — 저장소 Variables에 넣으면 그쪽이 이긴다.
      # 올릴 때는 리포트의 total·accepted를 보고 정한다. 짐작으로 올리지 않는다.
      PUBLIC_DATA_MAX_APPLY: ${{ vars.PUBLIC_DATA_MAX_APPLY || '50000' }}
      # 소량 확인 상한. 수동 실행에서만 채운다 — 크론은 비어서 전수로 돈다.
      PUBLIC_DATA_LIMIT: ${{ inputs.limit }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: icheon-halls
            needs_sbiz_key: false
          - source: jecheon-halls
            needs_sbiz_key: false
          # 전국 전수. 시도 출처는 같은 전국 응답을 받아 그 밖을 버리므로,
          # 「웨딩 관련업체 싹다」는 이 출처 하나로 받는다.
          - source: sbiz-all
            needs_sbiz_key: true
          - source: sbiz-seoul
            needs_sbiz_key: true
          - source: sbiz-gyeonggi
            needs_sbiz_key: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 키가 없을 때 수집 스텝을 건너뛰면 잡이 초록으로 끝나 수집 0건인 것을
      # 아무도 모른다. 건너뛰지 않고 명시적으로 실패시켜 드러낸다.
      - name: SBIZ_API_KEY · 업종코드 확인
        if: ${{ matrix.needs_sbiz_key }}
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          set -euo pipefail
          if [ -z "${SBIZ_API_KEY:-}" ]; then
            echo "::error::SBIZ_API_KEY 시크릿이 없어 '$SOURCE' 수집을 실행할 수 없습니다. GitHub 저장소 → Settings → Secrets and variables → Actions → Repository secrets → New repository secret 에서 이름을 SBIZ_API_KEY 로 등록하세요(공공데이터포털 일반 인증키의 Encoding 값 그대로)."
            exit 1
          fi
          # 업종코드가 비어 있어도 멈추지 않는다. 수집기에 조회로 확인한 기본값이
          # 있다(collect.ts WEDDING_UPJONG_CODES · 2026-09-10 smallUpjongList 실측).
          # 이 확인이 멈춰 세우던 때는 코드를 아무도 몰라 조용한 0건이 나던 시절이다.
          if [ -z "${SBIZ_UPJONG_CODES:-}" ]; then
            echo "업종코드 설정이 없어 확인된 기본값으로 수집합니다."
          fi
      - name: Collect validated public data
        run: npm run public-data:import --workspace @weddingpick/api -- --source "$SOURCE" --out ../../.collection
        env:
          SOURCE: ${{ matrix.source }}
      # 0건 수집은 성공이 아니다. 운영 DB에 반영하기 전에 여기서 멈춘다.
      # (수집기 자체도 업종코드가 0건을 돌려주면 실패하지만, 지역 필터에서
      #  전부 빠지는 경우는 수집기가 알 수 없어 이 확인이 따로 필요하다.)
      - name: 수집 결과 0건 확인
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          set -euo pipefail
          REPORT=".collection/$SOURCE-report.json"
          if [ ! -f "$REPORT" ]; then
            echo "::error::$REPORT 이 없습니다. 수집이 리포트를 남기지 못했습니다."
            exit 1
          fi
          ACCEPTED=$(node -e "process.stdout.write(String(require('./$REPORT').accepted ?? 0))")
          echo "$SOURCE accepted=$ACCEPTED"
          # 잡 요약에 숫자를 남긴다 — 로그 꼬리에 묻히면 매번 로그를 뒤져야 한다.
          node -e "
            const r = require('./$REPORT');
            const t = r.truncated ?? [];
            // 화면 이름으로 적는다 — 코드를 그대로 보여주면 요약을 읽는 사람이 다시 옮겨야 한다.
            const LABEL = {
              wedding_info_company: '결정사', hall: '웨딩홀', studio: '스튜디오', dress: '드레스',
              makeup: '메이크업', hair: '헤어변형', snap: '본식스냅', bouquet: '부케',
              invitation: '청첩장', goods: '예물', dowry: '혼수', honeymoon: '허니문', etc: '기타',
            };
            const line = [
              '### ' + r.source,
              '',
              '| 받은 원본 | 받아들임 | 거른 것 | 중복 | 폐업 |',
              '| --- | --- | --- | --- | --- |',
              '| ' + r.total + ' | ' + r.accepted + ' | ' + r.rejected + ' | ' + r.duplicates + ' | ' + (r.closed ?? 0) + ' |',
              '',
              r.limit ? '**소량 확인 실행이다 — ' + r.limit + '건에서 멈췄다.** 아래 숫자를 전체로 읽지 않는다.' : '',
              '',
              '업종별 — 0건도 적는다. 코드를 안 받아와서 0인 것과 받았는데 없어서 0인 것은 다르다.',
              '',
              '| 업종 | 건수 |',
              '| --- | --- |',
              ...Object.entries(r.categoryCounts ?? {}).map(([k, v]) => '| ' + (LABEL[k] ?? k) + ' | ' + v + ' |'),
              '',
              t.length ? '전수가 아니다 — ' + JSON.stringify(t) : '전수로 받았다.',
              '',
            ].join('\n');
            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, line);
          "
          # 상한에 걸려 다 못 받았으면 전수가 아니다. 초록으로 넘기되 눈에 띄게 남긴다.
          node -e "const t=require('./$REPORT').truncated??[];if(t.length)console.log('::warning::전수가 아니다 — 상한에 걸린 업종코드 '+JSON.stringify(t))"
          if [ "$ACCEPTED" -eq 0 ]; then
            echo "::error::'$SOURCE' 수집 결과가 0건입니다. 초록으로 넘기지 않고 멈춥니다 — 출처 응답 또는 업종 코드를 확인하세요."
            exit 1
          fi
          # 건수 상한. 0건이 아닌 것만으로는 부족하다 — 분류가 어긋나면 상권 자료가
          # 통째로 들어오고, 그건 0건보다 되돌리기 어렵다. 수집기도 --apply 직전에
          # 같은 상한으로 거절하지만(run.ts MAX_APPLY), 크론은 --apply 없이 도는
          # 무인 실행이라 여기서 먼저 드러내야 사람이 본다.
          if [ "$ACCEPTED" -gt "$PUBLIC_DATA_MAX_APPLY" ]; then
            echo "::error::'$SOURCE' 수집 결과가 ${ACCEPTED}건으로 상한 ${PUBLIC_DATA_MAX_APPLY}건을 넘습니다. 업종 분류 또는 업종 코드가 어긋났는지 먼저 확인하세요. 이 양이 맞다면 저장소 Variables의 PUBLIC_DATA_MAX_APPLY를 올립니다."
            exit 1
          fi
      # **크론은 DB에 쓰지 않는다.** 전에는 조건에 `github.event_name == 'schedule'`이
      # 있어서 토요일 크론(17 18 * * 6)이 사람 없이 secrets.DATABASE_URL(운영 DB)에
      # 반영했다. 아직 한 번도 실제 수집이 성공한 적 없는 파이프라인이라 첫 쓰기가
      # 무인 실행이 될 참이었다. 반영은 사람이 workflow_dispatch에서 apply를 켤 때만
      # 한다 — 크론은 수집·0건 검증까지만 하고 산출물만 남긴다.
      - name: Apply to existing database
        if: github.ref == 'refs/heads/main' && inputs.apply
        run: npm run public-data:import --workspace @weddingpick/api -- --source "$SOURCE" --apply --out ../../.collection
        env:
          SOURCE: ${{ matrix.source }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-data-${{ matrix.source }}
          path: .collection/*.json
          # .collection은 점으로 시작해 숨김으로 취급된다 — 이 줄이 없으면 비어서 올라간다.
          include-hidden-files: true
          # 기본값 warn은 «올릴 파일이 없다»를 경고만 내고 초록으로 넘긴다. 수집이
          # 실패해 산출물이 없는 것을 성공으로 보이게 하지 않는다. 저장소의 다른
          # 업로드(android-apk.yml · eas-apk-preview.yml)도 error를 쓴다.
          if-no-files-found: error
          retention-days: 7

  # sbiz 업종 대/중/소분류 진짜 코드 조사용. lookup_level을 고르면 돈다.
  # 수집기는 업종코드를 하드코딩하지 않으므로(collect.ts) 여기서 확인한 코드를
  # 저장소 Variables의 SBIZ_UPJONG_CODES에 넣어야 sbiz 출처가 돈다.
  # 대분류 → 중분류 → 소분류 순으로 상위 코드를 넣어가며 좁힌다.
  lookup-category:
    if: github.event_name == 'workflow_dispatch' && inputs.lookup_level != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 업종 코드 조회
        run: |
          npm run public-data:import --workspace @weddingpick/api -- \
            --lookup-category --level "$LEVEL" \
            ${KEYWORD:+--keyword "$KEYWORD"} \
            ${PARENT_LARGE:+--parent-large "$PARENT_LARGE"} \
            ${PARENT_MIDDLE:+--parent-middle "$PARENT_MIDDLE"} \
            $RAW
        env:
          RAW: ${{ inputs.lookup_raw && '--raw' || '' }}
          LEVEL: ${{ inputs.lookup_level }}
          KEYWORD: ${{ inputs.lookup_keyword }}
          PARENT_LARGE: ${{ inputs.lookup_parent_large }}
          PARENT_MIDDLE: ${{ inputs.lookup_parent_middle }}
          SBIZ_API_KEY: ${{ secrets.SBIZ_API_KEY }}
