name: Diagnose API open handles shards

on:
  push:
    branches:
      - chatgpt/api-open-handles-shards-20260918

permissions:
  contents: read

jobs:
  diagnose:
    name: detect handles ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: weddingpick
          POSTGRES_PASSWORD: weddingpick
          POSTGRES_DB: weddingpick_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weddingpick -d weddingpick_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://weddingpick:weddingpick@localhost:5432/weddingpick_test

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Detect open handles in API shard
        run: npm exec --workspace @weddingpick/api -- jest --runInBand --detectOpenHandles --shard=${{ matrix.shard }}/2
