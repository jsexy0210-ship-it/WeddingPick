# 테스트용 안드로이드 APK. 스토어 배포용 EAS 빌드와 분리한다.
name: Android APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 앱이 붙을 API 주소
        required: false
        default: 'https://210.109.82.212'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - run: npm ci
      - name: Prebuild
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
      - name: Assemble
        working-directory: apps/mobile/android
        env:
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
          EXPO_PUBLIC_KAKAO_CLIENT_ID: 73d13d819afd9d14f20de20b8dff46b8
          EXPO_PUBLIC_GOOGLE_CLIENT_ID: 595165026523-dd5s0fqtle78e03mb34m9iaclpdmlb9r.apps.googleusercontent.com
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 595165026523-3mlcq960r5q174h6chun8mommjkpt0qi.apps.googleusercontent.com
          EXPO_PUBLIC_NAVER_CLIENT_ID: tgp4WVYlYO_qd2nyvHug
          # 기존 OAuth 등록값은 배포 주소가 아니다. 제공자 전환 검증 전까지 보존한다.
          EXPO_PUBLIC_NAVER_REDIRECT_URI: https://weddingpickl-sg.onrender.com/v1/auth/naver/callback
        run: >-
          ./gradlew assembleRelease
          --build-cache
          --no-daemon
          --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
      - uses: actions/upload-artifact@v6
        with:
          name: weddingpick-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
