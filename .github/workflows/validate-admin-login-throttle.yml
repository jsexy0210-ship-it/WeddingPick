name: Validate admin login throttle branch

on:
  push:
    branches:
      - chatgpt/admin-login-db-throttle-20260918

permissions:
  contents: read

concurrency:
  group: validate-admin-login-throttle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: weddingpick
          POSTGRES_PASSWORD: weddingpick
          POSTGRES_DB: weddingpick_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://weddingpick:weddingpick@localhost:5432/weddingpick_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Workspace typecheck
        run: npm run typecheck

      - name: Repository lint
        run: npm run lint

      - name: Auth hardening harness
        run: |
          npm run test:auth-hardening
          npm run test:web-shell-auth
          npm run test:root-entry

      - name: Admin login throttle DB regression
        run: npx jest src/test/admin-login.test.ts --runInBand --forceExit
        working-directory: apps/api

      - name: Full API regression
        run: npm run test --workspace @weddingpick/api

      - name: DB package regression
        run: npm run test --workspace @weddingpick/db
