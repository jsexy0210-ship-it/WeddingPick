# 검증 브랜치 전용. 테스트를 통과한 웹 산출물을 그대로 사용한다.
name: Design visual inspection (isolated)
on:
  push:
    branches: [codex/design-validation-20260918-273]
permissions:
  contents: read
  actions: read
jobs:
  capture:
    if: contains(github.event.head_commit.message, '[visual-check]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 97b484b6914575811ca64a95ea1a1c3e1d64961b
          fetch-depth: 0
          persist-credentials: false
      - name: Restore source matching validation run 35310626253
        run: |
          git config user.name 'Design validation'
          git config user.email 'noreply@users.noreply.github.com'
          git merge --no-commit --no-ff 44eb6a9a09c09276968a6dd885183a7650cf18fa
          python .design-validation/apply.py
          python .design-validation/fixups.py
      - uses: actions/download-artifact@v4
        with:
          name: design-web-preview
          run-id: 35310626253
          github-token: ${{ github.token }}
          path: apps/mobile/dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser tooling on temporary runner only
        run: |
          npm install --global playwright@1.57.0
          playwright install --with-deps chromium
      - name: Give the local fixture server the SPA fallback used for dynamic app paths
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/screenshot-screens.mjs')
          s=p.read_text()
          target="    const candidates = [base, join(base, 'index.html'), `${base.replace(/\\/$/, '')}.html`];"
          assert s.count(target)==1, 'Capture server changed; do not guess a replacement'
          s=s.replace(target,target+"\n    if (!extname(pathname)) candidates.push(join(root, 'index.html'));",1)
          p.write_text(s)
          PY
      - name: Capture application states with fixture-only API traffic
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/design-captures"
          node scripts/screenshot-screens.mjs --wait 2500 --edges --out "$RUNNER_TEMP/design-captures/home" --route / --tap 나중에 2>&1 | tee "$RUNNER_TEMP/design-captures/home.log"
          node scripts/screenshot-screens.mjs --wait 2500 --expand --out "$RUNNER_TEMP/design-captures/home-expanded" --route / --tap 나중에 2>&1 | tee "$RUNNER_TEMP/design-captures/home-expanded.log"
          node scripts/screenshot-screens.mjs --wait 2500 --out "$RUNNER_TEMP/design-captures/vendor" --route /search/11111111-1111-4111-8111-111111111111 2>&1 | tee "$RUNNER_TEMP/design-captures/vendor.log"
          node scripts/screenshot-screens.mjs --wait 2500 --viewport 320x740 --out "$RUNNER_TEMP/design-captures/narrow" --route / --tap 나중에 2>&1 | tee "$RUNNER_TEMP/design-captures/narrow.log"
      - name: Preserve screenshots and diagnostics, never font files or full bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-app-captures-followup
          path: ${{ runner.temp }}/design-captures/
          retention-days: 1
          if-no-files-found: warn
