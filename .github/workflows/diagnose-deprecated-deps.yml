name: Diagnose deprecated dependencies

on:
  push:
    branches:
      - chatgpt/dependency-deprecation-diagnostic-20260918

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Explain deprecated packages
        shell: bash
        run: |
          set -u
          for pkg in whatwg-encoding inflight domexception abab uuid glob eslint; do
            echo "===== npm explain $pkg ====="
            npm explain "$pkg" --all || true
          done
