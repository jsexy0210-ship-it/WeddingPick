name: Verify Kakao Admin on 443

on:
  workflow_call:

permissions:
  contents: read

# 관리자 운영 origin은 https://210.109.82.212/admin 으로 고정됐다.
# 이 옛 cutover workflow는 더 이상 Nginx를 쓰지 않는다. 실제 정적 release 전환은
# app-web 443 cutover가 app과 admin을 같은 immutable release로 함께 갱신한다.
jobs:
  verify:
    name: Verify canonical admin 443 route
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify admin login page
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
            https://210.109.82.212/admin/login > /tmp/admin.html
          grep -qi '<html' /tmp/admin.html

      - name: Verify API still works
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
            https://210.109.82.212/health |
            python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("ok") is True and d.get("database")=="ok" else 1)'
