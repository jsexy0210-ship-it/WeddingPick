name: Validate Design Session 2

on:
  push:
    branches:
      - claude/overhaul-lounge-my
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Wedding Note Lounge MY Visual Validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_API_URL: http://127.0.0.1:39999
      EXPO_PUBLIC_WEB_URL: https://example.invalid
      EXPO_PUBLIC_KAKAO_CLIENT_ID: validation-only
      FIXTURE_HAS_PAYMENT_PROOF: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Related mobile navigation tests
        run: npm run test --workspace @weddingpick/mobile -- --runInBand src/features/navigation/depth-back.test.ts

      - name: Capture fixture contract
        run: npx jest --config packages/api-contract/jest.config.js --rootDir packages/api-contract capture-fixtures --runInBand

      - name: Expo web export
        run: npm run export:web --workspace @weddingpick/mobile

      - name: Install capture browser
        run: |
          npm install --global playwright@1.55.0
          playwright install --with-deps chromium

      - name: Capture Wedding Note states
        run: |
          mkdir -p design-captures/wedding-calendar design-captures/wedding-consult design-captures/wedding-budget
          node scripts/screenshot-screens.mjs --route /wedding --full --edges --wait 1800 --out design-captures/wedding-calendar
          node scripts/screenshot-screens.mjs --route /wedding --tap 상담기록 --full --edges --wait 1800 --out design-captures/wedding-consult
          node scripts/screenshot-screens.mjs --route /wedding --tap 예산현황 --full --edges --wait 1800 --out design-captures/wedding-budget

      - name: Capture Lounge states
        run: |
          mkdir -p design-captures/lounge-review design-captures/lounge-feed design-captures/lounge-expo
          node scripts/screenshot-screens.mjs --route /community --full --edges --wait 1800 --out design-captures/lounge-review
          node scripts/screenshot-screens.mjs --route /community --tap 웨딩정보 --full --edges --wait 1800 --out design-captures/lounge-feed
          node scripts/screenshot-screens.mjs --route /community --tap 박람회 --full --edges --wait 1800 --out design-captures/lounge-expo

      - name: Capture MY states
        run: |
          mkdir -p design-captures/my-root design-captures/my-reports design-captures/my-reviews design-captures/my-scraps design-captures/my-settings design-captures/my-connection
          node scripts/screenshot-screens.mjs --route /my --full --edges --wait 1800 --out design-captures/my-root
          node scripts/screenshot-screens.mjs --route /my/reports --full --edges --wait 1800 --out design-captures/my-reports
          node scripts/screenshot-screens.mjs --route /my/reviews --full --edges --wait 1800 --out design-captures/my-reviews
          node scripts/screenshot-screens.mjs --route /my/scraps --full --edges --wait 1800 --out design-captures/my-scraps
          node scripts/screenshot-screens.mjs --route /my/wedding-settings --full --edges --wait 1800 --out design-captures/my-settings
          node scripts/screenshot-screens.mjs --route /wedding/partner --full --edges --wait 1800 --out design-captures/my-connection

      - name: Capture design canon
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/design-canon.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          sleep 2
          playwright screenshot --viewport-size=390,844 --full-page http://127.0.0.1:4173/docs/design/figma-export/04-wedding-note.dc.html design-captures/canon-wedding-note.png
          playwright screenshot --viewport-size=390,844 --full-page http://127.0.0.1:4173/docs/design/figma-export/07-lounge-my.dc.html design-captures/canon-lounge-my.png

      - name: Validation manifest
        if: always()
        run: |
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "branch=$(git branch --show-current)"
            echo "workflow=Validate Design Session 2"
          } > design-captures/validation.txt

      - name: Upload design captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-session2-captures
          path: design-captures/
          if-no-files-found: warn
