name: Validate PR342 current

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'chatgpt/fix-cors-cutover-restore-20260918-2'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: CORS cutover rollback regression
        run: |
          bash -n scripts/add-kakao-static-cors.sh
          node --test scripts/verification/cors-cutover-restore.test.mjs
