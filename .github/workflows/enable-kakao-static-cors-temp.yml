name: Enable Kakao Static CORS Temp

on:
  push:
    branches:
      - ops/kakao-runtime-smoke

permissions:
  contents: read

jobs:
  apply:
    name: Apply Kakao static CORS
    if: ${{ contains(github.event.head_commit.message || '', '[enable-static-cors-temp]') }}
    runs-on: [self-hosted, Linux, X64, weddingpick-kakao]
    timeout-minutes: 10
    concurrency:
      group: weddingpick-kakao-api-cutover
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: bash ./scripts/add-kakao-static-cors.sh

  verify:
    name: Verify Kakao static CORS
    needs: [apply]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        origin:
          - https://210.109.82.212
          - https://210.109.82.212:8443
          - https://210.109.82.212:9443
    steps:
      - name: Verify preflight
        env:
          ORIGIN: ${{ matrix.origin }}
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          curl --fail --silent --show-error --connect-timeout 5 --max-time 15             --request OPTIONS             --header "Origin: $ORIGIN"             --header "Access-Control-Request-Method: GET"             --dump-header "$headers" --output /dev/null             https://210.109.82.212/v1/auth/providers
          grep -Fqi "access-control-allow-origin: $ORIGIN" "$headers"

  rollback:
    name: Roll back CORS on failure
    if: ${{ always() && needs.apply.result == 'success' && needs.verify.result != 'success' }}
    needs: [apply, verify]
    runs-on: [self-hosted, Linux, X64, weddingpick-kakao]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: bash ./scripts/rollback-kakao-static-cors.sh
