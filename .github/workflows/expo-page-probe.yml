# 박람회 일정 페이지를 읽기만 한다. DB·배포·비밀값을 쓰지 않는다.
# 작업 세션 컨테이너가 외부 사이트를 못 열어 러너에서 대신 받는다(2026-09-24).
name: 박람회 페이지 조회 (읽기 전용)

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 조회할 주소(공백 구분). 비우면 서울·경기 주요 전시장 일정과 검색 결과
        type: string
        default: ''

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: 페이지 조회
        env:
          URLS: ${{ inputs.urls }}
        run: |
          if [ -z "$URLS" ]; then
            URLS="https://www.coex.co.kr/event/exhibitions-calendar/
          https://www.at.or.kr/ac/event/acko311300/calendarList.action
          https://www.kintex.com/web/ko/event/list.do
          https://www.setec.or.kr/
          https://www.scc.or.kr/
          https://search.naver.com/search.naver?query=%EC%84%9C%EC%9A%B8+%EC%9B%A8%EB%94%A9%EB%B0%95%EB%9E%8C%ED%9A%8C+2026
          https://search.naver.com/search.naver?query=%EA%B2%BD%EA%B8%B0+%EC%9B%A8%EB%94%A9%EB%B0%95%EB%9E%8C%ED%9A%8C+2026
          https://html.duckduckgo.com/html/?q=%EC%9B%A8%EB%94%A9%EB%B0%95%EB%9E%8C%ED%9A%8C+2026%EB%85%84+10%EC%9B%94+%EC%84%9C%EC%9A%B8"
          fi
          node scripts/expo-page-probe.mjs $URLS
