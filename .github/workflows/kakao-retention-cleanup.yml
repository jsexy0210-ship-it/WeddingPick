name: Kakao Retention Cleanup

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Actually delete only the current deterministic candidates'
        required: true
        type: boolean
        default: false
      retain:
        description: 'Recovery generations to keep per family (1-20)'
        required: true
        type: string
        default: '3'
      expected_plan_hash:
        description: 'Approved disk-cleanup plan hash (required only when apply=true)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: weddingpick-kakao-vm-write-v2
  cancel-in-progress: false

jobs:
  dry-run:
    name: Audit retention candidates only
    if: ${{ !inputs.apply }}
    runs-on: [self-hosted, Linux, X64, weddingpick-kakao]
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Print deterministic cleanup plan
        env:
          WEDDINGPICK_RETENTION_KEEP: ${{ inputs.retain }}
        run: |
          node ./scripts/cleanup-kakao-retention.mjs
          bash ./scripts/cleanup-kakao-disk.sh

  apply:
    name: Apply approved retention cleanup
    if: ${{ inputs.apply }}
    environment: production
    runs-on: [self-hosted, Linux, X64, weddingpick-kakao]
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Recheck and delete only current candidates
        env:
          WEDDINGPICK_RETENTION_KEEP: ${{ inputs.retain }}
          WP_RETENTION_APPROVED: '1'
        run: node ./scripts/cleanup-kakao-retention.mjs --apply

      - name: Recheck and remove only approved unreferenced disk candidates
        env:
          WP_RETENTION_APPROVED: '1'
          WP_CLEANUP_EXPECTED_PLAN_HASH: ${{ inputs.expected_plan_hash }}
        run: bash ./scripts/cleanup-kakao-disk.sh --apply
