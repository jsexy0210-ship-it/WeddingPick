name: Design Integration Mobile Check

on:
  push:
    branches:
      - claude/overhaul-lounge-my

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Mobile typecheck
        run: npm run typecheck --workspace @weddingpick/mobile
      - name: Mobile tests
        run: npm test --workspace @weddingpick/mobile -- --runInBand
      - name: Expo web export
        env:
          EXPO_PUBLIC_API_URL: https://210.109.82.212
          EXPO_PUBLIC_KAKAO_CLIENT_ID: 8e9a14dd3a0aa1a420bff858460c415c
        run: npm run export:web --workspace @weddingpick/mobile
