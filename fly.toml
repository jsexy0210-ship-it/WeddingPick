# weddingpickl — API 서버 (staging)
# Fly.io 웹 런치로 생성된 앱. 포트·헬스체크·환경변수 보정.
app = 'weddingpickl'
primary_region = 'nrt'

[build]

[processes]
  app = "npm run start --workspace @weddingpick/api"
  worker = "npm run worker --workspace @weddingpick/api"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  processes = ['worker']

[env]
  DATABASE_URL = "from_secret"
  NODE_ENV = 'staging'
  PORT = '3000'
  STORAGE_DRIVER = 's3'
  S3_REGION = 'kr-standard'
  S3_ENDPOINT = 'https://kr.object.ncloudstorage.com'
