<section style="display:flex;flex-direction:column;gap:64px;align-items:flex-start;padding:64px;width:max-content">

  <div style="display:flex;flex-direction:column;gap:12px;max-width:1100px">
    <span style="font-size:14px;line-height:19px;font-weight:700;color:#ff6f61">WeddingPick · Flow Board</span>
    <span style="font-size:40px;line-height:52px;font-weight:700;color:#212124">사용자 흐름 순서</span>

    <div style="display:flex;gap:10px;padding-top:6px">
      <span style="{{ legend }}"><span style="{{ dotKey }}"></span>핵심 루프</span>
      <span style="{{ legend }}"><span style="{{ dotPlain }}"></span>일반 화면</span>
      <span style="{{ legend }}"><span style="{{ dotSheet }}"></span>바텀시트</span>
    </div>
  </div>

  <sc-for list="{{ stages }}" as="g" hint-placeholder-count="18">
    <div style="display:flex;flex-direction:column;gap:16px">

      <a href="{{ g.href }}" style="display:flex;align-items:baseline;gap:12px;text-decoration:none">
        <span style="{{ stageKey }}">{{ g.key }}</span>
        <span style="font-size:26px;line-height:35px;font-weight:700;color:#212124;white-space:nowrap">{{ g.title }}</span>
        <span style="font-size:15px;line-height:22px;color:#868b94;font-variant-numeric:tabular-nums;white-space:nowrap">{{ g.range }}</span>
        <sc-if value="{{ g.note }}">
          <span style="font-size:15px;line-height:22px;color:#4d5159">{{ g.note }}</span>
        </sc-if>
        <span style="font-size:14px;line-height:22px;font-weight:700;color:#ff6f61;white-space:nowrap">{{ g.file }}</span>
      </a>

      <div style="display:flex;gap:10px;flex-wrap:wrap;max-width:1760px">
        <sc-for list="{{ g.steps }}" as="s" hint-placeholder-count="6">
          <span style="{{ s.chip }}">
            <span style="{{ s.numStyle }}">{{ s.no }}</span>
            <span style="{{ chipName }}">{{ s.name }}</span>
            <span style="{{ chipId }}">{{ s.id }}</span>
          </span>
        </sc-for>
      </div>

      <a href="{{ g.href }}" style="{{ g.shot }}">
        <img src="{{ g.png }}" alt="{{ g.title }}" style="{{ g.imgStyle }}">
      </a>
    </div>
  </sc-for>

</section>
