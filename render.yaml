# Render 서비스 정의.
#
# **주의 — 이 파일의 `envVars` 값은 Render에 반영되지 않는다.**
# 반영하려면 Blueprint sync가 돌아야 하는데 `POST /v1/blueprints/{id}/sync`가
# HTTP 오류를 돌려주며 동작하지 않는다(2026-09-07 확인). 그래서 환경변수의 원본은
# `infra/render-env.yml`이고 `.github/workflows/render-env-sync.yml`이 서비스
# 환경변수 API로 직접 넣는다. 값을 바꾸려면 여기가 아니라 그 파일을 고친다.
#
# 여기는 서비스의 생김새(빌드 명령·퍼블리시 경로·routes)를 적어두는 용도로 남긴다.

services:
  # 하이브리드 앱 WebView가 읽는 Expo 정적 웹
  - type: web
    name: weddingpick-app-web
    runtime: static
    staticPublishPath: ./apps/mobile/dist
    autoDeploy: true
    buildCommand: npm run export:web --workspace @weddingpick/mobile
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://weddingpickl.onrender.com
    headers:
      - path: /_expo/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

  # 웹 앱 (정적 사이트)
  - type: web
    name: weddingpick-web
    runtime: static
    staticPublishPath: ./apps/web/dist
    autoDeploy: false
    buildCommand: npm run build --workspace @weddingpick/web
    envVars:
      - key: WEDDINGPICK_CONTACT_EMAIL
        value: help.weddingpick@gmail.com
      # 업체·금액은 빌드할 때 API에서 받아 정적 HTML로 굽는다(apps/web/src/site-data.ts).
      # 이 값이 없으면 search.html의 "많이 확인된 곳"이 «정보를 모으는 중»으로 나가고
      # 업체 상세(/v/*.html)는 한 장도 만들어지지 않는다 — 실제로 그 상태로 배포돼 있었다.
      # 랜딩(index.html)은 이 값과 무관하다 — 고정 업체 정보를 쓴다(landing-v4.ts).
      - key: WEDDINGPICK_API_URL
        value: https://weddingpickl-sg.onrender.com
      # 상세를 미리 만들 업체 id를 쉼표로 준다. 비워두면 상세 페이지가 생기지 않는다 —
      # 어느 업체를 정적으로 낼지는 웹이 고르지 않고 배포하는 쪽이 정한다.
      - key: WEDDINGPICK_WEB_VENDOR_IDS
        sync: false

  # 모바일 웹 export 정적 호스팅 (실제 앱 화면 검수용 + 하이브리드 웹뷰 쉘 POC)
  #
  # apps/mobile을 react-native-web으로 정적 빌드해 서빙한다. 네이티브 앱 쉘의
  # react-native-webview가 이 URL을 불러온다(apps/mobile/src/features/webshell).
  # 생성 후 배포 URL을 apps/mobile/eas.json의 build profile env에
  # EXPO_PUBLIC_WEB_URL로 채우면 웹뷰 쉘도 동작한다(검수 목적만이면 불필요).
  #
  # EXPO_PUBLIC_* 값은 apps/mobile/eas.json의 production 프로필과 동일해야
  # 한다 — 안 넣으면 EXPO_PUBLIC_API_URL이 undefined가 되어 로그인 화면이
  # 제공자 목록을 못 받아오고 빈 화면("지금은 로그인할 수 없어요")만 보인다
  # (2026-09-05, 실제로 겪은 문제 — apps/mobile/src/api/config.ts의
  # isServerConfigured가 false가 되면 provider 목록을 아예 요청하지 않는다).
  # 값 자체는 비밀이 아니다(공개 OAuth Client ID) — eas.json에도 평문으로 있다.
  - type: web
    name: weddingpick-app-web
    runtime: static
    staticPublishPath: ./apps/mobile/dist
    autoDeploy: false
    #
    # **뒤에 붙은 `split-admin-dist.mjs app`은 관리자 화면을 관리자 출처로
    # 넘기는 단계다**(2026-09-10 사용자 결정으로 관리자를 다시 분리했다).
    # 이걸 빼면 관리자가 두 곳에 살아 있고, 한쪽을 고치면 다른 쪽이 낡는다.
    #
    # **넣는 시점이 중요하다.** 관리자 서비스가 실제로 뜨고 그 출처에서 로그인이
    # 되는 것을 확인한 뒤에 이 단계를 켠다 — 먼저 켜면 옛 주소가 아직 살아나지
    # 않은 곳으로 넘어가 관리자 콘솔에 못 들어간다. 로그인 자체는 PR #167로
    # 들어와 있다. 순서는 docs/admin-origin-split.md의 전환 절차를 따른다.
    buildCommand: npm run export:web --workspace @weddingpick/mobile && node scripts/split-admin-dist.mjs app
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://weddingpickl-sg.onrender.com
      # 카카오 REST API 키 — "로그인 리다이렉트 URI"가 등록된 키. 네이티브 앱 키
      # (73d13d81…)를 넣으면 REST /oauth/authorize가 KOE033으로 거부한다.
      # 운영 API의 KAKAO_APP_KEY도 같은 값이어야 토큰 교환·id_token aud가 맞는다.
      - key: EXPO_PUBLIC_KAKAO_CLIENT_ID
        value: 8e9a14dd3a0aa1a420bff858460c415c
      - key: EXPO_PUBLIC_GOOGLE_CLIENT_ID
        value: 595165026523-dd5s0fqtle78e03mb34m9iaclpdmlb9r.apps.googleusercontent.com
      - key: EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID
        value: 595165026523-3mlcq960r5q174h6chun8mommjkpt0qi.apps.googleusercontent.com
      - key: EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID
        value: 595165026523-bg8hu37bq5mll2gr879artmgh4h2a9v0.apps.googleusercontent.com
      - key: EXPO_PUBLIC_NAVER_CLIENT_ID
        value: tgp4WVYlYO_qd2nyvHug
      - key: EXPO_PUBLIC_NAVER_REDIRECT_URI
        value: https://weddingpickl-sg.onrender.com/v1/auth/naver/callback
    routes:
      # expo-router 클라이언트 라우팅 — 없는 경로를 index.html로 되돌린다.
      - type: rewrite
        source: /*
        destination: /index.html
    # `_expo/static/**`(JS·CSS)와 `assets/**`(폰트·이미지)는 파일명에 내용 해시가
    # 박혀 있다(예: entry-5d192faf….js) — 내용이 바뀌면 이름도 바뀌므로 오래
    # 캐시해도 낡은 파일을 오래 붙들 위험이 없다. index.html 등 해시 없는 경로는
    # 여기 안 넣는다 — 그건 배포마다 같은 이름으로 새 내용을 담아야 한다.
    headers:
      - path: /_expo/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

  # 관리자 콘솔 (정적 사이트)
  #
  # **같은 소스에서 같은 export를 돌리고 산출물만 다르게 깎는다.** 관리자 화면은
  # expo-router 트리 하나에 묶여 있어 따로 빌드하려면 react-native-web 파이프라인을
  # 새로 세워야 한다 — 출처를 가르는 목적은 그것 없이 달성된다(2026-09-10 결정).
  #
  # **이 분리로 얻는 것은 출처 분리 하나다.** 관리자 토큰이 사용자 앱과 다른
  # localStorage에 들어가고 사용자 화면 쪽 XSS가 거기 닿지 못한다. **앞단 인증이나
  # IP 제한은 얻지 못한다** — Render 정적 사이트에는 그런 기능이 없다. 화면 코드도
  # 주소를 알면 누구나 받는다. 지켜야 할 것은 화면이 아니라 정보이고, 그건 API의
  # requireOperatorUser가 토큰으로 막는다. 자세한 범위는 docs/admin-origin-split.md.
  #
  # 주소는 `weddingpick-admin.onrender.com/admin/*`이다 — `/admin` 접두어를 뗄 수
  # 없다. expo-router의 static 출력이 URL 경로로 라우트를 찾아서, 경로를 바꿔
  # 내보내면 서버가 보낸 HTML과 클라이언트 라우터가 어긋난다.
  #
  # **이 선언만으로는 서비스가 생기지 않는다** — Blueprint sync가 깨져 있다(위 머리말).
  # 사람이 대시보드에서 만들고 Build Command·Publish Directory를 손으로 넣어야 한다.
  # 절차는 docs/admin-origin-split.md에 있다.
  #
  # **이름이 두 벌이라는 데 주의한다.** 아래 `name`은 이 파일의 다른 서비스들과 같은
  # 규칙인 주소 슬러그(`weddingpick-admin.onrender.com`)다. 대시보드의 표시 이름은
  # **`WeddingPick-관리자 사이트`**이고, `infra/render-env.yml`은 그쪽을 써야 한다 —
  # `scripts/render-env-sync.py`가 표시 이름으로 서비스를 찾기 때문이다(2026-09-10
  # 이름 변경으로 그 파일의 서비스 이름이 전부 표시 이름으로 바뀌었다).
  - type: web
    name: weddingpick-admin
    runtime: static
    staticPublishPath: ./apps/mobile/dist
    autoDeploy: false
    buildCommand: npm run export:web --workspace @weddingpick/mobile && node scripts/split-admin-dist.mjs admin
    # app-web과 같은 값이어야 한다 — 같은 번들이 같은 API를 부른다. 없으면
    # isServerConfigured가 false가 되어 로그인 화면이 빈 채로 뜬다.
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://weddingpickl-sg.onrender.com
      - key: EXPO_PUBLIC_KAKAO_CLIENT_ID
        value: 8e9a14dd3a0aa1a420bff858460c415c
      - key: EXPO_PUBLIC_GOOGLE_CLIENT_ID
        value: 595165026523-dd5s0fqtle78e03mb34m9iaclpdmlb9r.apps.googleusercontent.com
      - key: EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID
        value: 595165026523-3mlcq960r5q174h6chun8mommjkpt0qi.apps.googleusercontent.com
      - key: EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID
        value: 595165026523-bg8hu37bq5mll2gr879artmgh4h2a9v0.apps.googleusercontent.com
      - key: EXPO_PUBLIC_NAVER_CLIENT_ID
        value: tgp4WVYlYO_qd2nyvHug
      - key: EXPO_PUBLIC_NAVER_REDIRECT_URI
        value: https://weddingpickl-sg.onrender.com/v1/auth/naver/callback
    routes:
      # expo-router 클라이언트 라우팅 — 없는 경로를 index.html로 되돌린다.
      # index.html은 split-admin-dist.mjs가 /admin/home으로 넘기는 쪽지로 바꿔 둔다.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /_expo/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

  # API 서버 — 2026-09-05: 실제 운영 API(weddingpickl.onrender.com, 이 Blueprint
  # 밖에서 별도 관리됨)와는 별개로 새로 생성된 서비스. 사용자 결정으로 삭제하지
  # 않고 스테이징 API로 활용한다. NODE_ENV를 production으로 두지 않는 이유:
  # apps/api/src/config.ts가 production일 때 STORAGE_DRIVER=s3 + S3_BUCKET을
  # 강제한다 — 스테이징은 로컬 스토리지로 충분하다.
  #
  # **autoDeploy를 끈다(2026-09-09 사용자 결정).** 이 서비스를 부르는 코드가 없다 —
  # 앱도 웹도 `weddingpickl-sg.onrender.com`을 본다(eas.json · infra/render-env.yml).
  # 아무도 안 보는 것이 main push마다 빌드되면 빌드 시간만 먹는다. 스테이징으로
  # 쓸 날에는 대시보드에서 손으로 배포한다.
  - type: web
    name: weddingpick-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: staging
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: KAKAO_APP_KEY
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false
      - key: LEGAL_BUSINESS_NAME
        sync: false
      - key: LEGAL_REPRESENTATIVE
        sync: false
      - key: LEGAL_REGISTRATION_NUMBER
        sync: false
      - key: LEGAL_ADDRESS
        sync: false
      - key: LEGAL_SUPPORT_CONTACT
        value: help.weddingpick@gmail.com
      - key: LEGAL_PRIVACY_OFFICER
        sync: false
      - key: LEGAL_TERMS_EFFECTIVE_ON
        sync: false
      - key: LEGAL_PRIVACY_EFFECTIVE_ON
        sync: false
      - key: LEGAL_TERMS_URL
        sync: false
      - key: LEGAL_PRIVACY_POLICY_URL
        sync: false
      - key: LEGAL_SERVICE_TERMS_URL
        sync: false
      - key: STORAGE_DRIVER
        value: local
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: kr-standard
      - key: S3_ENDPOINT
        value: https://kr.object.ncloudstorage.com
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # 관리자 「링크 미리보기」의 «저장 후 반영하기»가 당기는 주소다. 웹은 정적
      # HTML이라 저장만으로는 문구가 나가지 않고 다시 빌드해야 한다. 값이 없으면
      # 그 단추는 언제 눌러도 실패한다(routes/site-meta.ts) — 선언이 없어서 실패하는
      # 이유조차 대시보드에서 보이지 않았다. Render의 weddingpick-web 배포 훅 주소를
      # 넣는다. API 키를 쓰지 않는 이유는 같은 파일 주석에 적혀 있다.
      - key: RENDER_WEB_DEPLOY_HOOK
        sync: false

  # ── 주기 작업 워커 ────────────────────────────────────────────────────
  #
  # 파기 정리(24시간 자동삭제) · 알림 · 문서 분석을 돌린다. 이 서비스가 없어서
  # 처리방침이 약속한 자동파기가 한 번도 실행되지 않았고, 올린 견적서는 집어갈
  # 프로세스가 없어 「분석 중」에서 나오지 못했다(Release Audit 1차 P0-2 · P0-3).
  #
  # **지금 실제로 도는 것은 API 프로세스 안쪽이다**(apps/api/src/index.ts).
  # Blueprint 동기화가 깨져 있어 이 선언만으로는 서비스가 생기지 않는다 —
  # 사람이 대시보드에서 만들어야 한다. 만든 뒤에는 운영 API의 환경변수에
  # `RUN_WORKER_IN_API=false`를 넣어 한쪽만 돌게 한다. 둘 다 돌아도 같은 문서를
  # 두 번 분석하지는 않는다(FOR UPDATE SKIP LOCKED).
  #
  # DATABASE_URL · ANTHROPIC_API_KEY · S3 자격은 운영 API와 같은 값을 넣는다.
  - type: worker
    name: weddingpick-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: npm run worker --workspace @weddingpick/api
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # 원본을 실제로 지우려면 automatic이어야 한다. manual이면 알리기만 한다.
      - key: RETENTION_MODE
        value: automatic
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: kr-standard
      - key: S3_ENDPOINT
        value: https://kr.object.ncloudstorage.com
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
