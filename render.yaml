services:
  # 웹 앱 (정적 사이트)
  - type: web
    name: weddingpick-web
    runtime: static
    staticPublishPath: ./apps/web/dist
    autoDeploy: true
    buildCommand: npm run build --workspace @weddingpick/web

  # API 서버
  - type: web
    name: weddingpick-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: weddingpick-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: KAKAO_APP_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: kr-standard
      - key: S3_ENDPOINT
        value: https://kr.object.ncloudstorage.com
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

databases:
  - name: weddingpick-db
    plan: free
    databaseName: weddingpick
    user: weddingpick
