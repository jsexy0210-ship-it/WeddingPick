# Render 서비스 정의.
#
# **주의 — 이 파일의 `envVars` 값은 Render에 반영되지 않는다.**
# 반영하려면 Blueprint sync가 돌아야 하는데 `POST /v1/blueprints/{id}/sync`가
# HTTP 오류를 돌려주며 동작하지 않는다(2026-09-07 확인). 그래서 환경변수의 원본은
# `infra/render-env.yml`이고 `.github/workflows/render-env-sync.yml`이 서비스
# 환경변수 API로 직접 넣는다. 값을 바꾸려면 여기가 아니라 그 파일을 고친다.
#
# 여기는 서비스의 생김새(빌드 명령·퍼블리시 경로·routes)를 적어두는 용도로 남긴다.

services:
  # 웹 앱 (정적 사이트)
  - type: web
    name: weddingpick-web
    runtime: static
    staticPublishPath: ./apps/web/dist
    autoDeploy: true
    buildCommand: npm run build --workspace @weddingpick/web
    envVars:
      - key: WEDDINGPICK_CONTACT_EMAIL
        value: help.weddingpick@gmail.com
      # 업체·금액은 빌드할 때 API에서 받아 정적 HTML로 굽는다(apps/web/src/site-data.ts).
      # 이 값이 없으면 search.html의 "많이 확인된 곳"이 «정보를 모으는 중»으로 나가고
      # 업체 상세(/v/*.html)는 한 장도 만들어지지 않는다 — 실제로 그 상태로 배포돼 있었다.
      # 랜딩(index.html)은 이 값과 무관하다 — 고정 업체 정보를 쓴다(landing-v4.ts).
      - key: WEDDINGPICK_API_URL
        value: https://weddingpickl.onrender.com
      # 상세를 미리 만들 업체 id를 쉼표로 준다. 비워두면 상세 페이지가 생기지 않는다 —
      # 어느 업체를 정적으로 낼지는 웹이 고르지 않고 배포하는 쪽이 정한다.
      - key: WEDDINGPICK_WEB_VENDOR_IDS
        sync: false

  # 관리자 패널 (admin.weddingpick.kr)
  - type: web
    name: weddingpick-admin
    runtime: static
    staticPublishPath: ./apps/web/dist
    autoDeploy: true
    buildCommand: npm run build --workspace @weddingpick/web
    routes:
      - type: redirect
        source: /
        destination: /admin.html

  # 모바일 웹 export 정적 호스팅 (실제 앱 화면 검수용 + 하이브리드 웹뷰 쉘 POC)
  #
  # apps/mobile을 react-native-web으로 정적 빌드해 서빙한다. 네이티브 앱 쉘의
  # react-native-webview가 이 URL을 불러온다(apps/mobile/src/features/webshell).
  # 생성 후 배포 URL을 apps/mobile/eas.json의 build profile env에
  # EXPO_PUBLIC_WEB_URL로 채우면 웹뷰 쉘도 동작한다(검수 목적만이면 불필요).
  #
  # EXPO_PUBLIC_* 값은 apps/mobile/eas.json의 production 프로필과 동일해야
  # 한다 — 안 넣으면 EXPO_PUBLIC_API_URL이 undefined가 되어 로그인 화면이
  # 제공자 목록을 못 받아오고 빈 화면("지금은 로그인할 수 없어요")만 보인다
  # (2026-09-05, 실제로 겪은 문제 — apps/mobile/src/api/config.ts의
  # isServerConfigured가 false가 되면 provider 목록을 아예 요청하지 않는다).
  # 값 자체는 비밀이 아니다(공개 OAuth Client ID) — eas.json에도 평문으로 있다.
  - type: web
    name: weddingpick-app-web
    runtime: static
    staticPublishPath: ./apps/mobile/dist
    autoDeploy: true
    buildCommand: npm run export:web --workspace @weddingpick/mobile
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://weddingpickl.onrender.com
      # 카카오 REST API 키 — "로그인 리다이렉트 URI"가 등록된 키. 네이티브 앱 키
      # (73d13d81…)를 넣으면 REST /oauth/authorize가 KOE033으로 거부한다.
      # 운영 API의 KAKAO_APP_KEY도 같은 값이어야 토큰 교환·id_token aud가 맞는다.
      - key: EXPO_PUBLIC_KAKAO_CLIENT_ID
        value: 8e9a14dd3a0aa1a420bff858460c415c
      - key: EXPO_PUBLIC_GOOGLE_CLIENT_ID
        value: 595165026523-dd5s0fqtle78e03mb34m9iaclpdmlb9r.apps.googleusercontent.com
      - key: EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID
        value: 595165026523-3mlcq960r5q174h6chun8mommjkpt0qi.apps.googleusercontent.com
      - key: EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID
        value: 595165026523-bg8hu37bq5mll2gr879artmgh4h2a9v0.apps.googleusercontent.com
      - key: EXPO_PUBLIC_NAVER_CLIENT_ID
        value: tgp4WVYlYO_qd2nyvHug
      - key: EXPO_PUBLIC_NAVER_REDIRECT_URI
        value: https://weddingpickl.onrender.com/v1/auth/naver/callback
    routes:
      # expo-router 클라이언트 라우팅 — 없는 경로를 index.html로 되돌린다.
      - type: rewrite
        source: /*
        destination: /index.html
    # `_expo/static/**`(JS·CSS)와 `assets/**`(폰트·이미지)는 파일명에 내용 해시가
    # 박혀 있다(예: entry-5d192faf….js) — 내용이 바뀌면 이름도 바뀌므로 오래
    # 캐시해도 낡은 파일을 오래 붙들 위험이 없다. index.html 등 해시 없는 경로는
    # 여기 안 넣는다 — 그건 배포마다 같은 이름으로 새 내용을 담아야 한다.
    headers:
      - path: /_expo/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

  # API 서버 — 2026-09-05: 실제 운영 API(weddingpickl.onrender.com, 이 Blueprint
  # 밖에서 별도 관리됨)와는 별개로 새로 생성된 서비스. 사용자 결정으로 삭제하지
  # 않고 스테이징 API로 활용한다. NODE_ENV를 production으로 두지 않는 이유:
  # apps/api/src/config.ts가 production일 때 STORAGE_DRIVER=s3 + S3_BUCKET을
  # 강제한다 — 스테이징은 로컬 스토리지로 충분하다.
  - type: web
    name: weddingpick-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: staging
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: KAKAO_APP_KEY
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false
      # 이메일 로그인 재설정 메일. 스테이징은 console(로그 출력)로 충분하다.
      # PASSWORD_RESET_URL은 weddingpick-web(서비스 웹사이트)의 reset-password.html이다 —
      # 모바일 웹 export(weddingpick-app-web)가 아니다. SPEC.md §3.3 "앱에서 재설정
      # 안 받음 — 메일 링크로 웹에서 처리".
      - key: MAIL_DRIVER
        value: console
      - key: PASSWORD_RESET_URL
        value: https://weddingpick-web.onrender.com/reset-password.html
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: LEGAL_BUSINESS_NAME
        sync: false
      - key: LEGAL_REPRESENTATIVE
        sync: false
      - key: LEGAL_REGISTRATION_NUMBER
        sync: false
      - key: LEGAL_ADDRESS
        sync: false
      - key: LEGAL_SUPPORT_CONTACT
        value: help.weddingpick@gmail.com
      - key: LEGAL_PRIVACY_OFFICER
        sync: false
      - key: LEGAL_TERMS_EFFECTIVE_ON
        sync: false
      - key: LEGAL_PRIVACY_EFFECTIVE_ON
        sync: false
      - key: LEGAL_TERMS_URL
        sync: false
      - key: LEGAL_PRIVACY_POLICY_URL
        sync: false
      - key: LEGAL_SERVICE_TERMS_URL
        sync: false
      - key: STORAGE_DRIVER
        value: local
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: kr-standard
      - key: S3_ENDPOINT
        value: https://kr.object.ncloudstorage.com
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
