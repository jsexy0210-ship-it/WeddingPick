# Render 서비스 환경변수 선언
#
# 이 파일이 원본이다. 여기서 고치면 `.github/workflows/render-env-sync.yml`이
# Render API로 밀어넣는다 — 대시보드를 열어 손으로 넣지 않는다.
#
# **왜 render.yaml이 아니라 이 파일인가.** render.yaml은 Render의 Blueprint가
# 읽어야 반영되는데, 이 저장소의 Blueprint sync는 `POST /v1/blueprints/{id}/sync`가
# HTTP 오류를 돌려주며 동작하지 않는다(2026-09-07 기준). 그래서 서비스의
# 환경변수 API를 직접 부른다. render.yaml은 서비스 정의(빌드 명령·경로)로 남고,
# 값의 원본은 이 파일이다.
#
# **덮어쓰기 규칙.** 키 하나씩 upsert한다. 여기 적히지 않은 키는 건드리지 않는다 —
# 운영 API에는 이 파일에 없는 비밀(DATABASE_URL 등)이 있고, 통째로 바꾸는 API를
# 쓰면 그것들이 지워진다.
#
# `vars`  — 비밀이 아닌 값. 그대로 적는다(공개 client ID·주소 등 이미 앱 번들에 들어가는 값).
# `secrets` — 비밀 값. **이름만** 적고 값은 GitHub Secrets에서 같은 이름으로 읽는다.

services:
  # 모바일 웹 export (앱 화면)
  weddingpick-app-web:
    vars:
      EXPO_PUBLIC_API_URL: https://weddingpickl.onrender.com
      # 카카오 REST API 키 — 로그인 리다이렉트 URI가 등록된 키다.
      # 네이티브 앱 키를 넣으면 /oauth/authorize가 KOE033으로 거부한다.
      EXPO_PUBLIC_KAKAO_CLIENT_ID: 8e9a14dd3a0aa1a420bff858460c415c

  # 서비스 웹사이트
  weddingpick-web:
    vars:
      WEDDINGPICK_CONTACT_EMAIL: help.weddingpick@gmail.com
      # 없으면 search.html의 "많이 확인된 곳"이 «정보를 모으는 중»으로 나가고
      # 업체 상세(/v/*.html)가 한 장도 만들어지지 않는다.
      WEDDINGPICK_API_URL: https://weddingpickl.onrender.com

  # 관리자 (같은 빌드를 쓴다)
  weddingpick-admin:
    vars:
      WEDDINGPICK_CONTACT_EMAIL: help.weddingpick@gmail.com
      WEDDINGPICK_API_URL: https://weddingpickl.onrender.com

  # 운영 API
  WeddingPickl:
    vars:
      # 브라우저에서 API를 부르는 출처. 앱 웹 export와 서비스 웹사이트 둘 다 필요하다 —
      # 비밀번호 재설정 페이지(reset-password.html)가 웹사이트 쪽에서 API를 부른다.
      # 브라우저에서 API를 부르는 출처를 전부 적는다. 하나라도 빠지면 그 화면은
      # preflight에서 막힌다. 관리자(weddingpick-admin)와 커스텀 도메인 두 개가
      # 빠져 있었고, 커스텀 도메인은 이미 활성이라 실제로 차단되고 있었다.
      CORS_ORIGINS: https://weddingpick-app-web.onrender.com,https://weddingpick-web.onrender.com,https://weddingpick-admin.onrender.com,https://weddingpick.kr,https://admin.weddingpick.kr
      # 앱의 EXPO_PUBLIC_KAKAO_CLIENT_ID와 같은 값이어야 토큰 교환과 id_token 검증이 맞는다.
      KAKAO_APP_KEY: 8e9a14dd3a0aa1a420bff858460c415c
      MAIL_DRIVER: resend
      MAIL_FROM: 웨딩픽 <no-reply@weddingpick.kr>
      PASSWORD_RESET_URL: https://weddingpick-web.onrender.com/reset-password.html
    secrets:
      # GitHub Secrets에 같은 이름으로 넣으면 여기로 흘러간다. 없으면 그 키만 건너뛴다.
      #
      # **DATABASE_URL이 여기 있는 이유.** 앱과 배포 파이프라인이 서로 다른 DB를 보고
      # 있었다(2026-09-07). 운영 API는 Render 내부 주소의 빈 DB를 쓰고 있었고
      # (마이그레이션 0/76, schema_migrations 자체가 없었다), CI는 계속 다른 DB에
      # 마이그레이션을 적용해왔다. 그 DB에는 76개가 모두 적용돼 있다. 인증 API가 전부
      # 500이던 원인이 이것이다. 어느 DB를 쓰는지가 대시보드에만 있어서 아무도 볼 수
      # 없었다 — 이제 저장소가 원본이고 바뀌면 diff에 남는다.
      #
      # 되돌리려면 이 줄을 지우고 대시보드에서 옛 값을 넣는다. 키 하나씩 upsert만
      # 하므로 선언에서 빠진다고 Render의 값이 지워지지는 않는다.
      - DATABASE_URL
      - RESEND_API_KEY
      # 카카오 앱의 Client Secret이 「사용함」이라 토큰 교환에 반드시 붙어야 한다.
      # 없으면 인가 코드까지는 받고 /oauth/token에서 거부당한다
      # (apps/api/src/auth/identity-provider.ts — 값이 있을 때만 보낸다).
      - KAKAO_CLIENT_SECRET
