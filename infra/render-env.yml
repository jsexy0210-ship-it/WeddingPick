# Render 서비스 환경변수 선언
#
# 이 파일이 원본이다. 여기서 고치면 `.github/workflows/render-env-sync.yml`이
# Render API로 밀어넣는다 — 대시보드를 열어 손으로 넣지 않는다.
#
# **왜 render.yaml이 아니라 이 파일인가.** render.yaml은 Render의 Blueprint가
# 읽어야 반영되는데, 이 저장소의 Blueprint sync는 `POST /v1/blueprints/{id}/sync`가
# HTTP 오류를 돌려주며 동작하지 않는다(2026-09-07 기준). 그래서 서비스의
# 환경변수 API를 직접 부른다. render.yaml은 서비스 정의(빌드 명령·경로)로 남고,
# 값의 원본은 이 파일이다.
#
# **덮어쓰기 규칙.** 키 하나씩 upsert한다. 여기 적히지 않은 키는 건드리지 않는다 —
# 운영 API에는 이 파일에 없는 비밀(DATABASE_URL 등)이 있고, 통째로 바꾸는 API를
# 쓰면 그것들이 지워진다.
#
# `vars`  — 비밀이 아닌 값. 그대로 적는다(공개 client ID·주소 등 이미 앱 번들에 들어가는 값).
# `secrets` — 비밀 값. **이름만** 적고 값은 GitHub Secrets에서 같은 이름으로 읽는다.

services:
  # 모바일 웹 export (앱 화면)
  weddingpick-app-web:
    vars:
      EXPO_PUBLIC_API_URL: https://weddingpickl.onrender.com
      # 카카오 REST API 키 — 로그인 리다이렉트 URI가 등록된 키다.
      # 네이티브 앱 키를 넣으면 /oauth/authorize가 KOE033으로 거부한다.
      EXPO_PUBLIC_KAKAO_CLIENT_ID: 8e9a14dd3a0aa1a420bff858460c415c

  # 관리자 콘솔 — **아직 켜지 않는다.**
  #
  # `scripts/render-env-sync.py`는 이름이 정확히 일치하는 서비스를 못 찾으면
  # 그 항목을 실패로 세고 **워크플로 전체를 exit 1로 끝낸다**(main:188). 서비스가
  # 생기기 전에 여기를 켜면 main에 푸시할 때마다 빨간 워크플로가 남는다.
  #
  # 켜는 시점 — Render 대시보드에 `weddingpick-admin` 서비스를 만든 뒤. 그때
  # 아래 주석을 풀고, **대시보드의 실제 서비스 이름과 글자 하나까지 맞춘다**
  # (이 저장소는 슬러그를 쓰지만 운영 API는 `WeddingPickl`처럼 표시 이름과
  # API 이름이 다른 전례가 있다). 절차는 docs/admin-origin-split.md.
  #
  # weddingpick-admin:
  #   vars:
  #     EXPO_PUBLIC_API_URL: https://weddingpickl.onrender.com
  #     EXPO_PUBLIC_KAKAO_CLIENT_ID: 8e9a14dd3a0aa1a420bff858460c415c

  # 서비스 웹사이트
  weddingpick-web:
    vars:
      WEDDINGPICK_CONTACT_EMAIL: help.weddingpick@gmail.com
      # 없으면 search.html의 "많이 확인된 곳"이 «정보를 모으는 중»으로 나가고
      # 업체 상세(/v/*.html)가 한 장도 만들어지지 않는다.
      WEDDINGPICK_API_URL: https://weddingpickl.onrender.com
      # 법적 문서 시행일. **비밀이 아니다** — 약관 페이지에 「시행일 2026년 9월 10일」로
      # 그대로 찍히는 공개 값이다. secrets로 두면 GitHub Secrets에 같은 이름을 손으로
      # 넣어야 하고, 넣지 않으면 동기화가 조용히 건너뛴 뒤 값 없이 빌드에 들어간 웹이
      # 예외로 멈춘다(apps/web/src/legal-config.ts). 저장소에 적어 두면 둘 다 사라진다.
      #
      # 두 문서 모두 2026-09-10(2026-09-10 사용자 결정). 개인정보처리방침은 그동안
      # 시행일 자체가 없었고, 약관은 화면에 2026-09-01로 박혀 있던 것을 이번 개정일로
      # 맞춘다 — 이번에 두 문서의 본문이 함께 바뀌었다.
      LEGAL_TERMS_EFFECTIVE_ON: '2026-09-10'
      LEGAL_PRIVACY_EFFECTIVE_ON: '2026-09-10'

  # 운영 API
  WeddingPickl:
    vars:
      # 웹과 **같은 값이어야 한다.** 앱 약관 화면과 웹 약관 페이지가 서로 다른 시행일을
      # 말하면 어느 쪽이 맞는지 알 수 없다. 지금까지는 이 값이 Render 대시보드에만
      # 있어서 웹이 볼 수 없었다.
      LEGAL_TERMS_EFFECTIVE_ON: '2026-09-10'
      LEGAL_PRIVACY_EFFECTIVE_ON: '2026-09-10'
      # 브라우저에서 API를 부르는 출처. 빠진 출처는 preflight에서 막히고,
      # 브라우저에는 CORS 오류로 뜨지만 서버 로그에는 아무것도 남지 않는다.
      #
      #   app-web        앱 화면. 관리자는 여기서 빠졌다 — admin 출처로 넘긴다
      #   admin          관리자 콘솔(/admin/*, 화면 31장). 별도 출처다
      #   web            서비스 웹사이트
      #   weddingpick.kr web의 커스텀 도메인. onrender 주소만 있으면 이쪽으로 들어온 사람이 막힌다
      #
      # `weddingpick-admin.onrender.com`은 **2026-09-10 사용자 결정으로 되돌렸다.**
      # 2026-09-09에 「관리자는 app-web의 `/admin` 하나로 통일한다」며 뺐던 출처인데,
      # 그 결정을 뒤집고 관리자 콘솔을 다시 별도 출처로 분리했다(docs/admin-origin-split.md).
      # 관리자 화면이 이 API를 브라우저에서 부르므로 빠지면 preflight에서 전부 막힌다.
      #
      # `admin.weddingpick.kr`은 되돌리지 않는다 — 이름 풀이가 안 된다(2026-09-09 실측
      # `NXDOMAIN`, docs/AI_HANDOFF.md). 등록처에 레코드가 들어가 실제로 열리는 날
      # 그때 넣는다. 살아 있지도 않은 출처를 허용 목록에 두지 않는다는 원칙은 그대로다.
      CORS_ORIGINS: https://weddingpick-app-web.onrender.com,https://weddingpick-admin.onrender.com,https://weddingpick-web.onrender.com,https://weddingpick.kr
      # 앱의 EXPO_PUBLIC_KAKAO_CLIENT_ID와 같은 값이어야 토큰 교환과 id_token 검증이 맞는다.
      KAKAO_APP_KEY: 8e9a14dd3a0aa1a420bff858460c415c
      # 원본을 실제로 지운다. **기본값 manual로 두면 아무것도 지워지지 않는다** —
      # 알리기만 하고, 알림을 받을 운영자 기기도 없으면 그마저 아무 데도 안 간다.
      # 처리방침과 이용약관이 「업로드 완료 시점부터 최대 24시간 이내 삭제」라고
      # 약속하는데 그 삭제가 한 번도 실행되지 않았다(Release Audit 1차 P0-2).
      # 지우는 주체는 API 프로세스 안에서 도는 주기 작업이다(apps/api/src/index.ts).
      RETENTION_MODE: automatic
      #
      # ── 파일 저장소(네이버 클라우드 Object Storage) ──────────────────────
      #
      # **production은 s3가 아니면 뜨지 않는다**(apps/api/src/config.ts). 로컬
      # 디스크는 Render가 컨테이너를 다시 띄울 때마다 지워져서, 결제 증빙처럼
      # 사람이 올린 파일을 담을 수 없다.
      #
      # NCP Object Storage는 S3 호환이라 endpoint만 바꾸면 그대로 붙는다
      # (apps/api/src/storage/s3.ts — endpoint가 있으면 path-style로 부른다).
      #
      # 여기 값으로 적는 것은 드라이버 하나뿐이다. 버킷 · 리전 · endpoint는 이미
      # GitHub Secrets에 있어서(2026-09-03 등록) 아래 secrets에 이름만 적는다 —
      # 여기 값을 적으면 등록된 값과 달라도 이쪽이 이겨서, 맞는 값을 덮어쓴다.
      STORAGE_DRIVER: s3
    secrets:
      # GitHub Secrets에 같은 이름으로 넣으면 여기로 흘러간다. 없으면 그 키만 건너뛴다.
      #
      # **DATABASE_URL이 여기 있는 이유.** 앱과 배포 파이프라인이 서로 다른 DB를 보고
      # 있었다(2026-09-07). 운영 API는 Render 내부 주소의 빈 DB를 쓰고 있었고
      # (마이그레이션 0/76, schema_migrations 자체가 없었다), CI는 계속 다른 DB에
      # 마이그레이션을 적용해왔다. 그 DB에는 76개가 모두 적용돼 있다. 인증 API가 전부
      # 500이던 원인이 이것이다. 어느 DB를 쓰는지가 대시보드에만 있어서 아무도 볼 수
      # 없었다 — 이제 저장소가 원본이고 바뀌면 diff에 남는다.
      #
      # 되돌리려면 이 줄을 지우고 대시보드에서 옛 값을 넣는다. 키 하나씩 upsert만
      # 하므로 선언에서 빠진다고 Render의 값이 지워지지는 않는다.
      - DATABASE_URL
      # 카카오 앱의 Client Secret이 「사용함」이라 토큰 교환에 반드시 붙어야 한다.
      # 없으면 인가 코드까지는 받고 /oauth/token에서 거부당한다
      # (apps/api/src/auth/identity-provider.ts — 값이 있을 때만 보낸다).
      - KAKAO_CLIENT_SECRET
      # 공공데이터포털 「소상공인시장진흥공단_상가(상권)정보_API」 운영계정 일반 인증키.
      # 활용기간 2026-09-08~2028-09-08. 값은 GitHub Secrets의 같은 이름에서 읽는다 —
      # 저장소·문서·로그에 값을 적지 않는다. public-data.yml도 같은 시크릿을 쓴다.
      - SBIZ_API_KEY
      # 파일 저장소(NCP Object Storage). 다섯 개 모두 GitHub Secrets에 이미 있다 —
      # 여기 이름을 적어야 Render로 흘러간다. `storage-test.yml`이 같은 이름을 쓴다.
      # 결제 증빙이 들어가는 버킷이므로 **공개 읽기로 두지 않는다.**
      - S3_BUCKET
      - S3_REGION
      - S3_ENDPOINT
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      #
      # ── 법적 고지 8개 ──────────────────────────────────────────────────
      #
      # **하나라도 비어 있으면 운영 API가 뜨지 않는다.** production일 때
      # `assertReleasable`이 던지고, 그 호출이 부팅 경로에 있다
      # (packages/domain/src/release-gate.ts · apps/api/src/index.ts).
      # `TBD` · `미정` · `확인 필요` 같은 임시값도 같은 결과다.
      #
      # 지금까지 이 값들은 Render 대시보드에만 있어서 **저장소에서 채워졌는지
      # 확인할 방법이 없었다**(Release Audit 1차 P0-7). 이름을 여기 적어 두면
      # GitHub Secrets에 같은 이름으로 넣은 값이 흘러가고, 무엇이 필요한지는
      # 이 파일만 보면 된다. 키 하나씩 upsert하므로 GitHub Secrets에 없는
      # 이름은 건너뛴다 — 대시보드에 이미 들어 있는 값을 지우지 않는다.
      - LEGAL_BUSINESS_NAME
      - LEGAL_REPRESENTATIVE
      - LEGAL_REGISTRATION_NUMBER
      - LEGAL_ADDRESS
      - LEGAL_SUPPORT_CONTACT
      - LEGAL_PRIVACY_OFFICER
      # 시행일 둘은 위 vars로 옮겼다. 비밀이 아니고 — 약관 페이지에 그대로 찍힌다 —
      # 양쪽에 두면 둘 중 어느 값이 반영되는지가 sync 순서에 달리게 된다.
